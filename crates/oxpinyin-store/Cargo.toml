[package]
name = "oxpinyin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
redb = { workspace = true }
heed = { workspace = true, optional = true }
cxx = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { workspace = true, optional = true }
bindgen = { workspace = true, optional = true }

[features]
lmdb = ["dep:heed"]
tkrzw = ["dep:cxx", "dep:cxx-build"]
# Berkeley DB 5.3 compatibility backend. Build-time only dependency on
# bindgen (which needs libclang); the runtime dependency is the system
# libdb the distro already ships, linked by name, never vendored.
bdb = ["dep:bindgen"]
