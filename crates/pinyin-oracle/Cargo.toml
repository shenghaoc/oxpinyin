# Keep this package name deliberately. `pinyin` here is the upstream oracle
# domain (libpinyin reproduction target), not project identity, and the frozen
# differential harness earns one legacy prefix. Do not "fix" this to oxpinyin;
# the wire/pin schemas and the default oracle prefix are behavior, not names.
[package]
name = "pinyin-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Differential harness against the source-built libpinyin pin. Never ships."

# Link discovery only; does nothing unless `oracle-ffi` is enabled.
build = "build.rs"

[features]
default = ["kyotocabinet"]
# Links the pin-built libpinyin from tools/oracle/build-oracle.sh.
# Linux-only, and requires the oracle prefix to be present and on-pin.
oracle-ffi = []
# Backend selection, forwarded through oxpinyin-data (one backend per
# binary; see oxpinyin-store's [features] for the model and precedence).
kyotocabinet = ["oxpinyin-data/kyotocabinet"]
tkrzw = ["oxpinyin-data/tkrzw"]
lmdb = ["oxpinyin-data/lmdb"]
redb = ["oxpinyin-data/redb"]

[lints.rust]
unsafe_code = "allow" # FFI to the real libpinyin; // SAFETY: on every block
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Mechanizes the "// SAFETY: on every block" constitution clause.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
must_use_candidate = "warn"

[[bin]]
name = "parity-corpus"
path = "src/bin/parity_corpus.rs"

[[bin]]
name = "parity-diff"
path = "src/bin/parity_diff.rs"

[[bin]]
name = "oracle-paths"
path = "src/bin/oracle_paths.rs"

[[bin]]
name = "oracle-candidates"
path = "src/bin/oracle_candidates.rs"

[[bin]]
name = "oracle-candidate-structure"
path = "src/bin/oracle_candidate_structure.rs"

[[bin]]
name = "parity-sweep"
path = "src/bin/parity_sweep.rs"

[[bin]]
name = "parity-worst"
path = "src/bin/parity_worst.rs"

[[bin]]
name = "corpus-tail"
path = "src/bin/corpus_tail.rs"

[[bin]]
name = "sentence-tail"
path = "src/bin/sentence_tail.rs"

[dependencies]
# Internal workspace crate: the corpus is generated from the frozen syllable
# inventory, and W2-T3 compares against this parser. Not an external dependency.
oxpinyin-core = { path = "../oxpinyin-core" }
# Session + exported tables for portable parity tooling (never ships).
# default-features = false so `--no-default-features` builds actually reach
# the store's backend selection; the [features] block above forwards it.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }
oxpinyin-engine = { path = "../oxpinyin-engine" }

[dev-dependencies]
# Fixture-backed doubles for the portable decode differential.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
# Integration tests share the same internal crates as the parity tooling.
criterion = "0.8"
dhat = "0.3"
# Internal workspace crate, dev-only: the `decode_pass_user_store` bench
# rebuilds oxpinyin-capi's `SharedLm` overlay on the scan harness. Not an
# external dependency, and pinyin-oracle never ships.
# default-features = false so workspace `--no-default-features` runs are not
# re-defaulted through this dev edge.
oxpinyin-user = { path = "../oxpinyin-user", default-features = false }

[[bench]]
name = "scan_perf"
harness = false

[[bench]]
name = "alloc_profile"
harness = false
