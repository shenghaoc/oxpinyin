[package]
name = "oxpinyin-datagen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "model20 → oxpinyin runtime table producers and the fixtures/w3 mini reproduction (library only). Never ships."

[build-dependencies]
# Reads Kyoto Cabinet's library directories for the rpath, as oxpinyin-store
# does (#1434).
pkg-config = { version = "0.3.34", optional = true }

[features]
# tkrzw is the default selected backend (matching oxpinyin-store's
# workspace-default feature set). The other producers (kyotocabinet, bdb)
# are peer implementations behind the same `WriteStore` trait; each is
# chosen explicitly with `--no-default-features --features
# {kyotocabinet|bdb}`. The producers have no command line any more: the
# system data directory is built by libpinyin's own three utilities, which
# `oxpinyin-utils` now provides under their pin names. What remains here is
# the producer library — the `fixtures/w3` `--mini` reproduction and the
# drop-in parity tests — whose tests select the backend by feature.
default = ["tkrzw"]
# Enable the Kyoto Cabinet producer; mirrors oxpinyin-store.
kyotocabinet = ["oxpinyin-store/kyotocabinet", "dep:pkg-config"]
# Enable the Berkeley DB producer; mirrors oxpinyin-store.
bdb = ["oxpinyin-store/bdb"]
# Enable the Tkrzw producer; mirrors oxpinyin-store.
tkrzw = ["oxpinyin-store/tkrzw"]

[lints]
workspace = true

[dependencies]
# ChewingKey encoding for libpinyin-compatible pinyin index output.
oxpinyin-core = { workspace = true }
# default-features = false: the producer set is selected by this crate's own
# features above, never dragged in by the store's default.
oxpinyin-store = { path = "../oxpinyin-store", default-features = false }
# The shared MemoryChunk chunk-format module (checksum, header, mask) the
# chunk writer shares with the runtime reader; tests additionally verify
# produced tables through the real loader. default-features = false so
# workspace `--no-default-features` runs are not re-defaulted through
# this edge.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }

[dev-dependencies]
# The model20 cache locator the ignored producer tests use (`just fetch-model`).
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
tempfile.workspace = true
