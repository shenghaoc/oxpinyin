name: 'tkrzw'
description: |-
  Install the Linux tkrzw overlay port with a vcpkg binary cache.

  tools/dev/vcpkg.py holds every vcpkg step; only the cache actions stay here.
  vcpkg is the runner image's checkout (VCPKG_INSTALLATION_ROOT), and its
  build tools (CMake, Ninja, a C++ compiler, pkg-config) are the image's. It
  runs on the managed CPython, so the calling job must first run
  .github/actions/bootstrap with uv: 'true'.
outputs:
  prefix:
    description: 'The installed triplet prefix.'
    value: ${{ steps.key.outputs.installed }}
  cache-hit:
    description: "Whether the binary cache was restored exactly."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Compute the vcpkg binary cache key
      id: key
      shell: bash
      run: uv run --managed-python python -X utf8 -m tools.dev.vcpkg cache-key --triplet x64-linux-oxpinyin
    - name: Restore the vcpkg binary cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}-${{ hashFiles('vcpkg-overlays/**', 'triplets/**') }}
        restore-keys: |
          ${{ steps.key.outputs.key }}-
    # Installs the overlay port, then publishes the compilation and runtime
    # certification environment and the tools directory.
    - name: Install tkrzw
      shell: bash
      run: uv run --managed-python python -X utf8 -m tools.dev.vcpkg install --triplet x64-linux-oxpinyin
    - name: Save the vcpkg binary cache
      if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
