name: 'contract-verify'
description: |-
  Build the C libraries for one backend cell and verify them against the frozen pin
  observations in fixtures/contract-refs (tools/bisection/contract-diff.py verify). The pin is
  never built or run: the references were captured by tools/oracle/capture-contract.sh.
  The tkrzw cell reads the pinned libpinyin-data package (just fetch-contract-data); the KC and
  BDB cells run only the cases that read no system data. Call this after checkout and the
  bootstrap action with `uv: 'true'`, in a job whose image has the toolchain (and, for tkrzw, after
  the tkrzw action). Directory-read behaviour is probed in the verification scratch directory.

inputs:
  cell:
    description: 'bdb, kc or tkrzw.'
    required: true
  jobs:
    description: 'Concurrent cases.'
    default: '4'

runs:
  using: composite
  steps:
    - name: Provision the managed Python
      shell: bash
      run: |
        set -euo pipefail
        command -v uv >/dev/null || { echo '::error::contract-verify needs uv: pass uv: "true" to the bootstrap action'; exit 1; }
        tools/install-python.sh
    - name: Build the C libraries for this backend
      shell: bash
      env:
        CELL: ${{ inputs.cell }}
      run: |
        set -euo pipefail
        case "$CELL" in
          tkrzw) features=() ;;
          kc) features=(--no-default-features --features oxpinyin-capi/kyotocabinet,oxpinyin-zhuyin-capi/kyotocabinet) ;;
          bdb) features=(--no-default-features --features oxpinyin-capi/bdb,oxpinyin-zhuyin-capi/bdb) ;;
          *) echo "FAIL: unknown cell '$CELL'" >&2; exit 2 ;;
        esac
        cargo build --locked -p oxpinyin-capi -p oxpinyin-zhuyin-capi "${features[@]}"
    - name: Verify against the frozen pin observations
      shell: bash
      env:
        CELL: ${{ inputs.cell }}
        JOBS: ${{ inputs.jobs }}
      run: |
        set -euo pipefail
        extra=()
        if [ "$CELL" = tkrzw ]; then
          data=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev fetch-contract-data | tail -n 1)
          extra=(--data "$data")
        fi
        uv run --no-project --managed-python python -X lazy_imports=normal \
          tools/bisection/contract-diff.py verify "$CELL" target/debug/libpinyin_capi.so \
          --zhuyin-so target/debug/libzhuyin_capi.so "${extra[@]}" --jobs "$JOBS"
