name: coverage

# Line-coverage floor: an advisory PR check for the library-path
# crates the C API facade depends on, and the nightly's coverage lane,
# from one job body. It is not a required check: branch protection
# requires only ci.yml's `ci-aggregate`, which does not depend on this
# workflow, so a red result here does not block a merge on its own. On a
# pull request it runs only when a library-path crate changes
# (docs/safety/ci-strategy.md, Tier 2): a full-workspace llvm-cov run is
# too slow for a docs PR, and these crates are where a dropped
# branch is a parity risk. verify-nightly.yml calls it unconditionally
# (workflow_call) so the whole-tree number is measured every night
# regardless of which paths a PR touched.
#
# Same container conventions as verify-nightly.yml: debian:testing,
# deliberately unpinned — do not "stabilise" it.

on:
  pull_request:
    branches: [main]
    paths:
      - crates/oxpinyin-core/**
      - crates/oxpinyin-engine/**
      - crates/oxpinyin-user/**
      - crates/oxpinyin-data/**
      - crates/oxpinyin-facade/**
      - crates/oxpinyin-training/**
      - crates/oxpinyin-chewing/**
      - crates/oxpinyin-capi-marshal/**
      - crates/oxpinyin-store/**
      - crates/oxpinyin-runtime/**
      - crates/oxpinyin-capi/**
      - crates/oxpinyin-zhuyin-capi/**
      - .github/workflows/coverage.yml
      - .github/actions/**
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned, not ubuntu-latest, so a runner-image move (26.04:
    # actions/runner-images#14748) happens here under review.
    runs-on: ubuntu-26.04
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl jq gcc g++ make libc6-dev pkg-config libclang-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          cargo-llvm-cov: 'true'
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw
      - run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      # Default-backend run measured 85.83% lines on 2026-11-04.
      - run: cargo llvm-cov report --summary-only --fail-under-lines 85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
