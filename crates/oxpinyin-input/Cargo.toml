[package]
name = "oxpinyin-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

# The external-I/O boundary (docs/findings/external-io-boundary.md): the
# crate root denies unsafe code and one module allows it, so the lints are
# the workspace's plus the two that mechanize the constitution's
# "// SAFETY: on every block" clause.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
must_use_candidate = "warn"

[features]
# The pin utilities' boundary (stage 5): their C library calls through
# libc, GLib's option and text calls through glib-sys, and the C++ streams'
# getline through std::io. Tools only.
tools = []

[dependencies]
# Approved for this crate by the 2026-10-31 UTC maintainer rulings: the
# library's path construction through GLib, and the table.conf/user.conf,
# stderr, save and utility calls beside it.
libc.workspace = true
glib-sys.workspace = true
# The existing whole-file private mapping owner, on every platform.
memmap2.workspace = true

[dev-dependencies]
tempfile.workspace = true
