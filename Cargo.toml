[workspace]
resolver = "3"
members = [
  "crates/oxpinyin-chewing",
  "crates/oxpinyin-core",
  "crates/oxpinyin-data",
  "crates/oxpinyin-store",
  "crates/oxpinyin-user",
  "crates/oxpinyin-engine",
  "crates/oxpinyin-facade",
  "crates/oxpinyin-capi",
  "crates/oxpinyin-python",
  "crates/oxpinyin-runtime",
  "crates/pinyin-oracle",
  "crates/oxpinyin-dictool",
  "crates/oxpinyin-segment",
  "crates/oxpinyin-datagen",
  "crates/oxpinyin-counter",
  "crates/oxpinyin-kmm",
  "crates/oxpinyin-lambda",
  "crates/oxpinyin-punct",
  "crates/oxpinyin-word",
  "crates/oxpinyin-eval",
  "crates/oxpinyin-train",
  "crates/oxpinyin-emitter",
  "crates/oxpinyin-corpus",
  "crates/oxpinyin-testsupport",
  "crates/oxpinyin-zhuyin-capi",
]

[workspace.package]
# Lockstep 0.x while pre-1.0; milestones: 0.3=S1b, 0.4=S1c, 0.5=S1d, 0.6+=Stage 2.
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/shenghaoc/oxpinyin"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "deny"
missing_docs = "warn"
# unused_must_use is warn-by-default and CI's -D warnings already promotes
# it; the explicit deny protects local builds that lack the env var.
# unsafe_op_in_unsafe_fn: warn-by-default in edition 2024 — pinned here so
# the FFI crates cannot regress it either.
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Grows #[must_use] coverage on value-returning queries (MISRA R.17.7
# analogue); kept at zero hits — new sites must annotate or consume.
must_use_candidate = "warn"

[workspace.dependencies]
oxpinyin-core = { path = "crates/oxpinyin-core" }
# The four store-backend chain crates carry default-features = false at the
# workspace table so `--no-default-features` builds actually reach the
# store's compile-time backend selection; each consumer's [features] block
# forwards the backend choice explicitly (see oxpinyin-store's [features]
# for the model and precedence).
oxpinyin-data = { path = "crates/oxpinyin-data", default-features = false }
oxpinyin-runtime = { path = "crates/oxpinyin-runtime", default-features = false }
oxpinyin-engine = { path = "crates/oxpinyin-engine" }
oxpinyin-store = { path = "crates/oxpinyin-store", default-features = false }
oxpinyin-user = { path = "crates/oxpinyin-user", default-features = false }
redb = "4"
heed = "0.22"
bindgen = "0.72.1"
smallvec = "1.15"
compact_str = "0.10"
# Perfect-hash text lookups over the frozen syllable inventories;
# oxpinyin-core/build.rs generates the maps, so phf_codegen is build-time only.
phf = "0.11"
phf_codegen = "0.11"
# FxHasher: faster non-cryptic hashing for internal membership sets.
rustc-hash = "2.1"
glib-sys = "0.20"

# Release .so size/speed lever: fat LTO + one codegen unit lets the linker
# drop cross-crate dead code and duplicate generic instantiations that
# per-CGU codegen keeps; panic = "abort" drops the remaining unwind tables.
# Measured effect: docs/perf/perf-so-size-2026-09.md.
#
# panic = "abort" is safe because the no-panic guarantee is mechanically
# enforced (clippy::unwrap_used/expect_used/panic/panic_in_result_fn denied
# in every library crate, non-test scope). The former UB justification for
# catching panics at the C ABI is obsolete since Rust 1.81 (Rust Reference,
# "Unwinding": a panic reaching a non-unwinding ABI boundary aborts, it is
# not undefined behaviour), and the toolchain pins 1.97.1. On a bug panic
# the process now aborts instead of continuing with a sentinel return;
# with the lints green the catch sites were operationally inert. The 116 KiB
# gimli/addr2line symbolizer is unaffected by this setting — it is held by
# std's default panic hook, which still runs to print before aborting, so
# no panic strategy removes it. (An earlier revision of this comment blamed
# std::io::Error backtrace capture; retracted — see the "Symbolizer
# attribution — corrected" section of docs/perf/perf-so-size-2026-09.md.)
# [profile.profiling] keeps its explicit `lto = "thin"` and `panic =
# "unwind"` overrides and inherits codegen-units from here.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Stage-2 CPU profiles: release speed with enough debug to resolve stacks.
# `debug = "line-tables-only"` keeps the image small; samply/perf still map
# samples to functions and source lines. `lto = "thin"` is closer to a
# realistic cargo-c install than fat LTO. `panic = "unwind"` is explicit
# rather than inherited: this is a governance-sensitive setting and the
# profiling workflow must not silently track the release policy.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = "thin"
panic = "unwind"
