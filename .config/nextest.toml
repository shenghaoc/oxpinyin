nextest-version = "0.9.115"

# Native nextest configuration. Profiles are explicit; local and CI share
# the base behaviour and differ only in the measured process budget.
[profile.default]
retries = 0
fail-fast = false
test-threads = "num-cpus"

[profile.local]
inherits = "default"
test-threads = "num-cpus"

[profile.ci]
inherits = "default"
# GitHub-hosted native jobs expose four vCPUs. Keep this explicit rather
# than copying the local machine's CPU count into CI.
test-threads = 4

# Storage integration cases create, reopen and recover real backend files.
# Serialize that subset; independent unit tests stay in the default pool.
#
# A test joins a set by the module it lives in. A test that creates,
# reopens or recovers real backend files lives in a module named
# `backend_files`; it runs in the store-backend group. A test that reads
# real pin data (a libpinyin data tree or a pin-built user profile) lives
# in a module named `pin_data`; it runs in the store-backend group and also
# takes the whole invocation's test budget. The filters match those
# complete module-name segments anywhere in a test's path. The binary()
# terms name integration suites that have not moved into modules yet.
[test-groups.store-backend]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/(^|::)(backend_files|pin_data)::/) | binary(assembly) | binary(empty_user_dir) | binary(libpinyin_data_dir)'
test-group = 'store-backend'

[[profile.default.overrides]]
filter = 'test(/(^|::)pin_data::/) | binary(libpinyin_data_dir)'
test-group = 'store-backend'
threads-required = "num-test-threads"

