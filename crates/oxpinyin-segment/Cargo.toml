[package]
name = "oxpinyin-segment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only Han segmenter reproducing libpinyin ngseg. Never ships."

[lints]
workspace = true

[[bin]]
name = "oxpinyin-segment"
path = "src/bin/oxpinyin-segment.rs"

[dependencies]
# default-features = false so workspace `--no-default-features` builds are
# not re-defaulted through this edge. This training-only tool selects no
# backend itself; in a workspace build, feature unification supplies
# whichever backend the build enabled (redb otherwise).
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }
