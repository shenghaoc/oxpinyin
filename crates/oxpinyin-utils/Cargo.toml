[package]
name = "oxpinyin-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["/src/**"]
description = "libpinyin's utilities under their own names and interfaces (external-I/O boundary stage 5). The installed C library packages do not include these utilities. The Rust interface is unstable."

[lib]
doctest = false

[features]
# The data layer's backend selection, forwarded to every backend-sensitive
# edge the utilities use.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-core/kyotocabinet"]
bdb = ["oxpinyin-core/bdb"]
tkrzw = ["oxpinyin-core/tkrzw"]

[lints]
workspace = true

[dependencies]
rustc-hash.workspace = true
oxpinyin-core = { workspace = true, features = ["tools"] }

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
libc.workspace = true
regex.workspace = true
rstest.workspace = true
sha2.workspace = true
tempfile.workspace = true
