[package]
name = "oxpinyin-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Nonshipping interactive access to oxpinyin's parser, lookup and C facades"

[lints]
workspace = true

[features]
default = ["tkrzw"]
tkrzw = ["oxpinyin-utils/tkrzw", "oxpinyin-core/tkrzw", "oxpinyin-capi/tkrzw", "oxpinyin-zhuyin-capi/tkrzw"]
bdb = ["oxpinyin-utils/bdb", "oxpinyin-core/bdb", "oxpinyin-capi/bdb", "oxpinyin-zhuyin-capi/bdb"]
kyotocabinet = ["oxpinyin-utils/kyotocabinet", "oxpinyin-core/kyotocabinet", "oxpinyin-capi/kyotocabinet", "oxpinyin-zhuyin-capi/kyotocabinet"]

[dependencies]
oxpinyin-utils = { path = "../oxpinyin-utils", version = "=0.1.0-alpha.1", default-features = false }
oxpinyin-core = { workspace = true, features = ["tools"] }
oxpinyin-capi = { path = "../oxpinyin-capi", version = "=0.1.0-alpha.1", default-features = false, features = ["tools"] }
oxpinyin-zhuyin-capi = { path = "../oxpinyin-zhuyin-capi", version = "=0.1.0-alpha.1", default-features = false, features = ["tools"] }

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
libc.workspace = true
regex.workspace = true
rstest.workspace = true
sha2.workspace = true
tempfile.workspace = true
