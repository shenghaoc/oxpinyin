name: verify-nightly

# Tier-3 scheduled verification (docs/safety/ci-strategy.md): everything
# too slow or too nightly for the PR gate. Findings here open issues;
# nothing here blocks a merge, because branch protection requires only
# ci.yml's `ci-aggregate`. The coverage floor also runs as an advisory PR
# check (coverage.yml). Lizard's CCN limit moved to ci.yml's lint job on
# 2026-09-08 — seconds of runtime, so it gates the PR. The public-API snapshot ratchet
# was retired on 2026-10-18 UTC: the C APIs/ABIs are the only supported
# external interfaces (AGENTS.md, "External interfaces").
#
# No trial lanes remain: the Miri, cargo-mutants and cargo-geiger jobs
# were retired on 2026-09-01 (docs/findings/verify-nightly.md). There are
# no continue-on-error lanes; every job in this workflow must be green.
# Surviving lanes: fuzz-soak, differentials, overflow-lane, coverage (via
# coverage.yml, also an advisory path-filtered PR check), perf-snapshot,
# function-order-policy (added 2026-10-23), test-windows (moved from ci.yml
# on 2026-10-22).
# A separate nextest lane over the Kyoto Cabinet workspace was removed on
# 2026-10-22: overflow-lane runs the same workspace test inventory under
# Kyoto Cabinet, and ci.yml's Linux and macOS test jobs already run nextest.
#
# Every Linux job runs in a debian:testing container in the
# store-backends.yml style (test-windows runs on windows-latest): the nightly lanes exist to surface drift early, and the rolling
# distro toolchain is part of what they exercise. The image is
# deliberately unpinned — do not "stabilise" it.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the full Windows workspace job
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One group per ref: the schedule always runs on main, so scheduled runs
# still queue behind each other, and a dispatch on a branch does not
# displace them.
concurrency:
  group: verify-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every fuzz target, 3 minutes each, ASan+LSan on by default with
  # cargo-fuzz 0.13.2. The only fuzz lane: ci.yml's per-PR build and
  # smoke pass moved here on 2026-09-23, so a target that no longer
  # compiles or initializes surfaces here, the night after it lands.
  # The list comes from `cargo fuzz list`, so a new target cannot be
  # left out of the soak:
  # the five-name literal this replaced silently skipped the three targets
  # added on 2026-09-08. The dict-loader corpus is seeded from the
  # committed w3 tables so the decoder starts from valid headers.
  fuzz-soak:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
      # Same ASan leeway as the tkrzw sanitizer job in store-backends.yml:
      # Docker's default seccomp profile blocks personality(2), which the
      # setarch ASLR-off wrapper below needs.
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # The override the comment above exists for: without it Docker's
      # default seccomp profile blocks personality(2) and setarch -R dies
      # with EPERM before any target runs.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libdb-dev libglib2.0-dev util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      # One nightly toolchain serves both cargo-fuzz's build and the runs
      # (cargo install works on nightly; no second toolchain needed).
      - name: Install the pinned nightly with Rust sources
        run: |
          set -euo pipefail
          # Exact on purpose (#1074): a nightly is identified only by its date.
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly-2026-08-01 --component rust-src
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      # Exact on purpose (#1074): cargo-fuzz passes unstable flags to the pinned nightly above, so the two are pinned together.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Fuzzing memory, half one: the corpora persist across nightly runs
      # (latest-wins — the run-id key always misses so every run saves,
      # the prefix restore-key always loads the newest save), so a soak
      # starts where the last one ended instead of from the single
      # committed seed. Restored before seeding: the seed step re-copies
      # its fixture inputs over whatever the cache brought back.
      - name: Restore the accumulated fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Seed corpora
        run: |
          shopt -s nullglob
          seeds=(fixtures/w3/*.bin)
          mkdir -p fuzz/corpus/dict-loader
          if [ ${#seeds[@]} -gt 0 ]; then
            cp "${seeds[@]}" fuzz/corpus/dict-loader/
          else
            echo '::warning::no fixtures/w3 .bin seeds found; dict-loader starts from an empty corpus'
          fi
      - name: Soak each target
        # Every target runs even if an earlier one fails; the accumulated
        # status is the step's exit code. -print_final_stats leaves the
        # coverage/edge counters in the log so a soak that explored
        # nothing is visible as one, not just green.
        run: |
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # setarch -R disables ASLR for the process tree: runner
            # kernels' mmap entropy exceeds ASan's shadow mapping, and an
            # unprivileged container cannot lower vm.mmap_rnd_bits itself
            # (same rationale as store-backends.yml's sanitizer job).
            if ! setarch "$(uname -m)" -R cargo +nightly-2026-08-01 fuzz run "$target" -- -max_total_time=180 -timeout=15 -max_len=4096 -print_final_stats=1; then
              status=1
              echo "::error::fuzz target $target failed"
            fi
            echo "::endgroup::"
          done
          exit $status
      # Fuzzing memory, half two: a crash survives the runner as an
      # artifact (cargo-fuzz writes crash-* inputs under
      # fuzz/artifacts/<target>/), not as a log line that dies with the
      # job.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/

  # The fixture tier of the oracle differentials: build the pinned
  # libpinyin (public source, SHA read from tools/oracle/build-oracle.sh
  # and verified) and run, nightly, every differential gate COMMITTED
  # fixtures can carry — the tkrzw drop-in (byte-exact datagen parity
  # over the toned mini-model), ngseg live parity (toned tables), and
  # the KMM gen/export/merge/validate + spseg live gates (committed w3
  # tables, whose token space matches those gates' corpora). This
  # honors the no-model20-in-CI policy (store-backends.yml header)
  # while turning part of the manual evidence into a drift alarm. What
  # committed data cannot carry stays on developer machines, each
  # exclusion recorded by mechanism in the script header: the
  # model20-token-space goldens and corpora (lambda, counter, ngseg
  # goldens), mergeseq live (the pin emits a token outside the w3
  # phrase table), KMM prune (the pin SIGSEGVs on that gate's fixture
  # input), and eval (no interpolation2.text consistent with w3).
  differentials:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the runner essentials and oracle build deps (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make pkg-config autoconf automake autopoint libtool gettext libglib2.0-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libclang-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - name: Run the fixture-tier differentials
        run: tools/oracle/nightly-fixture-differentials.sh

  # Latent-overflow lane: the releaseoptimized codepath with overflow
  # checks and debug assertions forced on (docs/safety/
  # tooling-evaluation.md §8) — the "NDEBUG question" as CI, not as
  # shipped configuration.
  overflow-lane:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C overflow-checks=y -C debug-assertions=y -D warnings
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libkyotocabinet-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - run: cargo test --locked --workspace --release --no-default-features --features kyotocabinet

  # Coverage floor: the reusable job in coverage.yml, which is also an
  # advisory path-filtered PR check. Called here unconditionally so the whole-tree
  # number is measured nightly whatever a PR touched. The floor and its
  # history live in that file.
  coverage:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    uses: ./.github/workflows/coverage.yml

  # Perf-and-size snapshot series. NOT a gate: it measures the tree once a
  # night, compares tonight against the previous sample, and reports. Nothing
  # here runs on the PR path and nothing here blocks a merge.
  #
  # The per-PR gate this replaces was rejected as infeasible — a gate is a
  # before-and-after comparison and a PR run cannot produce a trustworthy
  # pair. The decision, the reasons, and what this lane may and may not claim
  # are in docs/perf/ci-perf-size-gate-proposal-2026-09-09.md. Three of its
  # rules are load-bearing here:
  #
  #   - Record freely, threshold almost nothing. A flag means "a human should
  #     look", never "this merge is bad".
  #   - The series localizes WHEN a level moved, not WHY. The environment is
  #     recorded with each sample, and a move across an environment change is
  #     reported as unattributable rather than flagged.
  #   - Only the schedule writes the series. A workflow_dispatch run measures
  #     and reports, but must never become the predecessor the next real
  #     night compares against.
  #
  # Wall clock is deliberately absent. The image stays unpinned like every
  # other lane here: a size series that steps when the toolchain moves is
  # reporting something true, and that is what this workflow is for.
  perf-snapshot:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      # The snapshot runs tkrzw explicitly (the w3 fixture directory its
      # tooling opens is the tkrzw one); the workspace default moved to
      # Berkeley DB on 2026-09-20. valgrind supplies the instruction
      # count; it is optional by design — snapshot.sh records null rather than
      # zero when it is absent, so losing it degrades the sample instead of
      # corrupting the series.
      - name: Install build and measurement dependencies (apt)
        run: |
          apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev \
            liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev libssl-dev \
            binutils valgrind python3 util-linux
      # libssl-dev above: cargo-c pulls openssl-sys through the cargo crate,
      # and without it the build script dies with "Could not find directory of
      # OpenSSL installation". Confirmed by dispatching this lane once
      # without it.
      # Exact on purpose (#1074): a fresh runner has nothing to reuse, and cargo-c's rust-version
      # rises with each release (0.10.24 needs Rust 1.95, 0.10.26 needs 1.97), so an unpinned
      # install would break once it passes the pinned Rust. Any cargo-c at or above the minimum
      # that `just doctor` reports builds the same objects (docs/packaging.md, "Regeneration").
      - run: cargo install cargo-c --version 0.10.25 --locked
      # Its own cache namespace: perf-snapshot-, disjoint from fuzz-corpus-.
      # Same latest-wins shape the fuzz soak uses — the run-id key always
      # misses so a save always happens, the prefix restore-key always loads
      # the newest save. A miss is normal (first run, or an eviction) and the
      # lane reports "nothing to compare" rather than failing.
      # restore/save split rather than the combined actions/cache, because the
      # combined action's post step is `post-if: success()`. The compare step
      # below exits non-zero on a flagged move, which would skip the save and
      # drop the very sample that was flagged — the next night would then
      # compare against an older predecessor and could miss the move entirely.
      # Save explicitly, with `if: always()`, and fail after it.
      - name: Restore the snapshot series
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-series
          key: perf-snapshot-${{ github.run_id }}
          restore-keys: |
            perf-snapshot-
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          uv_install_dir="$HOME/.local/bin"
          (
            [[ $(uname -s)-$(uname -m) == Linux-x86_64 ]]
            uv_target=x86_64-unknown-linux-gnu
            # Published in https://github.com/astral-sh/uv/releases/download/0.13.1/sha256.sum.
            # Exact on purpose (#1074): a checksum is only known for a known version.
            uv_sha256=eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
            # Keep the archive in memory. Write only its verified executables.
            uv_payload=$(curl --fail --location --retry 3 "https://github.com/astral-sh/uv/releases/download/0.13.1/uv-$uv_target.tar.gz" | base64)
            uv_actual=$(printf '%s' "$uv_payload" | base64 -d | sha256sum)
            [[ ${uv_actual%% *} == "$uv_sha256" ]] || { printf 'uv archive checksum mismatch\n' >&2; exit 1; }
            uv_tmp=$(mktemp -d)
            trap 'rm -rf "$uv_tmp"' EXIT
            trap 'exit 1' HUP INT TERM
            printf '%s' "$uv_payload" | base64 -d | tar -xz -C "$uv_tmp" "uv-$uv_target/uv" "uv-$uv_target/uvx"
            mkdir -p "$uv_install_dir"
            install -m755 "$uv_tmp/uv-$uv_target/uv" "$uv_tmp/uv-$uv_target/uvx" "$uv_install_dir/"
            printf 'uv archive SHA-256 verified: %s\n' "$uv_sha256"
          )
          export PATH="$HOME/.local/bin:$PATH"
          hash -r
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version | grep -q '^uv 0\.13\.1 '
          uv python install cpython@3.15
          uv run --no-project --managed-python --python cpython@3.15+gil python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python", "cpython@3.15+gil"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON
      - name: Measure
        run: tools/perf-gate/snapshot.sh --out snapshot.json --backend tkrzw
      # --append only on the schedule. A manual run gets the full report and
      # writes nothing, so an off-cadence sample cannot silently become
      # tomorrow's baseline.
      # The exit status is captured rather than allowed to end the step, so the
      # save below still runs. It is re-raised after the save.
      - name: Compare against the previous night and report
        id: compare
        run: |
          set -uo pipefail
          args=(--snapshot snapshot.json --series-dir .perf-series
                --summary "$GITHUB_STEP_SUMMARY")
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            args+=(--append)
          fi
          status=0
          uv run --no-project --managed-python --python cpython@3.15+gil python -X lazy_imports=normal tools/perf-gate/series.py "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            echo "::error::series.py failed with $status"
            exit "$status"
          fi
      # Only the schedule writes, so a workflow_dispatch run cannot become the
      # predecessor the next real night compares against.
      - name: Save the snapshot series
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-series
          key: perf-snapshot-${{ github.run_id }}
      - name: Re-raise a flagged comparison
        if: steps.compare.outputs.status == '1'
        run: |
          echo "::warning::a metric moved more than the attention threshold; see the job summary"
          exit 1
      # The durable copy. The cache is evictable; artifacts are not, so the
      # history survives an eviction even though the night-over-night
      # comparison skips that one night. Uploaded whether or not the compare
      # step flagged something.
      - name: Upload the snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-snapshot-${{ github.run_id }}
          path: snapshot.json
          retention-days: 90
          # The step is always() so a failed measurement still uploads what it
          # got; when it got nothing, say so quietly instead of warning.
          if-no-files-found: ignore

  # Function-order policies (#1071). The build-and-resolve steps are the
  # shared action in .github/actions/function-order-policy, called here
  # and by ci.yml's PR job; the two lanes cannot drift. This caller keeps
  # the nightly schedule and manual dispatch. It reports a stale policy
  # that reaches main; it does not block a merge.
  function-order-policy:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      # The shared action must see the same empty RUSTFLAGS as the PR caller.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/function-order-policy

  # The full Windows workspace: the portable workspace (all but capi,
  # zhuyin-capi, and the backend-independent corpus, KMM, punctuation, and
  # word tools) linked against vcpkg's Berkeley DB 4.8. Moved here from
  # ci.yml on 2026-10-22: it runs every night and on manual dispatch, not on
  # every PR. Dispatch it on the branch (windows_only: true) before merging
  # changes to Windows-sensitive storage, filesystem or native-build code,
  # toolchain or relevant dependency updates, and releases
  # (docs/runbooks/setup.md, "Native Windows"). Not skipped by windows_only.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # windows-latest defaults every `run:` to pwsh. The provisioning step
    # is bash (`$VCPKG_INSTALLATION_ROOT`, `>> "$GITHUB_ENV"`); under pwsh
    # those names are unset and the redirections write nowhere, so the
    # lane never reaches a build.
    defaults:
      run:
        shell: bash
    # ci.yml set these at workflow level; this workflow sets none.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      # The package specs (port[features]:triplet) passed to `vcpkg install`,
      # space-separated. The binary cache key hashes this value, so adding a
      # port or feature here gives the cache a new key.
      VCPKG_PACKAGES: berkeleydb:x64-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      # vcpkg's binary cache, persisted across runs. vcpkg writes one zip per
      # built package, named by the package's ABI hash, to the files provider
      # below, and `vcpkg install` still runs every time: it computes each
      # ABI hash itself (port files, triplet, compiler, dependencies) and
      # restores only an archive whose hash matches, so a stale entry is
      # never used, only rebuilt. The installed tree is not cached.
      #
      # The cache key changes whenever an input to those hashes can: the
      # vcpkg checkout revision (ports and baseline), the triplet, the runner
      # image (compiler and SDK), the requested package specs
      # (VCPKG_PACKAGES), and any vcpkg manifest, configuration, overlay or
      # triplet file in this repository (none today). The restore-keys fall
      # back to the newest entry for the same revision and image, then for
      # the same image OS and triplet; vcpkg's own hash check decides what in
      # it is reusable.
      #
      # Restore and save are separate steps. The save runs right after
      # `vcpkg install`, before the build and tests, so a red test run still
      # keeps the archives it built; it is skipped when the restore matched
      # the primary key exactly, because that entry already exists.
      - name: Compute the vcpkg binary cache key
        id: vcpkg-cache-key
        run: |
          set -euo pipefail
          if vcpkg_rev=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD 2>/dev/null); then
            echo "vcpkg revision: $vcpkg_rev"
          else
            vcpkg_rev=baseline-$(sha256sum "$VCPKG_INSTALLATION_ROOT/versions/baseline.json" | cut -c1-40)
            echo "vcpkg checkout has no git metadata; keyed on $vcpkg_rev"
          fi
          image="${ImageOS:?runner image OS unknown}-${ImageVersion:?runner image version unknown}"
          cache_dir="${RUNNER_TEMP//\\//}/vcpkg-binary-cache"
          mkdir -p "$cache_dir"
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache_dir,readwrite" >> "$GITHUB_ENV"
          packages=$(printf '%s' "$VCPKG_PACKAGES" | sha256sum | cut -c1-16)
          echo "vcpkg packages: $VCPKG_PACKAGES (key component $packages)"
          {
            echo "dir=$cache_dir"
            echo "prefix=vcpkg-bin-$ImageOS-x64-windows-"
            echo "key=vcpkg-bin-$ImageOS-x64-windows-$vcpkg_rev-$image"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-key.outputs.key }}-pkgs-${{ steps.vcpkg-cache-key.outputs.packages }}-manifest-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'triplets/**') || 'none' }}
          restore-keys: |
            ${{ steps.vcpkg-cache-key.outputs.key }}-
            ${{ steps.vcpkg-cache-key.outputs.prefix }}
      # vcpkg's berkeleydb port: 4.8.30, the Sleepycat line, the same
      # family as the 5.3 the Linux lanes link. The port installs
      # libdb48.lib / libdb48.dll and the build_windows headers. The
      # store build script is pointed at that tree; the import library
      # is named explicitly because the bare `-ldb` fallback does not
      # match libdb48.lib; the DLL directory joins PATH for the test
      # binaries; bindgen gets the runner's preinstalled LLVM.
      - name: Install the store backend (vcpkg Berkeley DB)
        run: |
          read -ra specs <<< "$VCPKG_PACKAGES"
          vcpkg install "${specs[@]}"
          # `vcpkg list` prints "<port>:<triplet>  <version>#<port-version>  <description>".
          # The port name is followed by ":x64-windows", not whitespace, and
          # the version carries a "#<n>" suffix, so a pattern expecting
          # "berkeleydb" then spaces then "4.8" matches nothing and the
          # lane dies before the build. Pin the 4.8 line; a bump off it
          # fails here.
          vcpkg list berkeleydb:x64-windows | grep -Eq 'berkeleydb:x64-windows[[:space:]]+4[.]8[.]' \
            || { echo "::error::vcpkg berkeleydb is not the documented 4.8 line: $(vcpkg list berkeleydb:x64-windows)"; exit 1; }
          echo "OXPINYIN_BDB_INCLUDE_DIR=$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\include" >> "$GITHUB_ENV"
          echo "OXPINYIN_BDB_LIB_DIR=$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\lib" >> "$GITHUB_ENV"
          echo "OXPINYIN_BDB_LIB_NAME=libdb48" >> "$GITHUB_ENV"
          # vcpkg's berkeleydb port is 4.8.30. The store refuses any libdb
          # other than the surveyed 5.3 unless this is set, and it is set
          # only here: it covers that one comparison, and the process
          # prints a warning naming both versions. No other lane sets it.
          echo "OXPINYIN_BDB_ALLOW_UNSURVEYED_VERSION=1" >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\bin" >> "$GITHUB_PATH"
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}
      # The workspace default is Berkeley DB, so this lane no longer
      # passes `--features bdb`. The vcpkg provisioning above is what
      # makes that default link. Same exclusions as the macOS job.
      - run: >
          cargo test --locked --workspace
          --exclude oxpinyin-capi --exclude oxpinyin-zhuyin-capi
          --exclude oxpinyin-corpus --exclude oxpinyin-kmm --exclude oxpinyin-punct
          --exclude oxpinyin-word
