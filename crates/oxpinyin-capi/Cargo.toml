[package]
name = "oxpinyin-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI subset of libpinyin's public API, for the borrowed frontend. Linux only."

# Supported C ABI (Linux); soname/versioning freezes with the first public release.
#
# Cargo package name is project identity; the built artifact name is part of
# the compatibility bootstrap and intentionally stays `pinyin_capi` (and the
# checked-in header stays `pinyin.h` with exported `pinyin_*` symbols).
[lib]
name = "pinyin_capi"
# cdylib is the ABI; rlib lets oxpinyin-dictool call the same symbols
# in-process; staticlib is required by cargo-c and shipped alongside the .so.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Declared so cargo-c identifies this crate as the workspace's C-API export
# target. cargo-c checks for the *presence* of this feature name; it is never
# enabled by default, so plain `cargo build`/`--workspace` behaviour is unchanged.
capi = []
# Rust-visible facade for the in-tree fuzz harness only. Off by default:
# the released Rust API surface is unchanged for every consumer that does
# not opt in (the supported surfaces remain the C ABI and the engine).
fuzz-api = []
# Backend selection, forwarded down the chain (one backend per binary; see
# oxpinyin-store's [features] for the model and precedence).
default = ["kyotocabinet"]
kyotocabinet = [
    "oxpinyin-runtime/kyotocabinet",
    "oxpinyin-data/kyotocabinet",
    "oxpinyin-user/kyotocabinet",
    "oxpinyin-facade/kyotocabinet",
]
tkrzw = [
    "oxpinyin-runtime/tkrzw",
    "oxpinyin-data/tkrzw",
    "oxpinyin-user/tkrzw",
    "oxpinyin-facade/tkrzw",
]
lmdb = [
    "oxpinyin-runtime/lmdb",
    "oxpinyin-data/lmdb",
    "oxpinyin-user/lmdb",
    "oxpinyin-facade/lmdb",
]
redb = [
    "oxpinyin-runtime/redb",
    "oxpinyin-data/redb",
    "oxpinyin-user/redb",
    "oxpinyin-facade/redb",
]
# Compiles out the three exports outside the consumer union: two fixture
# hooks and pinyin_set_full_pinyin_scheme, all `dlsym`ed by tools/bisection
# drivers and called by neither reference consumer. Enabled only when building
# the shipped drop-in artifact (`cargo capi install --features shipped`), so
# every in-tree run-*.sh keeps working untouched.
#
# Deliberately a subtractive feature, which cargo features usually should not
# be. The additive spelling (a default-on `harness` feature switched off with
# --no-default-features) does not work here: cargo-c does not forward
# --no-default-features to cargo, so the shipped artifact came out carrying the
# extra symbols. --features IS forwarded, so the restriction has to ride on it.
shipped = []

[lints.rust]
unsafe_code = "allow" # FFI + glib marshalling only; // SAFETY: on every block
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Mechanizes the "// SAFETY: on every block" constitution clause.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
must_use_candidate = "warn"

[dependencies]
oxpinyin-chewing = { path = "../oxpinyin-chewing" }
oxpinyin-core.workspace = true
# default-features = false on the store-reaching edges (the workspace table
# carries it for the `workspace = true` ones) so `--no-default-features`
# builds actually reach the store's backend selection; the [features] block
# above forwards it.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }
oxpinyin-engine.workspace = true
# The shared facade-orchestration layer (instance/context state machines,
# parse seams, cursor laws) this crate's C wrappers translate.
oxpinyin-facade = { path = "../oxpinyin-facade", default-features = false }
oxpinyin-runtime.workspace = true
oxpinyin-user.workspace = true
glib-sys.workspace = true

[dev-dependencies]
# Criterion 0.5+ (workspace lock is 0.8). Stage-2 benches only; not a
# runtime dependency of the C ABI.
criterion = "0.8"
# Direct use in `benches/stage2.rs` (`UserStore::count_delta`). Already a
# runtime dependency of this crate; restated so the bench crate can import it.
oxpinyin-user = { path = "../oxpinyin-user", default-features = false }
# Dev-only edge: the Stage-2 benches consume the canonical model20-cache
# locator and export-dir resolution (oxpinyin_testsupport::model_cache).
# Never a dependency of the C ABI itself.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }

[[bench]]
name = "stage2"
harness = false

# cargo-c packaging metadata. See docs/packaging.md for the rationale and the
# Fedora/Debian recipes that consume this.
[package.metadata.capi.header]
# The checked-in pinyin.h ships verbatim; never regenerate it with cbindgen, so
# the file the fork compiles against stays byte-identical.
generation = false
# The real libpinyin installs its header under a version-stamped subdirectory
# (/usr/include/libpinyin-2.8.1/pinyin.h on Ubuntu's libpinyin15-dev; no
# top-level symlink), and its libpinyin.pc points Cflags there. Match it.
# pinyin.h includes novel_types.h and pinyin_custom2.h (each -> glib.h); both
# ship beside it verbatim, the closed set upstream installs under the same
# subdirectory.
subdirectory = "libpinyin-2.11.91"

[package.metadata.capi.install.include]
# Ship the existing crate-root header without moving it into assets/. The
# destination must match `header.subdirectory` above, or Cflags points at a
# directory the header is not in. pinyin.h's two companions ship with it so
# the header resolves standalone — the drop-in installs the closed include set.
asset = [
    { from = "pinyin.h", to = "libpinyin-2.11.91" },
    { from = "novel_types.h", to = "libpinyin-2.11.91" },
    { from = "pinyin_custom2.h", to = "libpinyin-2.11.91" },
]

[package.metadata.capi.pkg_config]
name = "libpinyin"
filename = "libpinyin"
description = "Library to deal with pinyin"
version = "2.11.91"
requires = "glib-2.0"
# Intent: do not let cargo-c own the .pc — the complete file (with pkgdatadir,
# database_format, libpinyinincludedir, libpinyin_binary_version) is generated
# by build.rs and placed by tools/packaging/install.sh. cargo-c 0.10.24 has no
# such key and silently ignores this, so it still writes an incomplete
# libpinyin.pc that the wrapper OVERWRITES; the flag is kept for intent and for
# a future cargo-c that honours it. See docs/findings/installed-naming.md.
generate = false

[package.metadata.capi.library]
# The INSTALLED artifact is the drop-in replacement: `libpinyin.so.15`, which
# unmodified consumers already record in DT_NEEDED. The Rust `[lib] name` stays
# `pinyin_capi` so the in-tree gates keep finding target/debug/libpinyin_capi.so;
# this field names the installed file, not the build artifact.
name = "pinyin"
# ABI version, independent of the crate version, and matched to upstream:
# libpinyin's configure.ac carries libpinyin_abi_current=15 / abi_revision=0,
# giving libtool -version-info 15:0 and SONAME libpinyin.so.15. Confirmed with
# readelf -d on Ubuntu's shipped libpinyin15. Bump only if upstream bumps its
# ABI current.
version = "15.0.0"
versioning = true
