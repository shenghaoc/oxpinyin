[package]
name = "oxpinyin-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
oxpinyin-core = { workspace = true }
# The workspace table carries default-features = false for this edge; the
# [features] block below forwards the backend selection.
oxpinyin-store = { workspace = true }
# table.conf and user.conf go through the pin's own C library calls
# (docs/findings/external-io-boundary.md, stage 1).
oxpinyin-input = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# Backend selection, forwarded to oxpinyin-store (one backend per binary;
# see the store's [features] for the model and precedence).
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-store/kyotocabinet"]
bdb = ["oxpinyin-store/bdb"]
tkrzw = ["oxpinyin-store/tkrzw"]

# Reads the pinned libpinyin-data package, which is in tkrzw format
# (`just fetch-contract-data`).
[[test]]
name = "package_libraries"
required-features = ["tkrzw"]
