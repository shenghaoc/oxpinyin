[package]
name = "oxpinyin-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = [
    "/LICENSE",
    "/src/**",
    "/build.rs",
    "/libpinyin.alloc",
    "/libpinyin.pc.in",
    "/libpinyin.ver",
    "/novel_types.h",
    "/pinyin.h",
    "/pinyin_custom2.h",
]
description = "The libpinyin C ABI implementation, with libpinyin.so.15 release packages on Linux. The Rust interface is unstable."
keywords = ["libpinyin", "pinyin", "chinese", "input-method", "ffi"]
categories = ["text-processing", "internationalization"]

# Supported C ABI (Linux); soname/versioning freezes with the first public release.
[lib]
# Plain Cargo builds produce the C ABI cdylib and the rlib for fuzz targets and Rust tests.
# cargo-c selects its own crate types.
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Declared so cargo-c identifies this crate as the workspace's C-API export
# target. cargo-c checks for the *presence* of this feature name; it is never
# enabled by default, so plain `cargo build`/`--workspace` behaviour is unchanged.
capi = []
# See docs/architecture.md#backend-selection. Each peer feature forwards to
# oxpinyin. The peer features stay on this crate because build.rs reads
# `CARGO_FEATURE_<PEER>` of this crate for the cxx backends' link setup, and
# because `cargo cinstall --features <peer>` names them. `just packaging
# install` writes the matching `database_format` into libpinyin.pc.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin/kyotocabinet"]
bdb = ["oxpinyin/bdb"]
tkrzw = ["oxpinyin/tkrzw"]
[lints]
workspace = true

[dependencies]
rustc-hash.workspace = true
num_enum.workspace = true
oxpinyin.workspace = true
glib-sys.workspace = true

[dev-dependencies]
# Dev-only: `open` and `mmap` for the death tests' shared page, and the
# file-size limit of the interrupted-save test. Never a dependency of the C
# ABI itself.
libc.workspace = true
# Dev-only: shared-shape cases in the crate tests.
rstest.workspace = true
# Dev-only: scratch dirs for the test fixtures. Never a dependency of the
# C ABI itself.
tempfile.workspace = true


# cargo-c packaging metadata. See docs/packaging.md for the rationale and the
# Fedora/Debian recipes that consume this.
[package.metadata.capi.header]
# The checked-in pinyin.h ships verbatim; do not regenerate it, so
# the file the fork compiles against stays byte-identical.
generation = false
# The real libpinyin installs its header under a version-stamped subdirectory
# (/usr/include/libpinyin-2.8.1/pinyin.h on Ubuntu's libpinyin15-dev; no
# top-level symlink), and its libpinyin.pc points Cflags there. Match it.
# pinyin.h includes novel_types.h and pinyin_custom2.h (each -> glib.h); both
# ship beside it verbatim, the closed set upstream installs under the same
# subdirectory.
subdirectory = "libpinyin-2.11.92"

[package.metadata.capi.install.include]
# Ship the existing crate-root header without moving it into assets/. The
# destination must match `header.subdirectory` above, or Cflags points at a
# directory the header is not in. pinyin.h's two companions ship with it so
# the header resolves standalone — the drop-in installs the closed include set.
asset = [
    { from = "pinyin.h", to = "libpinyin-2.11.92" },
    { from = "novel_types.h", to = "libpinyin-2.11.92" },
    { from = "pinyin_custom2.h", to = "libpinyin-2.11.92" },
]

[package.metadata.capi.pkg_config]
name = "libpinyin"
filename = "libpinyin"
description = "Library to deal with pinyin"
version = "2.11.92"
requires = "glib-2.0"
# `just packaging install` owns the complete .pc and overwrites cargo-c's file.
# See docs/findings/installed-naming.md.

[package.metadata.capi.library]
# The INSTALLED artifact is the drop-in replacement: `libpinyin.so.15`, which
# unmodified consumers already record in DT_NEEDED. This field names the
# installed file, not the build artifact: the in-tree gates find
# target/debug/liboxpinyin_capi.so, from Cargo's default library target name.
name = "pinyin"
# ABI version, independent of the crate version, and matched to upstream:
# libpinyin's configure.ac carries libpinyin_abi_current=15 / abi_revision=0,
# giving libtool -version-info 15:0 and SONAME libpinyin.so.15. Confirmed with
# readelf -d on Ubuntu's shipped libpinyin15. Bump only if upstream bumps its
# ABI current.
version = "15.0.0"
versioning = true
