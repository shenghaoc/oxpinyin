[package]
name = "oxpinyin-training"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Private decode behind eval_correction_rate; never ships."

[lints]
workspace = true

[features]
default = ["tkrzw"]
# Forwarded to oxpinyin-data, so the decode's dictionary types and
# `oxpinyin-utils` share one on-disk backend selection.
kyotocabinet = ["oxpinyin-data/kyotocabinet"]
bdb = ["oxpinyin-data/bdb"]
tkrzw = ["oxpinyin-data/tkrzw"]

[dependencies]
oxpinyin-core.workspace = true
oxpinyin-data.workspace = true
# Direct, so cargo passes this package's build script the store's links
# metadata (the Kyoto Cabinet library directory, for the rpath). The
# backend feature reaches the store through oxpinyin-data.
oxpinyin-store.workspace = true

