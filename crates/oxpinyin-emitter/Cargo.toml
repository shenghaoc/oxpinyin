[package]
name = "oxpinyin-emitter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only interpolation2.text emitter reproducing libpinyin export_interpolation. Never ships."

[lints]
workspace = true

[features]
# Backend selection, forwarded through the training-crate chain (one
# backend per binary; see oxpinyin-store's [features] for the model and
# precedence): the emitter reads `phrase_index.<ext>` in the compiled-in
# backend's format — redb by default, tkrzw/LMDB behind
# their features.
default = ["redb"]
kyotocabinet = ["oxpinyin-segment/kyotocabinet", "oxpinyin-counter/kyotocabinet"]
tkrzw = ["oxpinyin-segment/tkrzw", "oxpinyin-counter/tkrzw"]
lmdb = ["oxpinyin-segment/lmdb", "oxpinyin-counter/lmdb"]
redb = ["oxpinyin-segment/redb", "oxpinyin-counter/redb"]

[[bin]]
name = "oxpinyin-emitter"
path = "src/bin/oxpinyin-emitter.rs"

[dependencies]
# default-features = false so the backend selection reaches the chain from
# this crate's features above, not from the training crates' defaults.
oxpinyin-segment = { path = "../oxpinyin-segment", default-features = false }
oxpinyin-counter = { path = "../oxpinyin-counter", default-features = false }

[dev-dependencies]
# default-features = false so workspace `--no-default-features` runs are not
# re-defaulted through this dev edge; unification supplies the backend.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }
