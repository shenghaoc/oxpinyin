# Path gates. The workflow always starts. The `changes` job writes one flag per
# job (`tools.dev.ci_tree gate`), and a job runs only when its flag is true.
# CI_INPUTS in tools/dev/ci_tree.py holds the paths of `rust`, `harness` and
# `shipping-sizes`. The `store` flag selects the `store` job: it is
# docs/runbooks/verification.md, rule 2, as tools/bisection/cells-for-diff.py
# implements it for local runs, plus the store job's own infrastructure
# (STORE_GATE_ARGUMENTS in tools/dev/ci_tree.py). A skipped job still reports
# `skipped`, so the required `ci-aggregate` check sees it. Paths that no job
# reads, such as docs/, reference/ and the root Markdown files, select no job.
# The `changes` job itself checks the one rule that reads every tracked file:
# the Python version request is written once.
#
# The CI_INPUTS gates compare the event's base with HEAD (a two-dot diff). A
# branch behind main also sees main's own changes, so it can select more jobs,
# never fewer. The store gate diffs from the merge base. A missing base
# selects every job.
#
# Main's required set is `ci-aggregate`. It fails when an applicable job fails or
# when a job's result does not agree with its flag. A pull request that changes
# this workflow can also change its gates; branch protection covers that case.
# The platform and backend merge conditions, and the rule that every Linux
# job runs natively on the runner, are docs/runbooks/verification.md,
# section 10.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A new push to a pull request cancels that pull request's older run. Runs
# on main never cancel each other: each push gets its own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs after the gate:
#   rust — rustfmt, cargo-deny, Clippy, the fuzz-target compile, the Lizard
#          complexity limit and the workspace tests on Linux under Kyoto
#          Cabinet, the one Linux cell; the default tkrzw backend runs on
#          macOS and Windows in verify-nightly.yml
#   harness — the ruff F check and the Python harness tests of tools/, when
#             tools/ or a file its tests read changed
#   shipping-sizes — the stripped shipping-library sizes
#   store — Clippy, rustdoc and the workspace tests under bdb; then the bdb
#           and kyotocabinet store suites under the sanitizers
# Fuzz execution stays nightly.
#
# The store backends. Kyoto Cabinet, tkrzw and Berkeley DB are equal
# implementations behind the store's trait surface. Exactly one is compiled per
# build: two `compile_error!` guards in `src/store/mod.rs` enforce it. So
# cross-peer equivalence is proven by running the same test suite through
# separate builds, one per peer. tkrzw is the workspace default, but Ubuntu's
# libtkrzw is defective at run time (docs/findings/tkrzw-distro-compat.md), so
# Linux runs no tkrzw code: every Linux job uses the one Linux cell, Kyoto
# Cabinet from Ubuntu's packages (LOCAL_CELL in tools/dev/cell.py;
# docs/runbooks/verification.md, section 10), selected with the backend flag.
# The tkrzw suite runs on macOS and Windows in verify-nightly.yml. Each
# sanitizer run goes through the sanitizer service in tools/dev/test_runner.py,
# which `just sanitize` also uses, on the date-pinned nightly that
# fuzz/rust-toolchain.toml names: Berkeley DB under ASan, Kyoto Cabinet under
# ASan + LeakSanitizer. On a BerkeleyDB distro the system bigram.db is BDB and
# every session opens it through that FFI, so the instrumentation is
# load-bearing, not precautionary.
#
# Every backend package comes from Ubuntu's apt: libkyotocabinet-dev, and
# libdb-dev for the store job. bindgen (the bdb feature) loads the runner
# image's libclang.
#
# The pin-built oracle and the model20 archive are deliberately NOT CI
# concerns: provisioning them (just fetch-model, tools/oracle/build.py) is a
# LOCAL workflow, and no CI job may download model20.text.tar.gz or anything
# like it. The oracle-gated differentials and the model cache live on
# developer machines only.

jobs:
  changes:
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). It names a release, not ubuntu-latest, so a runner
    # image change happens here under review.
    runs-on: &ubuntu ubuntu-26.04
    outputs:
      rust: ${{ steps.gate.outputs.rust }}
      harness: ${{ steps.gate.outputs.harness }}
      ship: ${{ steps.gate.outputs.ship }}
      store: ${{ steps.gate.outputs.store }}
      reuse: ${{ steps.evidence.outputs.reuse }}
      tree: ${{ steps.evidence.outputs.tree }}
      source_run: ${{ steps.evidence.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every Python step in CI runs on the managed CPython, never the
      # runner's own Python.
      - uses: ./.github/actions/bootstrap
        with:
          uv: 'true'
      - name: Compute the path-gate flags
        id: gate
        run: uv run --managed-python python -X utf8 -m tools.dev.ci_tree gate
      # Every tracked file is an input of this rule, so it runs here on every
      # change. The file's other test class runs with the harness.
      - name: Python version request is written once
        run: uv run --managed-python python -X utf8 tools/dev/python-request.test.py RequestLiteralTests
      # After the gate: evidence must cover every lane the gate selects.
      - name: Look up successful PR evidence for this tree
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_FLAGS: ${{ toJSON(steps.gate.outputs) }}
        run: uv run --managed-python python -X utf8 -m tools.dev.ci_tree evidence

  # The Linux Rust lane: every check that reads the workspace, under the Linux
  # cell. On a reused tree a push to main still compiles here to refresh the
  # main Rust cache.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.reuse != 'true' || github.event_name == 'push')
    runs-on: *ubuntu
    timeout-minutes: 120
    env:
      # The Linux cell (LOCAL_CELL in tools/dev/cell.py) for the cell-based
      # gates (just cpp-smoke, just abi); the Cargo steps below select the same
      # backend with their flags.
      PINYIN_ORACLE_DBM: kc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          rust-cache-key: rust-job
          # Every run: the cache refresh runs on reuse too.
          uv: 'true'
          just: ${{ needs.changes.outputs.reuse != 'true' }}
          cargo-nextest: ${{ needs.changes.outputs.reuse != 'true' }}
          cargo-deny: ${{ needs.changes.outputs.reuse != 'true' }}
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # libkyotocabinet-dev: the library the kyotocabinet backend links and
        # the headers its cxx bridge compiles against with g++. The runner
        # image ships gcc, g++, make and pkg-config, so apt adds only GLib and
        # Kyoto Cabinet. Only the bdb feature runs bindgen; this lane needs
        # no libclang.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libkyotocabinet-dev
      - run: cargo fmt --all --check
        if: needs.changes.outputs.reuse != 'true'
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
        if: needs.changes.outputs.reuse != 'true'
      # Supply-chain gate. cargo-deny reads the RustSec database, and deny.toml
      # holds the policy. The justfile's deny recipe holds the checks and their
      # order.
      - run: just deny
        if: needs.changes.outputs.reuse != 'true'
      # Placement gate for crate-level `#![cfg(...)]`. A gate that evaluates
      # false discards the crate attributes after it, so one above a `//!`
      # block removes the docs and `missing_docs` fires on the excluded
      # platform only. This Linux job cannot see that, so the checker
      # reads placement, not cfg outcomes. Its harness runs first, so a
      # defect in the checker cannot pass.
      - name: Crate cfg-placement harness
        if: needs.changes.outputs.reuse != 'true'
        run: uv run --managed-python python -X utf8 -m tools.dev.test_runner tools/dev/lint-crate-cfg-placement.test.py
      - name: Crate cfg-placement gate
        if: needs.changes.outputs.reuse != 'true'
        run: uv run --managed-python python -X utf8 -c 'import sys; from tools.dev.entry import require_utf8_mode; require_utf8_mode(); from tools.dev.check import lint_crate_cfg_placement; raise SystemExit(lint_crate_cfg_placement(sys.argv[1:]))'
      # Drop-in version agreement: the capi manifests' header subdirectory
      # and pkg_config version against the pin record. The full
      # installed-tree diff (just packaging check-pc-metadata) needs the
      # pin-built libpinyin, which CI does not have.
      - run: uv run --managed-python python -X utf8 -m tools.dev.packaging check-pc-version
        if: needs.changes.outputs.reuse != 'true'
      # `--features kyotocabinet` at `--workspace` scope enables the peer on
      # every member that declares it (the store job's comment gives the mechanism).
      - run: cargo clippy --locked --workspace --all-targets --no-default-features --features kyotocabinet -- -D warnings
        if: needs.changes.outputs.reuse != 'true'
      # Run on every selected rust job, including the main cache refresh.
      # The directory selects the nightly in fuzz/rust-toolchain.toml.
      # No AFL++, corpus, sanitizer run or model data is needed. The fuzz
      # crate forwards the backend features; the soak selects the same one.
      - name: Install the fuzz toolchain
        working-directory: fuzz
        run: rustup toolchain install
      - name: Compile all fuzz targets
        working-directory: fuzz
        run: cargo check --locked --bins --no-default-features --features kyotocabinet
      # Complexity limit: the recipe states it; pyproject.toml and uv.lock
      # name the Lizard release.
      - name: Lizard complexity limit
        if: needs.changes.outputs.reuse != 'true'
        run: just complexity
      # Kyoto Cabinet rustdoc, warnings denied; Berkeley DB's runs in the
      # `store` job and tkrzw's on the nightly macOS and Windows jobs.
      - name: Rustdoc (kyotocabinet)
        if: needs.changes.outputs.reuse != 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --no-default-features --features kyotocabinet
      # The full-data contract tests (the `pin_data` modules, which read the
      # pinned libpinyin-data package) are tkrzw-only, so this lane fetches no
      # contract data; the nightly macOS job runs them.
      - run: cargo nextest run --locked --profile ci --status-level skip --workspace --no-default-features --features kyotocabinet
        if: needs.changes.outputs.reuse != 'true'
      - name: Build Cargo packages from their archives
        if: needs.changes.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          metadata=$(cargo metadata --format-version 1 --locked --no-deps)
          packages=$(jq -er '.packages[] | select(.publish != []) | [.name, .version] | @tsv' <<< "$metadata")
          # Only a package that another published package depends on by path
          # gets a patch entry; Cargo warns about a patch that no build uses.
          patched=$(jq -r '[.packages[] | select(.publish != []) | .dependencies[] | select(.path != null) | .name] | unique | .[]' <<< "$metadata")
          target=$(jq -er '.target_directory' <<< "$metadata")
          toolchain=$(rustup show active-toolchain)
          toolchain=${toolchain%% *}

          package_args=()
          while read -r name version; do
            package_args+=(-p "$name")
          done <<< "$packages"

          cargo package --locked "${package_args[@]}" --list
          # The pinned Cargo verifier can fail to find a checksum for a workspace
          # dependency in its temporary registry. Build the extracted archives
          # against one another instead.
          cargo package --locked "${package_args[@]}" --no-verify --target-dir "$scratch/target"
          printf '[patch.crates-io]\n' > "$scratch/archives.toml"
          while read -r name version; do
            tar -xzf "$scratch/target/package/$name-$version.crate" -C "$scratch"
            if grep -qxF -- "$name" <<< "$patched"; then
              printf '%s = { path = "%s" }\n' "$name" "$scratch/$name-$version" >> "$scratch/archives.toml"
            fi
          done <<< "$packages"

          cd "$scratch"
          # Every published package declares the kyotocabinet feature, the Linux cell.
          while read -r name version; do
            cargo "+$toolchain" --config "$scratch/archives.toml" build --offline \
              --no-default-features --features kyotocabinet \
              --target-dir "$target" --manifest-path "$name-$version/Cargo.toml"
          done <<< "$packages"
      - name: C++ pinyin.h smoke gate
        if: needs.changes.outputs.reuse != 'true'
        run: just cpp-smoke
      # Each cdylib exports exactly its pin version script's set and nothing else.
      - name: ABI export gate (development build)
        if: needs.changes.outputs.reuse != 'true'
        run: just abi exports
      # The allocator-pairing gate: every pointer the two C ABIs hand a
      # consumer is classified in libpinyin.alloc / libzhuyin.alloc, and a
      # C++ consumer built from those registers releases each one with its
      # declared deallocator under AddressSanitizer/LeakSanitizer. Catches a
      # library-side leak, a borrowed pointer wrongly declared owned, and a
      # new allocating entry point nobody classified. No extra apt package:
      # the g++ installed above already carries libasan/liblsan.
      - name: Allocator-pairing gate
        if: needs.changes.outputs.reuse != 'true'
        run: just abi alloc-pairing
      - name: Refresh the main Rust cache using the lane's compile mode
        if: github.event_name == 'push' && needs.changes.outputs.reuse == 'true'
        run: uv run --managed-python python -X utf8 -m tools.dev.ci_tree refresh rust

  # The Python harness tests of tools/, all of them whenever the gate selects
  # the job. Some of them run cargo metadata, a C compiler or GLib, so the job
  # takes the toolchain and the build packages.
  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: *ubuntu
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          uv: 'true'
          just: 'true'
      - name: Install build dependencies (apt)
        # The real-tool harnesses use gcc and GNU binutils (readelf, nm,
        # objcopy, objdump, as, ld) for the C stubs, make for the trainer
        # layout and pkg-config for the packaging link; the runner image ships
        # those. apt adds cmake for the tkrzw port's configure, the GLib
        # development package for the packaging link, diff for the
        # installed-metadata and neutrality comparisons, taskset (util-linux)
        # for the CPU-pinned child, and Valgrind for the end-to-end Linux
        # comparison on the stub library. No harness test compiles C++ or
        # reads libclang.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake libglib2.0-dev diffutils util-linux valgrind
      # Pyflakes rules (F) over tools/. This job runs on every tools/ change;
      # the lint job does not run for Python-only paths such as tools/bisection.
      - run: just ruff
      # just is installed above, so the size build's revision-recipe test must
      # run here rather than skip.
      - run: just test-tools
        env:
          OXPINYIN_REQUIRE_JUST: '1'

  # Stripped shipping-library sizes (constitution section 2). Builds both
  # facades with the release recipe (`just packaging install`) on the
  # Linux cell, strips them, checks their exports and writes the
  # base / PR table to the job summary. A failed build, install or export
  # check fails the job; a size increase does not.
  #
  # Base sizes come from a cache keyed by the shipping inputs' tree ids and
  # the toolchain fingerprint (`just packaging sizes key`), written by this
  # job on pushes to main. A hit costs one build, a miss two. A pull request
  # that misses saves its own base result, so its later pushes hit.
  # The pull request side builds the PR head, not the merge ref: the table
  # compares the PR's own change with its base.
  #
  # The job runs whenever `ship` is true, reuse or not: a reused tree proves
  # the tests, not the sizes of this PR against this base.
  shipping-sizes:
    needs: changes
    if: needs.changes.outputs.ship == 'true'
    runs-on: *ubuntu
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Warnings change no byte. The size build adds its own path remapping.
      RUSTFLAGS: ''
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only main saves the dependency cache; pull requests restore it.
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          rust-cache-key: shipping-sizes-job
          rust-cache-save-if: ${{ github.event_name == 'push' }}
          uv: 'true'
          just: 'true'
      - run: rustup show active-toolchain
      # cargo-c is the distribution's own package, as in release-packages.yml.
      # The backend packages are the Linux cell's (BACKEND_PACKAGES in
      # tools/dev/ship_sizes.py): libkyotocabinet-dev. Only the bdb feature
      # runs bindgen, so the build needs no libclang.
      - name: Install build dependencies (apt)
        run: |
          set -euo pipefail
          backend=$(just packaging sizes apt)
          read -r -a backend_pkgs <<< "$backend"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-dev cargo-c "${backend_pkgs[@]}"
      # After apt: the toolchain fingerprint reads the backend packages' versions.
      - name: Compute the base recipe key
        id: key
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            just packaging sizes key --commit "$BASE_SHA"
          else
            just packaging sizes key --commit HEAD
          fi
      - name: Restore the cached sizes
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ship-sizes
          key: ${{ steps.key.outputs.key }}
      - name: Build base and head, report the table
        if: github.event_name == 'pull_request'
        run: >
          just packaging sizes run --base "$BASE_SHA" --base-cache .ship-sizes/sizes.json
          --work "$RUNNER_TEMP/ship-sizes" --target target
      - name: Build main and cache its sizes
        if: github.event_name == 'push' && steps.cached.outputs.cache-hit != 'true'
        run: >
          just packaging sizes build --commit HEAD --out .ship-sizes/sizes.json
          --work "$RUNNER_TEMP/ship-sizes" --target target
      - name: Save the sizes under the recipe key
        if: success() && steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ship-sizes
          key: ${{ steps.key.outputs.key }}

  # The Berkeley DB peer and the store sanitizers, in one job under the
  # store gate. First Berkeley DB: Clippy over all workspace targets, rustdoc
  # and the workspace tests under exactly that peer. Then the store suite of
  # bdb and Kyoto Cabinet under the sanitizers. `rust` runs the Kyoto Cabinet
  # workspace tests on every change that selects this job, so they are not
  # repeated here. No Linux job runs tkrzw code
  # (docs/runbooks/verification.md, section 10), so tkrzw has no sanitizer
  # run; the nightly macOS and Windows jobs run its tests uninstrumented.
  #
  # The backend is exercised through the whole workspace: a backend that
  # "passes" only in the store's own unit tests and never reaches the decode
  # path does not count. Every pass decodes real queries through the fixture
  # tables.
  #
  # `--features <peer>` at `--workspace` scope enables that feature on every
  # workspace member that declares it, so the peer selection cascades through
  # each consumer's own `<peer> = ["oxpinyin/<peer>", ...]` forwarder. A bare
  # passthrough (`--features oxpinyin/<peer>`) does NOT — cargo features do
  # not back-propagate — and would leave each consumer's own
  # `#[cfg(feature = "<peer>")]` code (e.g. the per-backend mask walks in
  # oxpinyin's `user_index.rs` and `user_phrase_table.rs`) skipped even while
  # `DefaultStore` resolves to the peer. The bare-name form is the documented
  # public interface. The exactly-one-backend invariant is unchanged.
  #
  # The KMM crate depends on the backend: its operations run on the selected
  # store backend and its integration tests spawn the seven utilities against
  # `fixtures/w3/<backend>`. The training package stays too: its eval decode
  # compiles against the selected store backend. What runs is everything a
  # backend choice can change: the store itself, the user store, data readers,
  # runtime, engine, facade, both C ABIs, the training package and KMM.
  # nextest runs the suite with the `ci` profile of .config/nextest.toml, so
  # the store-backend test group applies.
  #
  # The stable peer build shares the job's target directory and its Rust
  # cache. The sanitizer builds use the nightly from fuzz/rust-toolchain.toml
  # and their own target directory under the runner's temporary directory, so
  # no sanitizer-flavoured artifact enters the cache.
  store:
    needs: changes
    if: needs.changes.outputs.store == 'true' && (needs.changes.outputs.reuse != 'true' || github.event_name == 'push')
    runs-on: *ubuntu
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          rust-cache-key: store-job
          uv: 'true'
          # The tests and the sanitizer service run nextest; a reuse run skips both.
          cargo-nextest: ${{ needs.changes.outputs.reuse != 'true' }}
      - name: Install build dependencies (apt)
        # Both backends' packages, once. libdb-dev resolves to libdb5.3-dev, the
        # system libdb the bdb backend links and whose db.h bindgen reads.
        # bindgen loads libclang at run time (its `runtime` feature): the
        # runner image's Clang packages ship /usr/lib/llvm-*/lib/libclang-*.so.1
        # and their builtin headers, so no libclang-dev. libkyotocabinet-dev:
        # the library the kyotocabinet backend links and the headers its cxx
        # bridge compiles against with g++. util-linux serves the sanitizer
        # service; libasan ships with gcc.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends util-linux libdb-dev libkyotocabinet-dev zlib1g-dev libglib2.0-dev

      - name: Clippy (bdb)
        if: needs.changes.outputs.reuse != 'true'
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features bdb -- -D warnings
      - name: Rustdoc (bdb)
        if: needs.changes.outputs.reuse != 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --no-default-features --features bdb
      - name: Test the workspace (bdb)
        if: needs.changes.outputs.reuse != 'true'
        id: test-bdb
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          cargo nextest run --locked --profile ci --status-level skip --workspace --no-default-features --features bdb
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      # The sanitizer runs go through the sanitizer service in
      # tools/dev/test_runner.py, which `just sanitize` also uses.
      - name: Install the sanitizer nightly
        if: needs.changes.outputs.reuse != 'true'
        working-directory: fuzz
        run: rustup toolchain install
      # The Berkeley DB feature's own suite under ASan. The hazards are the DBT
      # plumbing and cursor buffers (Rust, ASan). libdb's own internals are not
      # instrumented. On a BerkeleyDB distro the system bigram.db is BDB and
      # every session opens it through this FFI.
      - name: Sanitizers (bdb)
        if: needs.changes.outputs.reuse != 'true'
        id: sanitize-bdb
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sanitizer-target
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          uv run --managed-python python -X utf8 -c 'import sys; from tools.dev.entry import require_utf8_mode; require_utf8_mode(); from tools.dev.test_runner import sanitize; raise SystemExit(sanitize(sys.argv[1:]))' bdb
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"
      # The Kyoto Cabinet feature's own suite under ASan + LeakSanitizer. The
      # backend crosses into C++ through a cxx bridge
      # (src/store/kyotocabinet/adapter.cc): visitor regions are borrowed for
      # one callback, cursors borrow their database, and an empty region must
      # not reach Kyoto Cabinet as address 1. The store's build script
      # instruments the adapter and cxx's generated glue under address.
      - name: Sanitizers (kyotocabinet)
        if: needs.changes.outputs.reuse != 'true'
        id: sanitize-kyotocabinet
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sanitizer-target
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          uv run --managed-python python -X utf8 -c 'import sys; from tools.dev.entry import require_utf8_mode; require_utf8_mode(); from tools.dev.test_runner import sanitize; raise SystemExit(sanitize(sys.argv[1:]))' kc
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"
      - name: Report
        if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' }}
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_BDB: ${{ steps.test-bdb.outcome }} ${{ steps.test-bdb.outputs.elapsed }}
          SANITIZE_BDB: ${{ steps.sanitize-bdb.outcome }} ${{ steps.sanitize-bdb.outputs.elapsed }}
          SANITIZE_KYOTOCABINET: ${{ steps.sanitize-kyotocabinet.outcome }} ${{ steps.sanitize-kyotocabinet.outputs.elapsed }}
        run: |
          row() {
            read -r outcome elapsed <<< "$2"
            echo "| $1 | ${outcome:-not run} | ${elapsed:-—}s |"
          }
          {
            echo "## store"
            echo ""
            echo "Result: **$([ "$JOB_STATUS" = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "| Phase | Outcome | Wall clock |"
            echo "|---|---|---:|"
            row 'bdb workspace tests' "$TEST_BDB"
            row 'bdb sanitizers (address)' "$SANITIZE_BDB"
            row 'kyotocabinet sanitizers (address, leak)' "$SANITIZE_KYOTOCABINET"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh the main Rust cache using the lane's compile mode
        if: github.event_name == 'push' && needs.changes.outputs.reuse == 'true'
        run: uv run --managed-python python -X utf8 -m tools.dev.ci_tree refresh store

  # The required aggregate checks each job against its flag and `reuse`,
  # and shipping-sizes against `ship` alone. Every applicable job must
  # succeed, and every other job must be skipped. It runs after failures and
  # can be cancelled.
  ci-aggregate:
    needs: [changes, rust, harness, shipping-sizes, store]
    if: ${{ !cancelled() }}
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          uv: 'true'
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: uv run --managed-python python -X utf8 -m tools.dev.ci_tree aggregate

  # The marker says the aggregate passed: every lane the gate selected
  # succeeded and every other lane was skipped. A later run reads the lanes'
  # own results from this run, and reuses it only when each lane that run
  # selects succeeded here (tools/dev/ci_tree.py). So a lane's success must
  # mean the same checks in every run: no step of a lane may depend on a
  # path flag, only on `reuse`.
  tree-evidence:
    name: tested tree ${{ needs.changes.outputs.tree }}
    needs: [changes, ci-aggregate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'false' && needs.changes.result == 'success' && needs.ci-aggregate.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'Every selected verification lane passed for this checkout tree.'

  reused-tree-evidence:
    name: reused tree ${{ needs.changes.outputs.tree }} from run ${{ needs.changes.outputs.source_run }}
    needs: [changes, ci-aggregate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'true' && needs.ci-aggregate.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'The original PR run was revalidated for this exact tree.'
