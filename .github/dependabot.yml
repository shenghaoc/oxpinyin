    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      phf:
        patterns:
          - "phf*"
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    groups:
      phf:
        patterns:
          - "phf*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
