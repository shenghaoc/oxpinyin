# Path gates: CI runs its lanes only when code or a direct input of one
# of its jobs changes, so docs-only changes skip lint, test,
# and deny entirely. The gate moved from the workflow trigger to
# the jobs themselves (2026-09-08): the workflow always starts, the
# `changes` job computes one `run` flag from the path set below, and
# every lane carries `if: needs.changes.outputs.run == 'true'`.
#
# The skip claim above holds only for a branch up to date with main: the
# `changes` job computes its flag with a two-dot diff (git diff
# --name-only "$base" HEAD, where $base is pull_request.base.sha), so a
# branch behind main sees main's own commits in the gated paths and
# sets run=true. Demonstrated on PR #487 (2026-09-19): 5 behind main,
# tools/bisection/ changes on main ran the full matrix; rebased onto
# the landing tip, the same docs-only branch skipped every code lane.
# That over-approximation is intentional under rebase-and-merge — the
# two-dot diff asks whether the post-merge tree differs from main's
# current tree, which is the question that matters — not a bug to be
# fixed.
#
# Why each path is gated:
#   - crates/** — any code change
#   - fuzz/** — lint formats the fuzz workspace and deny checks its
#     graph against fuzz/Cargo.lock (the targets themselves build and
#     run only in verify-nightly.yml's fuzz-soak)
#   - tools/** — the test job runs tools/bisection/run-cpp-smoke.sh and
#     the tools/abi/ export and allocator-pairing gates, so changes to
#     those scripts are CI inputs
#   - Cargo.toml / Cargo.lock — workspace manifest and lockfile: a
#     dependency or feature change reaches lint, test and deny
#   - deny.toml — the deny job reads this directly
#   - rust-toolchain.toml — a toolchain change affects every job
#   - .github/workflows/ci.yml — the workflow file itself
#   - .github/scripts/lint-crate-cfg-placement.sh and
#     tests/lint-crate-cfg-placement.test.sh — the lint job runs the
#     crate-cfg placement checker and the harness that gates it, so a
#     change to either is a direct input of that job
#   - fixtures/** — the frozen tables, goldens and DBM files that the
#     test job decodes through; a fixture-only change
#     is exactly the kind that must be re-proven (added 2026-09-06 — until
#     then a fixture-only PR ran no CI at all)
#   - tests/parity/** — the parity corpus pinyin-oracle's tests replay
#   - clippy.toml — the lint job's Clippy configuration (msrv)
#   - .config/nextest.toml — the `ci` nextest profile the Linux and macOS
#     test jobs run under
#   - .github/actions/** — the bootstrap composite action every job runs
#
# Deliberately NOT gated (changes to these skip every lane):
#   - docs/** — findings, design docs, ROADMAP: no code
#   - reference/** — memory safety docs: no code
#   - .kiro/** — specs and steering: no code
#   - *.md at the root — README, CHANGELOG: no code
#   - .github/workflows/store-backends.yml — store-backends has its own
#     trigger and its own path gate; ci.yml doesn't need to re-gate on it
#
# Branch-protection interaction: skipped lanes still REPORT (conclusion
# `skipped`), which required status checks treat as satisfied, and the
# always-running `ci-aggregate` job at the tail reports on every push
# and PR no matter what changed — it is the shape a required check
# needs. Main's required set is `ci-aggregate`. `ci-aggregate`
# fails when any lane that should have run failed or was cancelled,
# and when a gated-out lane was skipped despite its paths changing.
# The path-set bypass (a PR editing ci.yml to skip its own lanes) is
# closed as far as this workflow can close it — the aggregate compares
# each lane's conclusion against the same `changes` output — but a PR
# that rewrites the workflow itself can always rewrite its gates; that
# residual is a branch-protection policy question (enforce for
# administrators), not a workflow one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A new push to a pull request cancels that pull request's older run. Runs
# on main never cancel each other: each push gets its own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three job groups (plus path gate and aggregate):
#   lint — rustfmt + clippy + the Lizard CCN ratchet
#   test — cargo test for the whole workspace (the ONE full sweep per
#          PR), and the portable workspace (all but capi, zhuyin-capi, and
#          the backend-independent corpus, KMM, punctuation, and word
#          tools) on macOS. The combined training package stays
#          in that lane because segment/eval/train use the selected backend.
# The full Windows workspace job runs in verify-nightly.yml (nightly and on
# manual dispatch), not on every PR.
#   deny — supply-chain gate: RustSec advisories, licenses, sources,
#          duplicate-version drift (docs/safety/oxpinyin-safety-profile.md
#          layer 6)
# Fuzzing is not a PR lane: every target builds and soaks nightly in
# verify-nightly.yml's fuzz-soak (moved there 2026-09-23 — the per-PR
# build-and-smoke of every target cost more than it caught).

jobs:
  # The path gate as a job: one `run` flag for the whole workflow (the
  # lanes all share one input set, so they gate together). Runs first on
  # every push and PR; each lane carries `if: needs.changes.outputs.run
  # == 'true'` so it reports `skipped` — a conclusion, which unlike a
  # workflow-level path filter still reaches required-check accounting.
  #
  # No third-party filter action: checkout with full history and diff
  # against the event's base (the PR base sha; the previous pushed head
  # on main). A missing base (first push, force-push rewrite, rebased
  # base) falls back to running everything — the over-trigger direction,
  # never the skip direction. Diffing the event base directly (not the
  # merge-base) can only pick up extra files when the base moved under
  # the event; that over-triggers too. The pathspec list is the one the
  # header documents; keep the two in lockstep.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compute the path-gate flag
        id: gate
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "base $base unavailable; running every lane"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD --             crates fuzz tools             Cargo.toml Cargo.lock rust-toolchain.toml deny.toml clippy.toml             .github/workflows/ci.yml             .github/scripts/lint-crate-cfg-placement.sh             tests/lint-crate-cfg-placement.test.sh             fixtures tests/parity .github/actions .config/nextest.toml)
          if [ -n "$changed" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: lint-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Berkeley DB is the default store backend (the analogue of a
        # bare libpinyin ./configure); bindgen (libclang) reads the
        # system db.h at build time. test-macos installs Homebrew
        # berkeley-db@5, so that job does not use this apt line.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libdb-dev libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      # Placement gate for crate-level `#![cfg(...)]`. A gate that
      # evaluates false discards the crate attributes written AFTER it, so
      # one placed above a `//!` block takes the docs with it and
      # `missing_docs` fires — on the excluded platform only, which no job
      # here can see: this container makes every `target_os = "linux"`
      # gate true, and test-macos and the nightly Windows job build the
      # portable crates only, so the breakage surfaced on a contributor's macOS checkout
      # instead. The checker reads placement, not cfg outcomes, so it holds
      # for every host from here. Harness first: a regression in the
      # checker itself must not pass quietly.
      - run: tests/lint-crate-cfg-placement.test.sh
      - run: .github/scripts/lint-crate-cfg-placement.sh
      # Drop-in version agreement: the capi manifests' header subdirectory
      # and pkg_config version against the pin record (issue #537). The
      # full installed-tree diff, tools/packaging/check-pc-metadata.sh,
      # needs the pin-built libpinyin, which CI never has.
      - run: tools/packaging/check-pc-version.sh
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Complexity ratchet: no function may exceed CCN 40 (current max is
      # 38, the user/store.rs quartet — a tracked refactor target, never
      # allowed to grow past the limit). Moved here from verify-nightly
      # on 2026-09-08: seconds of runtime, and a ratchet that fired only
      # the night after a merge was a ratchet in name only.
      # --break-system-packages: PEP 668 marking; this container is
      # ephemeral, there is no system Python to protect. 1.24.0 is the
      # release the ratchet was validated against locally.
      - run: apt-get install -y --no-install-recommends python3-pip
      - run: pip install --break-system-packages lizard==1.24.0
      - run: lizard crates/ -l rust -C 40

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          rust-cache-key: test-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Berkeley DB is the default store backend (the analogue of a
        # bare libpinyin ./configure); bindgen (libclang) reads the
        # system db.h at build time. test-macos installs Homebrew
        # berkeley-db@5, so that job does not use this apt line.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libdb-dev libglib2.0-dev
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          uv_install_dir="$HOME/.local/bin"
          (
            [[ $(uname -s)-$(uname -m) == Linux-x86_64 ]]
            uv_target=x86_64-unknown-linux-gnu
            # Published in https://github.com/astral-sh/uv/releases/download/0.13.1/sha256.sum.
            # Exact on purpose (#1074): a checksum is only known for a known version.
            uv_sha256=eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
            # Keep the archive in memory. Write only its verified executables.
            uv_payload=$(curl --fail --location --retry 3 "https://github.com/astral-sh/uv/releases/download/0.13.1/uv-$uv_target.tar.gz" | base64)
            uv_actual=$(printf '%s' "$uv_payload" | base64 -d | sha256sum)
            [[ ${uv_actual%% *} == "$uv_sha256" ]] || { printf 'uv archive checksum mismatch\n' >&2; exit 1; }
            uv_tmp=$(mktemp -d)
            trap 'rm -rf "$uv_tmp"' EXIT
            trap 'exit 1' HUP INT TERM
            printf '%s' "$uv_payload" | base64 -d | tar -xz -C "$uv_tmp" "uv-$uv_target/uv" "uv-$uv_target/uvx"
            mkdir -p "$uv_install_dir"
            install -m755 "$uv_tmp/uv-$uv_target/uv" "$uv_tmp/uv-$uv_target/uvx" "$uv_install_dir/"
            printf 'uv archive SHA-256 verified: %s\n' "$uv_sha256"
          )
          export PATH="$HOME/.local/bin:$PATH"
          hash -r
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version | grep -q '^uv 0\.13\.1 '
          uv python install cpython@3.15
          uv run --no-project --managed-python --python cpython@3.15+gil python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python", "cpython@3.15+gil"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON
      - name: Run tools Python harness tests
        shell: bash
        run: |
          set -uo pipefail
          # Tests that need inputs CI never has stay out of this discovery
          # loop rather than self-skipping (docs/testing/README.md). The list
          # is deliberately explicit: a new *.test.py is picked up by find,
          # and every listed exclusion needs a comment naming its missing
          # input. A failure in any non-excluded file fails this step.
          excluded=(
            # Compiler-backed J-ledger checks require clang++, LLVM tools and
            # a discoverable libclang. These jobs do not provision that
            # toolchain.
            tools/bisection/internal-ledger.test.py
          )
          is_excluded() {
            local candidate="$1" item
            for item in "${excluded[@]}"; do
              if [ "$candidate" = "$item" ]; then
                return 0
              fi
            done
            return 1
          }
          status=0
          while IFS= read -r test_file; do
            if is_excluded "$test_file"; then
              printf 'tools harness excluded (missing CI input): %s\n' "$test_file"
              continue
            fi
            printf 'tools harness: %s\n' "$test_file"
            if ! uv run --no-project --managed-python --python cpython@3.15+gil \
                python -X lazy_imports=normal "$test_file"; then
              status=1
            fi
          done < <(find tools -type f -name '*.test.py' | LC_ALL=C sort)
          if [ "$status" -ne 0 ]; then
            echo '::error::one or more tools/ Python harness tests failed' >&2
          fi
          exit "$status"
      # The w3 fixture manifest is a byte-identity gate that nothing
      # consumed: no job, test or script checked it, which is how a stale
      # row survived two members of the stack that produced this step.
      # `fixtures/w3/README.md` documents a REGENERATION command — running
      # that in CI would overwrite the very drift this must catch, so this
      # is a check, run from the repo root because the manifest's paths are
      # repo-relative.
      - name: Verify the w3 fixture checksums
        run: sha256sum -c fixtures/w3/fixtures.sha256
      - name: Install pinned cargo-nextest
        run: |
          # Exact on purpose (#1074): a checksum is only known for a known version.
          ver=0.9.143
          sum=6d891c18105ec2d33f6e441a4f92b7ccab47ba263e22055c8bb66884243f3389
          curl -sSfL -o cargo-nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf cargo-nextest.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-nextest ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo nextest run --locked --profile ci --status-level skip --workspace
      # nextest does not run doctests; keep the same workspace selection.
      - run: cargo test --locked --doc --workspace
      - name: C++ pinyin.h smoke gate
        run: tools/bisection/run-cpp-smoke.sh
      # The exported-symbol gate: each cdylib exports exactly its pin
      # version script's set (libpinyin.ver 79, libzhuyin.ver 52) and
      # leaks nothing else — in the development build (fixture hooks
      # allowed) and in the packaged one (--features shipped, hooks
      # compiled out). The packaged mode is the last step of this job.
      - name: ABI export gate (development build)
        run: tools/abi/check-exports.sh
      # The allocator-pairing gate: every pointer the two C ABIs hand a
      # consumer is classified in libpinyin.alloc / libzhuyin.alloc, and a
      # C++ consumer built from those registers releases each one with its
      # declared deallocator under AddressSanitizer/LeakSanitizer. Catches a
      # library-side leak, a borrowed pointer wrongly declared owned, and a
      # new allocating entry point nobody classified. No extra apt package:
      # the g++ installed above already carries libasan/liblsan.
      - name: Allocator-pairing gate
        run: tools/abi/check-alloc-pairing.sh
      # The exported-symbol gate's packaged mode runs after every gate that
      # uses the development build (#970). Only oxpinyin-capi rebuilds for
      # it, and that build replaces the development one: the crate's lib
      # target is a cdylib, so cargo writes both feature sets to the same
      # files and fingerprint in target/cells/bdb. A development-build gate
      # after this step would compile oxpinyin-capi again.
      - name: ABI export gate (shipped build)
        run: tools/abi/check-exports.sh --shipped

  # macOS links a C store backend: Homebrew's keg-only berkeley-db@5 (the
  # path README.md documents), selected explicitly. #501 removed redb. The
  # job excludes the two C-ABI crates (glib and cargo-c, Linux-only) and the
  # backend-independent corpus, KMM, punctuation, and word tools. The
  # combined training package remains in the lane because its
  # segment/eval/train modules use the backend. oxpinyin-dictool stays
  # in the set: its C-ABI dependency was cut, and it drives the facade's
  # import/export machinery directly.
  #
  # The Windows job with the same exclude set runs in verify-nightly.yml.
  # Containers run on Linux runners only, so these operating systems get
  # their own jobs rather than a containerized matrix.
  test-macos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          uv_install_dir="$HOME/.local/bin"
          case "$(uname -m)" in
            arm64)
              uv_target=aarch64-apple-darwin
              # Published in https://github.com/astral-sh/uv/releases/download/0.13.1/sha256.sum.
              # Exact on purpose (#1074): a checksum is only known for a known version.
              uv_sha256=cfe454573412ff7380d15fc7dae5997ab53ffce72fce0a78e91ddbc84001acd2
              ;;
            x86_64)
              uv_target=x86_64-apple-darwin
              # Published in https://github.com/astral-sh/uv/releases/download/0.13.1/sha256.sum.
              # Exact on purpose (#1074): a checksum is only known for a known version.
              uv_sha256=bb7b805bdcf3d0bc8c74ceb94569e6b3e8aa35bd492acdbb9d46bf46d9d4ff6b
              ;;
            *)
              printf 'unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          uv_tmp=$(mktemp -d)
          trap 'rm -rf "$uv_tmp"' EXIT
          trap 'exit 1' HUP INT TERM
          curl --fail --location --retry 3 -o "$uv_tmp/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/0.13.1/uv-$uv_target.tar.gz"
          uv_actual=$(shasum -a 256 "$uv_tmp/uv.tar.gz")
          [[ ${uv_actual%% *} == "$uv_sha256" ]] || { printf 'uv archive checksum mismatch\n' >&2; exit 1; }
          tar -xzf "$uv_tmp/uv.tar.gz" -C "$uv_tmp" "uv-$uv_target/uv" "uv-$uv_target/uvx"
          mkdir -p "$uv_install_dir"
          install -m755 "$uv_tmp/uv-$uv_target/uv" "$uv_tmp/uv-$uv_target/uvx" "$uv_install_dir/"
          printf 'uv archive SHA-256 verified: %s\n' "$uv_sha256"
          export PATH="$HOME/.local/bin:$PATH"
          hash -r
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version | grep -q '^uv 0\.13\.1 '
          uv python install cpython@3.15
          uv run --no-project --managed-python --python cpython@3.15+gil python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python", "cpython@3.15+gil"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON
      - name: Run tools Python harness tests
        shell: bash
        run: |
          set -uo pipefail
          # Tests that need inputs CI never has stay out of this discovery
          # loop rather than self-skipping (docs/testing/README.md). The list
          # is deliberately explicit: a new *.test.py is picked up by find,
          # and every listed exclusion needs a comment naming its missing
          # input. A failure in any non-excluded file fails this step.
          excluded=(
            # Compiler-backed J-ledger checks require clang++, LLVM tools and
            # a discoverable libclang. These jobs do not provision that
            # toolchain, so the test fails before its assertions can run.
            tools/bisection/internal-ledger.test.py
          )
          is_excluded() {
            local candidate="$1" item
            for item in "${excluded[@]}"; do
              if [ "$candidate" = "$item" ]; then
                return 0
              fi
            done
            return 1
          }
          status=0
          while IFS= read -r test_file; do
            if is_excluded "$test_file"; then
              printf 'tools harness excluded (missing CI input): %s\n' "$test_file"
              continue
            fi
            printf 'tools harness: %s\n' "$test_file"
            if ! uv run --no-project --managed-python --python cpython@3.15+gil \
                python -X lazy_imports=normal "$test_file"; then
              status=1
            fi
          done < <(find tools -type f -name '*.test.py' | LC_ALL=C sort)
          if [ "$status" -ne 0 ]; then
            echo '::error::one or more tools/ Python harness tests failed' >&2
          fi
          exit "$status"
      # The macOS reference backend uses the same libdb release as Linux;
      # tkrzw stays covered on Linux. Homebrew's keg-only berkeley-db@5
      # needs explicit include and library paths, as documented in README.md.
      # `--no-default-features` also keeps
      # pinyin-oracle's Linux-only `oracle-ffi` off.
      - name: Install the store backend (Homebrew Berkeley DB 5.3)
        run: |
          brew install berkeley-db@5 glib pkgconf
          echo "OXPINYIN_BDB_INCLUDE_DIR=$(brew --prefix berkeley-db@5)/include" >> "$GITHUB_ENV"
          echo "OXPINYIN_BDB_LIB_DIR=$(brew --prefix berkeley-db@5)/lib" >> "$GITHUB_ENV"
          # `brew list --versions` prints "<name> <cellar-version>..."
          # (space-separated; a second installed version is another field
          # on the same line). Pin the surveyed 5.3.x line; a version
          # bump fails here instead of silently.
          brew list --versions berkeley-db@5 | grep -Eq '^berkeley-db@5 5[.]3[.]' \
            || { echo "::error::Homebrew berkeley-db@5 is not the documented 5.3.x line: $(brew list --versions berkeley-db@5)"; exit 1; }
      - name: Install pinned cargo-nextest
        run: |
          # Exact on purpose (#1074): a checksum is only known for a known version.
          ver=0.9.143
          sum=4830d430411148d17602a75cc880bfb4dc8dac153dea59a48a2ef4cc93577f07
          curl -sSfL -o cargo-nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-universal-apple-darwin.tar.gz"
          echo "${sum}  cargo-nextest.tar.gz" | shasum -a 256 -c -
          tar xzf cargo-nextest.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-nextest ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: >
          cargo nextest run --locked --profile ci --status-level skip --workspace --no-default-features --features bdb
          --exclude oxpinyin-capi --exclude oxpinyin-zhuyin-capi
          --exclude oxpinyin-corpus --exclude oxpinyin-kmm --exclude oxpinyin-punct
          --exclude oxpinyin-word
      # nextest does not run doctests; keep the same features and exclusions.
      - run: >
          cargo test --locked --doc --workspace --no-default-features --features bdb
          --exclude oxpinyin-capi --exclude oxpinyin-zhuyin-capi
          --exclude oxpinyin-corpus --exclude oxpinyin-kmm --exclude oxpinyin-punct
          --exclude oxpinyin-word

  # Supply-chain gate. cargo-deny's advisories check consumes the same
  # RustSec DB cargo-audit uses, so this one job replaces both tools; the
  # policy (allow-lists, deviation registry with review-by dates) lives in
  # deny.toml. The binary is downloaded pinned rather than `cargo install`ed
  # to keep the job under a minute.
  #
  # Debian Testing container in the store-backends.yml style: the supply
  # chain is checked on the rolling toolchain distros actually ship, and
  # the image is deliberately unpinned for the same reason (see that
  # workflow's header).
  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny shells out to `cargo metadata`, so a cargo binary is
      # required; minimal profile suffices (nothing here compiles code).
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      - name: Install pinned cargo-deny
        run: |
          # Exact on purpose (#1074): a checksum is only known for a known version.
          ver=0.20.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -sSfL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz
          mkdir -p ~/.local/bin
          install -m755 "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Default-feature tree first, then the feature-gated dependency
      # subtrees (tkrzw, oracle-ffi). --locked pins both root graphs
      # to the committed Cargo.lock, which Dependabot maintains. The fuzz
      # workspace has its own lock (fuzz/Cargo.lock) and its own graph
      # (libfuzzer-sys plus workspace path deps). Dependabot's cargo
      # ecosystem at directory: "/fuzz" updates that lock for crates.io
      # bumps in the fuzz graph. A root `/` bump that changes workspace
      # pins or path crates reachable from fuzz, and does not refresh
      # fuzz/Cargo.lock, fails --locked. That failure is the gate.
      - run: cargo deny --locked --log-level error check
      - run: cargo deny --locked --all-features --log-level error check
      - run: cargo deny --locked --log-level error --manifest-path fuzz/Cargo.toml check
      # deny.toml's advisory ignore list is empty, so nothing here needs a
      # scope assertion to bound it. The guard this replaced existed only
      # to keep the RUSTSEC-2025-0141 (bincode) ignore honest while heed
      # was in the tree; that backend now binds a system C library, so
      # heed, heed-types and bincode are all gone.

  # The required aggregate check: always runs, always reports. Red only
  # when a lane that should have run ended as
  # anything but success, or when the path gate said run but a lane
  # was skipped anyway (a broken `if`, or a PR narrowing its own
  # gates). `skipped` with run=false is green: those lanes had no
  # inputs on this change, which is exactly what a path gate means.
  # store-backends.yml and verify-nightly.yml keep their own triggers
  # and remain non-required lanes beside this one.
  ci-aggregate:
    needs:
      [changes, lint, test, test-macos, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any lane failed, was cancelled, or skipped unjustly
        env:
          CHANGES: ${{ needs.changes.result }}
          GATED: ${{ needs.changes.outputs.run }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_MACOS: ${{ needs.test-macos.result }}
          DENY: ${{ needs.deny.result }}
        run: |
          set -euo pipefail
          status=0
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job ended as $CHANGES"
            status=1
          fi
          lane() {
            local name="$1" result="$2"
            case "$result" in
              success) ;;
              skipped)
                if [ "$GATED" = true ]; then
                  echo "::error::$name skipped although the path gate said run"
                  status=1
                fi
                ;;
              *)
                echo "::error::$name ended as $result"
                status=1
                ;;
            esac
          }
          lane lint "$LINT"
          lane test "$TEST"
          lane test-macos "$TEST_MACOS"
          lane deny "$DENY"
          if [ "$status" -eq 0 ]; then
            echo "all lanes green (gated=$GATED)"
          fi
          exit $status
