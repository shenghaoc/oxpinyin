[package]
name = "pinyin-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Converter and exporter: oracle data → portable redb tables."

[lints.rust]
unsafe_code = "allow" # FFI to the libtkrzw bridge; // SAFETY: on every block
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# `export` drives the pin-built libpinyin through pinyin-oracle's seam.
# Without this feature only the raw Tkrzw → redb `convert` command builds.
oracle-ffi = ["dep:pinyin-oracle", "pinyin-oracle/oracle-ffi"]

[dependencies]
redb = { workspace = true }
pinyin-oracle = { path = "../pinyin-oracle", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
