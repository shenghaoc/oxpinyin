[package]
name = "oxpinyin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["/src/**"]
description = "oxpinyin internal crate — no stability promise; the supported interfaces are the C APIs. The Rust interface is unstable."

[lib]
doctest = false

# Internal session layer; no Rust stability promise (AGENTS.md, "External interfaces").
[lints]
workspace = true

[dependencies]
# Internal workspace crate: the parser, decoder and vocabulary types this API
# is a façade over. Not an external dependency.
oxpinyin-core = { path = "../oxpinyin-core", version = "=0.1.0-alpha.1" }
smallvec.workspace = true
compact_str.workspace = true
thiserror.workspace = true

[features]
# Nonshipping parser-driver access; no extra shipping entry points.
tools = ["oxpinyin-core/tools"]
