# Release packages — build drop-in packages for the three distro families on
# every published release and attach them to that release.
#
# One matrix child per distro, each building oxpinyin-capi +
# oxzhuyin-capi under exactly ONE store backend — the backend that
# matches the model data the distro's own libpinyin ships, so the drop-in
# reads the data already on the system (docs/findings/compatibility-policy.md):
#
#   distro   backend       because the distro's libpinyin/data is…
#   Debian   tkrzw         2.11.91 switched BerkeleyDB → Tkrzw (libtkrzw1t64)
#   Fedora   kyotocabinet  still KyotoCabinet (kyotocabinet-libs)
#   Arch     kyotocabinet  still KyotoCabinet (kyotocabinet)
#
# The packages REPLACE the distro's libpinyin/libzhuyin in their entirety:
# same sonames (libpinyin.so.15 / libzhuyin.so.15), same pkg-config names,
# versioned Provides at the pinned pc version (the pin record's libpinyin_tag,
# read by just packaging pc-version), Conflicts/Replaces
# (deb) or Obsoletes (rpm) or conflicts= (pacman) on the originals. Data is
# deliberately NOT replaced on Debian/Fedora (libpinyin-data is a separate
# package there and stays); on Arch the data lives inside the libpinyin
# package the takeover removes, so the Arch lane fetches that package and
# ships its data directory inside ours (the PKGBUILD of just packaging release-recipe).
#
# Image choice: each lane builds on the distro's rolling branch: Debian testing, Fedora Rawhide and
# Arch. For Debian that is testing (forky). The Debian packages are built
# with tkrzw for the data of Debian testing, so they do not support Debian
# stable (trixie, what debian:latest resolves to), whose libpinyin 2.8.1
# uses BerkeleyDB. Fedora uses fedora:rawhide, not fedora:latest, which is
# the current stable release.
#
# The build is the distribution's own: a generated recipe, built by its own
# driver (dpkg-buildpackage, rpmbuild -bb, makepkg) with its own cargo, rustc
# and cargo-c, in the image that driver builds in: debian:testing,
# fedora:rawhide with mock's @buildsys-build group, and archlinux:base-devel.
# `just packaging release-recipe` writes the recipe and a source archive that
# holds the vendored crates, so cargo runs offline (--frozen). The repository's
# Python writes the recipe and checks the installed result; it never runs in
# the build. The recipe builds and installs through tools/dev/packaging.mk,
# which links the shipped libraries with the distribution's own build flags,
# as its libpinyin package is built. The install gate requires BIND_NOW on both
# shipped libraries. Each driver strips and splits its debug package as it does
# by default; only the main packages are attached.
#
# Three jobs:
#   package — 3-container matrix; each child generates its recipe, builds
#             the packages with the distribution's driver, INSTALLS them back
#             into its own container and runs the consumer gates against /usr
#   attach   — collects every artifact, writes SHA256SUMS and resolves the
#             release repository through gh, as the upload does
#   publish  — uploads the assets to the published release with the
#             runner's gh CLI; release events only
#
# Every pull request to main runs the same jobs up to publish, as a dry run
# with the tag 0.0.0-dry-run.1+ci. There is no paths filter: the packages
# depend on inputs across the tree (the root Cargo.toml release profile, the
# build scripts, the .pc templates, the headers, the tkrzw store, the
# toolchain and lock files), and a filter that misses one finds the breakage
# only at release. The lanes run in parallel with ci.yml, so the Debian lane
# also builds the default tkrzw backend on every pull request. publish does
# not run, so a pull request never gets a write token.

name: Release packages

on:
  release:
    types: [published]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run per release: a re-published or edited release must not race a
# publish still uploading assets for the same tag. Queue, never cancel — the
# run in flight is the one whose packages are already half-attached. A new
# push to a pull request cancels that pull request's older dry run.
concurrency:
  group: release-packages-${{ github.event.release.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No RUSTFLAGS: the drivers set their own (Fedora's %build_rustflags, makepkg's
# rust.conf), and a newer distribution rustc must not fail on a new lint.
env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  # gh resolves the repository from GH_REPO: the attach and publish jobs
  # have no checkout and no git remote.
  GH_REPO: ${{ github.repository }}

jobs:
  package:
    name: ${{ matrix.distro }} (${{ matrix.backend }} store)
    # Pinned, not ubuntu-latest, so a runner-image move
    # (26.04: actions/runner-images#14748) happens here under review.
    runs-on: ubuntu-26.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 9
    defaults:
      run:
        shell: bash

    strategy:
      # One distro's failure must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:testing
            backend: tkrzw
            dbfmt: Tkrzw
          - distro: fedora
            image: fedora:rawhide
            backend: kyotocabinet
            dbfmt: KyotoCabinet
          - distro: arch
            image: archlinux:base-devel
            backend: kyotocabinet
            dbfmt: KyotoCabinet

    steps:
      # What the checkout, the uv bootstrap and the recipe generation need: git,
      # and the distribution's cargo for `cargo vendor` and `cargo tree`. The
      # build dependencies come from the generated recipe below. Fedora's
      # buildroot is mock's: the @buildsys-build group. The case is a closed set
      # over repository-controlled matrix values — fail-closed default.
      - name: Install the recipe tools
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
          debian)
            apt-get update -qq
            apt-get install -y --no-install-recommends git ca-certificates cargo dpkg-dev
            ;;
          fedora)
            dnf -y --setopt=install_weak_deps=False install @buildsys-build git ca-certificates cargo
            ;;
          arch)
            pacman -Syu --noconfirm git rust
            ;;
          *)
            echo "unknown distro '$DISTRO'" >&2
            exit 2
            ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          uv: 'true'

      # The install libdir per distro. Debian's is the MULTIARCH dir —
      # resolved with dpkg-architecture, not arch-name + "-linux-gnu":
      # on arm64 the dir is aarch64-linux-gnu while dpkg's arch name is
      # arm64 (they coincide on x86_64, hiding the difference).
      - name: Resolve the install libdir
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            debian) echo "LIBDIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" ;;
            fedora) echo "LIBDIR=/usr/lib64" ;;
            arch)   echo "LIBDIR=/usr/lib" ;;
          esac >> "$GITHUB_ENV"

      - name: Derive the package version from the release tag
        env:
          TAG: ${{ github.event_name == 'pull_request' && '0.0.0-dry-run.1+ci' || github.event.release.tag_name }}
          DISTRO: ${{ matrix.distro }}
        run: uv run --managed-python python -X utf8 -m tools.dev.packaging release-version "$DISTRO" "$TAG" >> "$GITHUB_ENV"

      - name: Check that the pre-release sorts before the stable version
        if: env.VERSION != env.BASE
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            debian) dpkg --compare-versions "$VERSION-1" lt "$BASE-1" ;;
            fedora) test "$(rpm --eval '%{lua:print(rpm.vercmp(os.getenv("VERSION"), os.getenv("BASE")))}')" -lt 0 ;;
            arch)   test "$(vercmp "$VERSION" "$BASE")" -lt 0 ;;
          esac

      # Arch has no separate data package: the model lives inside the libpinyin
      # package our takeover removes. Download (not install) that package; the
      # PKGBUILD ships its data directory in ours, so pinyin_init/zhuyin_init
      # still have a model afterwards. The file and version come from pacman's
      # own resolution, not a cache glob, so a stale cache entry can never be
      # picked up. -dd: print libpinyin alone, not its dependencies as well.
      - name: Download the Arch libpinyin data
        if: matrix.distro == 'arch'
        run: |
          set -euo pipefail
          pacman -Sw --noconfirm libpinyin
          read -r DATA_VER DATA_URL < <(pacman -Sp -dd --print-format '%v %l' libpinyin)
          DATA_PKG="/var/cache/pacman/pkg/$(basename "$DATA_URL")"
          [ -f "$DATA_PKG" ] || { echo "::error::downloaded Arch libpinyin package $DATA_PKG missing" >&2; exit 1; }
          printf 'DATA_ARGS=--data=%s --data-version=%s\n' "$DATA_PKG" "$DATA_VER" >> "$GITHUB_ENV"

      # The recipe and its source archive: HEAD, the vendored crates (cargo vendor
      # needs the network here, never in the build) and their source replacement.
      - name: Generate the recipe
        env:
          DISTRO: ${{ matrix.distro }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          # DATA_ARGS is unset except on Arch, and splits into its two words there.
          # shellcheck disable=SC2086
          uv run --managed-python python -X utf8 -m tools.dev.packaging release-recipe \
            "$DISTRO" "$BACKEND" "$VERSION" "$PWD/build" ${DATA_ARGS:-}

      # The recipe's own build dependencies, resolved by the distribution's tool.
      - name: Install the build dependencies
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            debian) apt-get build-dep -y --no-install-recommends "./build/oxpinyin-$VERSION" ;;
            fedora) dnf -y --setopt=install_weak_deps=False builddep build/SPECS/*.spec ;;
            arch)
              # shellcheck disable=SC1091
              (source build/PKGBUILD && pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}")
              ;;
          esac
          rustc --version
          cargo --version
          cargo cbuild --version

      # The distribution's driver builds the binary packages; cargo is offline.
      # makepkg refuses to run as root, so an unprivileged user runs it.
      - name: Build the packages
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          case "$DISTRO" in
            debian) (cd "build/oxpinyin-$VERSION" && dpkg-buildpackage -b -uc -us) ;;
            fedora) rpmbuild --define "_topdir $PWD/build" -bb build/SPECS/*.spec ;;
            arch)
              useradd --create-home --shell /bin/bash builder
              chown -R builder build
              su builder -c 'cd build && makepkg --noconfirm'
              ;;
          esac

      # Only the main packages are release assets, not the debug packages.
      - name: Collect the release packages
        env:
          DISTRO: ${{ matrix.distro }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          case "$DISTRO" in
            debian)
              base="oxpinyin-libpinyin15-$BACKEND"
              packages=(build/"${base}_$VERSION"-1_*.deb build/"${base}-dev_$VERSION"-1_*.deb)
              ;;
            fedora)
              name="oxpinyin-libpinyin-$BACKEND"
              packages=(build/RPMS/*/"$name-$VERSION"-1.*.rpm build/RPMS/*/"$name-devel-$VERSION"-1.*.rpm)
              ;;
            arch)
              packages=(build/"oxpinyin-libpinyin-$BACKEND-$VERSION-1-$(uname -m)".pkg.tar.zst)
              ;;
          esac
          want=2
          [ "$DISTRO" != arch ] || want=1
          [ "${#packages[@]}" -eq "$want" ] || { echo "::error::expected $want packages, found: ${packages[*]:-none}" >&2; exit 1; }
          cp -- "${packages[@]}" dist/
          ls -l dist

      # The install gate certifies the libtkrzw that its smoke programs load
      # against OXPINYIN_TKRZW_LIBRARY (tools/tkrzw/runtime.py), and refuses an
      # unconfigured runtime. The package depends on the distro's own libtkrzw:
      # the first ldconfig entry for libtkrzw.so.1, owned by a dpkg package.
      - name: Select the distro tkrzw runtime
        if: matrix.backend == 'tkrzw'
        run: uv run --managed-python python -X utf8 -m tools.dev.packaging distro-tkrzw-library --github-env

      # The takeover test: install OUR packages into this same container and
      # re-run the gates against the system prefix. Proves the package
      # installs clean under dpkg/dnf/pacman dependency checking and that
      # what lands on /usr answers as libpinyin/libzhuyin.
      - name: Install test and system gates
        env:
          DISTRO: ${{ matrix.distro }}
          BACKEND: ${{ matrix.backend }}
          DBFMT: ${{ matrix.dbfmt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # libpinyin-data is named explicitly on Debian/Fedora, although our
          # packages already Depend on (Debian) or Require (Fedora) it, so the
          # install fails if the distribution cannot supply its real model and
          # the init gate below runs against that model, as it will on a
          # user's system. The Arch package carries the data itself.
          case "$DISTRO" in
            debian)
              # The md5sums manifest lists each payload file once and only
              # payload files (lintian's md5sums check).
              apt-get install -y --no-install-recommends lintian
              lintian --tags md5sums-lists-nonexistent-file,md5sum-mismatch,file-missing-in-md5sums \
                --fail-on error,warning "$PWD"/dist/*.deb
              apt-get install -y libpinyin-data "$PWD"/dist/*.deb
              ;;
            fedora) dnf -y install libpinyin-data "$PWD"/dist/*.rpm ;;
            arch)   pacman -U --noconfirm "$PWD"/dist/*.pkg.tar.zst ;;
          esac
          ldconfig
          fail() { echo "::error::gate failed: $*" >&2; exit 1; }
          # The pin installs its shared libraries with mode 0755, as Fedora's and
          # Arch's packages ship them; dh_fixperms gives 0644, as Debian's
          # libpinyin15 ships them.
          mode=755
          [ "$DISTRO" != debian ] || mode=644
          uv run --managed-python python -X utf8 -m tools.dev.packaging check-library-mode "$LIBDIR" "$mode"
          # The distribution's LDFLAGS reached the relink: the shipped
          # libraries bind every symbol at load time, as its libpinyin does.
          for library in libpinyin.so.15 libzhuyin.so.15; do
            readelf -d "$LIBDIR/$library" | grep -q BIND_NOW || fail "$LIBDIR/$library has no BIND_NOW"
          done
          PCVER="$(uv run --managed-python python -X utf8 -m tools.dev.packaging pc-version)"
          [ "$(pkg-config --modversion libpinyin)" = "$PCVER" ] || fail "libpinyin modversion"
          [ "$(pkg-config --variable=database_format libpinyin)" = "$DBFMT" ] || fail "database_format"
          [ "$(pkg-config --variable=database_format libzhuyin)" = "$DBFMT" ] || fail "libzhuyin database_format"
          [ -n "$(pkg-config --variable=pkgdatadir libpinyin)" ] || fail "pkgdatadir"
          pkg-config --libs libpinyin | grep -qw -- "-lpinyin" || fail "libpinyin --libs"
          pkg-config --cflags libpinyin | grep -q -- "libpinyin-$PCVER" || fail "libpinyin --cflags"
          [ "$(pkg-config --modversion libzhuyin)" = "$PCVER" ] || fail "libzhuyin modversion"
          # Two programs, one public header + one library each — the real
          # consumer pattern (no program links both headers: they
          # re-declare the same enums and novel_types.h's tentative
          # definitions duplicate at link time). <stdbool.h> first because
          # upstream's headers use C99 bool without including it.
          #
          # Unlike the staged-tree smoke (no data there), this one opens the
          # system model the way a consumer does — pkgdatadir/data, the
          # one-level-up convention of docs/findings/installed-naming.md —
          # and a NULL context is a failed gate, not a diagnostic: the
          # whole point of the drop-in is reading the data already on the
          # system, so a package whose init fails against it must not ship.
          cat > smoke_pinyin.c <<'EOF'
          #include <stdbool.h>
          #include <pinyin.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (argc != 3) return 2;
            pinyin_context_t *c = pinyin_init(argv[1], argv[2]);
            printf("pinyin=%p\n", (void *)c);
            if (c == NULL) return 1;
            pinyin_fini(c);
            return 0;
          }
          EOF
          cat > smoke_zhuyin.c <<'EOF'
          #include <stdbool.h>
          #include <zhuyin.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (argc != 3) return 2;
            zhuyin_context_t *c = zhuyin_init(argv[1], argv[2]);
            printf("zhuyin=%p\n", (void *)c);
            if (c == NULL) return 1;
            zhuyin_fini(c);
            return 0;
          }
          EOF
          cc smoke_pinyin.c -o smoke_pinyin $(pkg-config --cflags --libs libpinyin) \
            || fail "libpinyin smoke compile/link on /usr"
          cc smoke_zhuyin.c -o smoke_zhuyin $(pkg-config --cflags --libs libzhuyin) \
            || fail "libzhuyin smoke compile/link on /usr"
          # The installed exports, their version tags and the SONAMEs are the
          # pin's, and the smoke programs load the certified libtkrzw.
          uv run --managed-python python -X utf8 -m tools.dev.packaging check-installed \
            "$BACKEND" "$LIBDIR" ./smoke_pinyin ./smoke_zhuyin
          SYSDATA="$(pkg-config --variable=pkgdatadir libpinyin)/data"
          [ -f "$SYSDATA/table.conf" ] || fail "no model at $SYSDATA (table.conf missing)"
          USERDIR="$(mktemp -d)"
          ./smoke_pinyin "$SYSDATA" "$USERDIR" || fail "pinyin_init on the system model at $SYSDATA"
          ./smoke_zhuyin "$SYSDATA" "$USERDIR" || fail "zhuyin_init on the system model at $SYSDATA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error

  attach:
    name: Collect the release assets
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
      # gh ships on the hosted runner (this job is NOT containerized). The
      # release list resolves the repository the way publish's upload does,
      # with no checkout, so a pull request run proves the upload can find it.
      - name: Resolve the release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach packages to the release
    needs: attach
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      # No third-party release-upload action is needed. --clobber makes
      # re-running a failed publish replace partial assets.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
