# Path gates. The workflow always starts. The `changes` job writes one flag per
# job (`python3 -m tools.dev.ci_tree gate`; CI_INPUTS in tools/dev/ci_tree.py
# holds each job's paths), and a job runs only when its flag is true. A skipped
# job still reports `skipped`, so the required `ci-aggregate` check sees it.
# Paths that no job reads, such as docs/, reference/ and the root
# Markdown files, select no job. The `changes` job itself checks the one rule
# that reads every tracked file: the Python version request is written once.
#
# The gate compares the event's base with HEAD (a two-dot diff). A branch behind
# main also sees main's own changes, so it can select more jobs, never fewer. A
# missing base selects every job.
#
# Main's required set is `ci-aggregate`. It fails when an applicable job fails or
# when a job's result does not agree with its flag. A pull request that changes
# this workflow can also change its gates; branch protection covers that case.
# The platform and backend merge conditions are docs/runbooks/verification.md,
# section 10.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A new push to a pull request cancels that pull request's older run. Runs
# on main never cancel each other: each push gets its own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs after the gate:
#   lint — rustfmt, Clippy, ShellCheck and the Lizard complexity limit
#   test — the workspace tests on Linux; the macOS and Windows runs are in
#          verify-nightly.yml
#   deny — the supply-chain check: advisories, licenses, sources, duplicates
#   harness — the Python harness tests of tools/, when tools/ or a file its
#             tests read changed
#   shipping-sizes — the stripped shipping-library sizes
# The fuzz targets build and run in verify-nightly.yml only.

jobs:
  store-backends:
    uses: ./.github/workflows/store-backends.yml

  changes:
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). It names a release, not ubuntu-latest, so a runner
    # image change happens here under review.
    runs-on: &ubuntu ubuntu-26.04
    outputs:
      lint: ${{ steps.gate.outputs.lint }}
      test: ${{ steps.gate.outputs.test }}
      deny: ${{ steps.gate.outputs.deny }}
      harness: ${{ steps.gate.outputs.harness }}
      ship: ${{ steps.gate.outputs.ship }}
      reuse: ${{ steps.evidence.outputs.reuse }}
      tree: ${{ steps.evidence.outputs.tree }}
      source_run: ${{ steps.evidence.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the Bash floor
        shell: bash
        run: . tools/lib/bash-floor.sh
      - name: Compute the path-gate flags
        id: gate
        run: python3 -m tools.dev.ci_tree gate
      # Every tracked file is an input of this rule, so it runs here on every
      # change, under the runner's own Python. The file's other test class
      # needs uv and runs with the harness.
      - name: Python version request is written once
        run: python3 tools/dev/python-request.test.py RequestLiteralTests
      # After the gate: evidence must cover every lane the gate selects.
      - name: Look up successful PR evidence for this tree
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_FLAGS: ${{ toJSON(steps.gate.outputs) }}
        run: python3 -m tools.dev.ci_tree evidence ci

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true' && (needs.changes.outputs.reuse != 'true' || github.event_name == 'push')
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: lint-job
          uv: ${{ needs.changes.outputs.reuse != 'true' }}
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # The tkrzw action installs the overlay port with vcpkg and
        # points pkg-config at it. The tkrzw cxx bridge compiles with g++;
        # bindgen (libclang) serves the Berkeley DB lanes.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libglib2.0-dev
      # The distribution package supplies ShellCheck. The minimum is the
      # version whose findings this tree is clean under.
      - name: ShellCheck tracked scripts (>= 0.11.0)
        if: needs.changes.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends shellcheck
          version=$(shellcheck --version | sed -n 's/^version: //p')
          printf 'ShellCheck %s\n' "$version"
          dpkg --compare-versions "$version" ge 0.11.0 ||
            { printf '::error::ShellCheck %s is older than 0.11.0\n' "$version"; exit 1; }
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck --severity=warning
      - run: cargo fmt --all --check
        if: needs.changes.outputs.reuse != 'true'
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
        if: needs.changes.outputs.reuse != 'true'
      # Placement gate for crate-level `#![cfg(...)]`. A gate that evaluates
      # false discards the crate attributes after it, so one above a `//!`
      # block removes the docs and `missing_docs` fires on the excluded
      # platform only. This Linux container cannot see that, so the checker
      # reads placement, not cfg outcomes. Its harness runs first, so a
      # defect in the checker cannot pass.
      - name: Crate cfg-placement harness
        if: needs.changes.outputs.reuse != 'true'
        run: uv run --no-project --managed-python python -X utf8 -m tools.dev.test_runner tools/dev/lint-crate-cfg-placement.test.py
      - name: Crate cfg-placement gate
        if: needs.changes.outputs.reuse != 'true'
        run: uv run --no-project --managed-python python -X utf8 -c 'import sys; from tools.dev.entry import require_utf8_mode; require_utf8_mode(); from tools.dev.check import lint_crate_cfg_placement; raise SystemExit(lint_crate_cfg_placement(sys.argv[1:]))'
      # Drop-in version agreement: the capi manifests' header subdirectory
      # and pkg_config version against the pin record. The full
      # installed-tree diff (just packaging check-pc-metadata) needs the
      # pin-built libpinyin, which CI does not have.
      - run: uv run --no-project --managed-python python -X utf8 -m tools.dev.packaging check-pc-version
        if: needs.changes.outputs.reuse != 'true'
      - name: Install tkrzw (vcpkg overlay and binary cache)
        uses: ./.github/actions/tkrzw
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.reuse != 'true'
      # Complexity limit: no function may exceed CCN 40. -w prints only the
      # functions over the limit; the exit status is the same.
      # --break-system-packages: the container is temporary, so there is no
      # system Python to protect. 1.24.0 is the release the limit was
      # checked against.
      - run: apt-get install -y --no-install-recommends python3-pip
        if: needs.changes.outputs.reuse != 'true'
      - run: pip install --break-system-packages lizard==1.24.0
        if: needs.changes.outputs.reuse != 'true'
      - name: Bash floor source lines
        if: needs.changes.outputs.reuse != 'true'
        run: python3 tools/dev/bash_floor.py
      - run: lizard crates/ -l rust -C 40 -w
        if: needs.changes.outputs.reuse != 'true'
      - name: Refresh the main Rust cache using the lane's compile mode
        if: github.event_name == 'push' && needs.changes.outputs.reuse == 'true'
        run: python3 -m tools.dev.ci_tree refresh lint

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true' && (needs.changes.outputs.reuse != 'true' || github.event_name == 'push')
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          rust-cache-key: test-job
          uv: ${{ needs.changes.outputs.reuse != 'true' }}
          just: ${{ needs.changes.outputs.reuse != 'true' }}
          cargo-nextest: ${{ needs.changes.outputs.reuse != 'true' }}
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # The tkrzw action installs the overlay port with vcpkg and
        # points pkg-config at it. The tkrzw cxx bridge compiles with g++;
        # bindgen (libclang) serves the Berkeley DB lanes.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libglib2.0-dev
      # Before the cache refresh, which builds against it.
      - name: Install tkrzw (vcpkg overlay and binary cache)
        uses: ./.github/actions/tkrzw
      # Default-backend rustdoc, warnings denied; the peers' rustdoc runs in
      # store-backends.yml.
      - name: Rustdoc for the default backend
        if: needs.changes.outputs.reuse != 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace
      - name: Provide the pinned system data
        if: needs.changes.outputs.reuse != 'true'
        uses: ./.github/actions/contract-data
      - run: cargo nextest run --locked --profile ci --status-level skip --workspace
        if: needs.changes.outputs.reuse != 'true'
      # nextest does not run doctests; keep the same workspace selection.
      - run: cargo test --locked --doc --workspace
        if: needs.changes.outputs.reuse != 'true'
      - name: C++ pinyin.h smoke gate
        if: needs.changes.outputs.reuse != 'true'
        run: just cpp-smoke
      # The exported-symbol gate: each cdylib exports exactly its pin
      # version script's set and nothing else, in the development build
      # and in the packaged one (--features shipped). The packaged mode is
      # the last step of this job.
      - name: ABI export gate (development build)
        if: needs.changes.outputs.reuse != 'true'
        run: just abi exports
      # The allocator-pairing gate: every pointer the two C ABIs hand a
      # consumer is classified in libpinyin.alloc / libzhuyin.alloc, and a
      # C++ consumer built from those registers releases each one with its
      # declared deallocator under AddressSanitizer/LeakSanitizer. Catches a
      # library-side leak, a borrowed pointer wrongly declared owned, and a
      # new allocating entry point nobody classified. No extra apt package:
      # the g++ installed above already carries libasan/liblsan.
      - name: Allocator-pairing gate
        if: needs.changes.outputs.reuse != 'true'
        run: just abi alloc-pairing
      # The packaged mode runs after every gate that uses the development
      # build. Its build of oxpinyin-capi replaces the development one: the
      # cdylib's two feature sets share files and a fingerprint in
      # target/cells/tkrzw, so a later development-build gate would compile
      # oxpinyin-capi again.
      - name: ABI export gate (shipped build)
        if: needs.changes.outputs.reuse != 'true'
        run: just abi exports --shipped

      - name: Refresh the main Rust cache using the lane's compile mode
        if: github.event_name == 'push' && needs.changes.outputs.reuse == 'true'
        run: python3 -m tools.dev.ci_tree refresh test

  # Supply-chain gate. cargo-deny reads the RustSec database, and deny.toml
  # holds the policy. The bootstrap action installs a released binary, so
  # the job takes less than a minute. The Debian Testing image is unpinned
  # for the reason in the store-backends.yml header.
  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny shells out to `cargo metadata`, so a cargo binary is
      # required; minimal profile suffices (nothing here compiles code).
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          cargo-deny: 'true'
      # The default-feature graph, then the feature-gated graphs, then the
      # fuzz workspace's own graph. --locked holds each to its committed
      # lockfile, so a root change that the fuzz lockfile does not follow
      # fails here.
      - run: cargo deny --locked --log-level error check
      - run: cargo deny --locked --all-features --log-level error check
      - run: cargo deny --locked --log-level error --manifest-path fuzz/Cargo.toml check

  # The Python harness tests of tools/, all of them whenever the gate selects
  # the job. Some of them run cargo metadata, a C compiler or GLib, so the job
  # takes the toolchain and the build packages.
  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          uv: 'true'
          just: 'true'
      - name: Install build dependencies (apt)
        # The real-tool harnesses use gcc and GNU binutils (readelf, nm,
        # objcopy, objdump, ld), Clang and the libclang package for the
        # call-site fixture's major, taskset for the CPU-pinned child, and
        # Valgrind for the end-to-end Linux comparison on the stub library.
        run: |
          llvm_major=$(uv run --no-project --managed-python python tools/audit/glib_call_sites.py --print-llvm-major)
          apt-get install -y --no-install-recommends gcc g++ make cmake pkg-config libclang-dev libglib2.0-dev "clang-${llvm_major}" binutils diffutils "libclang-${llvm_major}-dev" util-linux valgrind
      # just is installed above, so the size build's revision-recipe test must run
      # here rather than skip.
      - run: just test-tools
        env:
          OXPINYIN_REQUIRE_JUST: '1'

  # Stripped shipping-library sizes (constitution section 2). Builds both
  # facades with the release recipe (`just packaging install`) on the
  # reference cell, strips them, checks their exports and writes the
  # base / PR table to the job summary. A failed build, install or export
  # check fails the job; a size increase does not.
  #
  # Base sizes come from a cache keyed by the shipping inputs' tree ids and
  # the toolchain fingerprint (`just packaging sizes key`), written by this
  # job on pushes to main. A hit costs one build, a miss two. A pull request
  # that misses saves its own base result, so its later pushes hit.
  # The pull request side builds the PR head, not the merge ref: the table
  # compares the PR's own change with its base.
  #
  # The job runs whenever `ship` is true, reuse or not: a reused tree proves
  # the tests, not the sizes of this PR against this base.
  shipping-sizes:
    needs: changes
    if: needs.changes.outputs.ship == 'true'
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # Warnings change no byte. The size build adds its own path remapping.
      RUSTFLAGS: ''
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only main saves the dependency cache; pull requests restore it.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          rust-cache-key: shipping-sizes-job
          rust-cache-save-if: ${{ github.event_name == 'push' }}
          uv: 'true'
          just: 'true'
      - run: rustup show active-toolchain
      # cargo-c is the distribution's own package, as in release-packages.yml.
      # The backend packages follow the reference cell (tools/dev/cell.py).
      - name: Install build dependencies (apt)
        run: |
          set -euo pipefail
          backend=$(just packaging sizes apt)
          read -r -a backend_pkgs <<< "$backend"
          apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libglib2.0-dev cargo-c "${backend_pkgs[@]}"
      - name: Compute the base recipe key
        id: key
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            just packaging sizes key --commit "$BASE_SHA"
          else
            just packaging sizes key --commit HEAD
          fi
      - name: Restore the cached sizes
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ship-sizes
          key: ${{ steps.key.outputs.key }}
      - name: Build base and head, report the table
        if: github.event_name == 'pull_request'
        run: >
          just packaging sizes run --base "$BASE_SHA" --base-cache .ship-sizes/sizes.json
          --work "$RUNNER_TEMP/ship-sizes" --target target
      - name: Build main and cache its sizes
        if: github.event_name == 'push' && steps.cached.outputs.cache-hit != 'true'
        run: >
          just packaging sizes build --commit HEAD --out .ship-sizes/sizes.json
          --work "$RUNNER_TEMP/ship-sizes" --target target
      - name: Save the sizes under the recipe key
        if: success() && steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ship-sizes
          key: ${{ steps.key.outputs.key }}

  # The required aggregate checks each job against its flag and `reuse`,
  # and shipping-sizes against `ship` alone. Every applicable job must
  # succeed, and every other job must be skipped. It runs after failures and
  # can be cancelled. The called store-backends workflow must also succeed;
  # its own aggregate checks its backend and sanitizer jobs.
  ci-aggregate:
    needs:
      [changes, lint, test, deny, harness, shipping-sizes, store-backends]
    if: ${{ !cancelled() }}
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -m tools.dev.ci_tree aggregate ci

  # The marker says the aggregate passed: every lane the gate selected
  # succeeded and every other lane was skipped. A later run reads the lanes'
  # own results from this run, and reuses it only when each lane that run
  # selects succeeded here (tools/dev/ci_tree.py). So a lane's success must
  # mean the same checks in every run: no step of a lane may depend on a
  # path flag, only on `reuse`.
  tree-evidence:
    name: tested tree ${{ needs.changes.outputs.tree }}
    needs: [changes, ci-aggregate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'false' && needs.changes.result == 'success' && needs.ci-aggregate.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'Every selected verification lane passed for this checkout tree.'

  reused-tree-evidence:
    name: reused tree ${{ needs.changes.outputs.tree }} from run ${{ needs.changes.outputs.source_run }}
    needs: [changes, ci-aggregate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'true' && needs.ci-aggregate.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'The original PR run was revalidated for this exact tree.'
