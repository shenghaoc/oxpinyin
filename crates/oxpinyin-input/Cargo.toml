[package]
name = "oxpinyin-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[features]
# The pin utilities' boundary (stage 5): their C library calls through
# libc, GLib's option and text calls through glib-sys, and the C++ streams'
# getline through std::io. Tools only.
tools = []

[dependencies]
# Approved for this crate by the 2026-10-31 UTC maintainer rulings: the
# library's path construction through GLib, and the table.conf/user.conf,
# stderr, save and utility calls beside it.
libc.workspace = true
glib-sys.workspace = true
# The existing whole-file private mapping owner, on every platform.
memmap2.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The handle-inheritance witness reads HANDLE_FLAG_INHERIT. Windows only.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
