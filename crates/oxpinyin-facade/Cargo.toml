[package]
name = "oxpinyin-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["/src/**"]
description = "The facade-orchestration layer shared by the pinyin and zhuyin C-ABI facades: instance/context state machines and the laws both facades already implement identically. The Rust interface is unstable."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
oxpinyin-core.workspace = true
oxpinyin-capi-marshal = { path = "../oxpinyin-capi-marshal", version = "=0.1.0-alpha.1" }
oxpinyin-engine.workspace = true
# The boundary predicate for a directory row the chunk loader opens.
oxpinyin-input.workspace = true
# The workspace table carries default-features = false for the
# store-reaching edges; the [features] block below forwards the backend
# selection.
oxpinyin-data.workspace = true
oxpinyin-user.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
oxpinyin-store = { workspace = true, features = ["test-hooks"] }
sha2.workspace = true

[features]
tools = ["oxpinyin-engine/tools", "oxpinyin-input/tools"]
# Backend selection, forwarded to oxpinyin-user, which carries it down
# user -> data -> store (one backend per binary; see
# oxpinyin-store's [features] for the model and precedence). InstanceCore
# holds the runtime's concrete dict/lm handles by value.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-user/kyotocabinet"]
bdb = ["oxpinyin-user/bdb"]
tkrzw = ["oxpinyin-user/tkrzw"]
