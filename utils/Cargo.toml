[package]
name = "oxpinyin-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Libpinyin-compatible utilities for building, training, and inspecting model data."

[lib]
doctest = false

[features]
# The data layer's backend selection, forwarded to every backend-sensitive
# edge the utilities use.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin/kyotocabinet"]
bdb = ["oxpinyin/bdb"]
tkrzw = ["oxpinyin/tkrzw"]

[lints]
workspace = true

[dependencies]
rustc-hash.workspace = true
oxpinyin = { workspace = true, features = ["tools"] }

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
libc.workspace = true
regex.workspace = true
rstest.workspace = true
sha2.workspace = true
tempfile.workspace = true
# Dev-only: the test-only library items the tests read; a dev-dependency
# feature never reaches the normal build.
oxpinyin = { workspace = true, features = ["test-hooks"] }
