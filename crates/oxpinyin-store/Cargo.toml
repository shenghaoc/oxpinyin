[package]
name = "oxpinyin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
redb = { workspace = true, optional = true }

[dev-dependencies]
# Backend micro-benches (benches/); workspace lock pins 0.8.
criterion = "0.8"

[build-dependencies]
bindgen = { workspace = true, optional = true }

[features]
# The five backends (kyotocabinet, redb, lmdb, tkrzw, bdb) are peer
# implementations behind the store's `ReadStore`/`WriteStore` traits.
# **Exactly one** is compiled in per build; a `compile_error!` in
# `src/lib.rs` refuses builds that enable zero or two-or-more. The
# corresponding implementation is the only one compiled, so an
# unselected peer's dependency (redb, bindgen) is not pulled in
# either.
#
# `tkrzw` is the enabled feature in the workspace's default set,
# which is what "default" means here — select any peer explicitly with
# `--no-default-features --features {kyotocabinet|redb|lmdb|tkrzw|bdb}`.
default = ["tkrzw"]
# LMDB binds the SYSTEM liblmdb through its own C header; bindgen is
# build-time only (it needs libclang), exactly as the other C
# backends use it. No LMDB source is vendored or compiled here.
lmdb = ["dep:bindgen"]
tkrzw = ["dep:bindgen"]
# Kyoto Cabinet backend. bindgen is build-time only (it needs libclang);
# the runtime dependency is the system libkyotocabinet the distro already
# ships.
kyotocabinet = ["dep:bindgen"]
# Berkeley DB backend — libpinyin's original DBM and the third drop-in
# set. bindgen is build-time only; the runtime dependency is the system
# libdb 5.3 the distro already ships (Debian libdb-dev, Fedora
# libdb-devel), the same library that wrote the files it must read.
bdb = ["dep:bindgen"]
# redb, the pure-Rust peer. The `redb` crate itself is optional: no other
# peer depends on it, so a KC/LMDB/tkrzw/BDB build carries none of redb's
# code or its transitive dependencies.
redb = ["dep:redb"]
# `bench-internal` — exposes hidden test/bench-only helpers that would
# otherwise be `pub(crate)`. Off by default; not part of `default`, not
# reached by any shipping build. Currently just widens the Kyoto Cabinet
# open path so the `kyotocabinet_bnum` bench (shenghaoc/oxpinyin#402)
# can characterise a KC default; nothing in the shipping open path
# depends on this widening. Never enable this on an artifact that ships.
bench-internal = []

[[bench]]
name = "lmdb_bulk_load"
harness = false
# The bench drives the LMDB C API directly, so `--all-targets` builds of
# the other backends skip this target instead of needing liblmdb.
required-features = ["lmdb"]

[[bench]]
name = "redb_is_empty"
harness = false
# redb is the peer's optional dependency, so `--all-targets` builds of
# the other backends skip this target instead of failing to resolve it.
required-features = ["redb"]

# backend_matrix: one target per backend (b8aff564 convention), all driving
# the same benches/support/mod.rs over the store-tier traits. Exactly one is
# built per `--no-default-features --features <backend>` invocation, matching
# the crate's one-backend-per-binary compile_error! rule.
[[bench]]
name = "backend_matrix_redb"
harness = false
required-features = ["redb"]

[[bench]]
name = "backend_matrix_lmdb"
harness = false
required-features = ["lmdb"]

[[bench]]
name = "backend_matrix_tkrzw"
harness = false
required-features = ["tkrzw"]

[[bench]]
name = "backend_matrix_kyotocabinet"
harness = false
required-features = ["kyotocabinet"]

[[bench]]
name = "backend_matrix_bdb"
harness = false
required-features = ["bdb"]

# Kyoto Cabinet `#bnum` time-and-space measurement (issue #402). Runs
# only under the `bench-internal` feature — the tuning knob it drives is
# reserved for measurements this bench performs, and the shipping open
# path never accepts a non-default value. Linux-only in practice: the
# resident-heap column reads `/proc/self/status` VmHWM.
[[bench]]
name = "kyotocabinet_bnum"
harness = false
required-features = ["kyotocabinet", "bench-internal"]
