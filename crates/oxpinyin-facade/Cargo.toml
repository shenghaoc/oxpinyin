[package]
name = "oxpinyin-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The facade-orchestration layer shared by the pinyin and zhuyin C-ABI facades: instance/context state machines and the laws both facades already implement identically."

[lints]
workspace = true

[dependencies]
oxpinyin-core.workspace = true
oxpinyin-capi-marshal = { path = "../oxpinyin-capi-marshal" }
oxpinyin-engine.workspace = true
# The boundary predicate for a directory row the chunk loader opens.
oxpinyin-input.workspace = true
# The workspace table carries default-features = false for the
# store-reaching edges; the [features] block below forwards the backend
# selection.
oxpinyin-runtime.workspace = true
oxpinyin-user.workspace = true

[dev-dependencies]
rstest = { version = "0.28", default-features = false }
# Fixture directory names: the store's extension, through the data crate
# the dependency chain already carries (the backend features reach it
# through oxpinyin-runtime).
oxpinyin-data.workspace = true
tempfile.workspace = true

[features]
# Backend selection, forwarded to oxpinyin-runtime, which carries it down
# runtime -> user -> data -> store (one backend per binary; see
# oxpinyin-store's [features] for the model and precedence). InstanceCore
# holds the runtime's concrete dict/lm handles by value.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-runtime/kyotocabinet"]
bdb = ["oxpinyin-runtime/bdb"]
tkrzw = ["oxpinyin-runtime/tkrzw"]
