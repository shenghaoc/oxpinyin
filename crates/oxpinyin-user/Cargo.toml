[package]
name = "oxpinyin-user"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
oxpinyin-core = { workspace = true }
# The workspace table carries default-features = false for this edge; the
# [features] block below forwards the backend selection.
oxpinyin-store = { workspace = true }

[features]
# Backend selection, forwarded to oxpinyin-store (one backend per binary;
# see the store's [features] for the model and precedence).
default = ["redb"]
kyotocabinet = ["oxpinyin-store/kyotocabinet"]
lmdb = ["oxpinyin-store/lmdb"]
tkrzw = ["oxpinyin-store/tkrzw"]
redb = ["oxpinyin-store/redb"]

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
redb = { workspace = true }
