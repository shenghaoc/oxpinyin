    # SingleGram chunk arithmetic the C harness mirrors (ASan+UBSan —
    # rustc has no `undefined` sanitizer, so the C half is where UBSan
    # has something to instrument). On a BerkeleyDB distro the system
    # bigram.db is BDB and every session opens it through this FFI, so
    # the lane feeds store-backends-gate like tkrzw-sanitizers does.
