name: 'bootstrap'
description: |-
  Shared post-checkout bootstrap cluster for this repository's
  workflows: the Bash floor check (installing Homebrew Bash on macOS
  first), the checkout registered as a git safe.directory (container
  jobs run as root over a root-owned checkout), an optional
  pinned-rustup install (channel read from rust-toolchain.toml, minimal
  profile), optional CI tools (uv through astral-sh/setup-uv, with the
  managed Python and its build check; just,
  cargo-nextest and cargo-deny through
  taiki-e/install-action at exact versions, restored from the Actions cache
  when the requested tool list and versions match, and cargo-c from its
  upstream macOS release archive), and an optional Swatinem/rust-cache
  restore/save (its post step runs with the composite's completion).

  The actions/checkout step stays inline in every calling job. A local
  `./` action cannot run the checkout that makes it visible: a job
  resolves it only after a checkout exists. Call this right after
  checkout.

  The optional Rust and tool steps default to off, so a bare call only
  installs and checks Bash.
  Composite-action inputs are strings; the switches take 'true'/'false'.

inputs:
  safe-directory:
    description: >-
      Register the checkout as a git safe.directory. Required in the
      container jobs, which run as root over a root-owned checkout.
      String 'true'/'false' (composite-action inputs are strings).
    required: false
    default: 'false'
  rustup:
    description: >-
      Install the pinned Rust toolchain via rustup: channel awk'd from
      rust-toolchain.toml, minimal profile, curl'd from sh.rustup.rs.
      String 'true'/'false' (composite-action inputs are strings).
    required: false
    default: 'false'
  rustup-components:
    description: 'Extra rustup components, space-separated (e.g. "clippy rustfmt").'
    required: false
    default: ''
  uv:
    description: >-
      Install uv with astral-sh/setup-uv, then install and check the managed
      Python that .python-version names. It states no version: the action
      reads required-version from uv.toml and installs the newest uv that
      satisfies it. String 'true'/'false' (composite-action inputs are strings).
    required: false
    default: 'false'
  just:
    description: >-
      Install just with taiki-e/install-action. String 'true'/'false'
      (composite-action inputs are strings).
    required: false
    default: 'false'
  cargo-nextest:
    description: >-
      Install cargo-nextest with taiki-e/install-action. String 'true'/'false'
      (composite-action inputs are strings).
    required: false
    default: 'false'
  cargo-deny:
    description: >-
      Install cargo-deny with taiki-e/install-action. String 'true'/'false'
      (composite-action inputs are strings).
    required: false
    default: 'false'
  cargo-c:
    description: >-
      Install cargo-c from its upstream release archive into a fresh prefix
      and put it on PATH. macOS on ARM64 only; any other runner fails. String
      'true'/'false' (composite-action inputs are strings).
    required: false
    default: 'false'
  rust-cache:
    description: >-
      Run Swatinem/rust-cache as the final bootstrap step. String
      'true'/'false' (composite-action inputs are strings).
    required: false
    default: 'false'
  rust-cache-key:
    description: 'Additional key input for Swatinem/rust-cache.'
    required: false
    default: ''
  rust-cache-save-if:
    description: >-
      Whether this ref may save the Swatinem/rust-cache entry at the end of
      the job. The cache is saved only when this is 'true' and the ref is
      refs/heads/main; every other run restores only. String 'true'/'false'
      (composite-action inputs are strings).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # macOS ships an older Bash. GITHUB_PATH applies to later steps, so the
    # floor check below sees the Homebrew Bash this step selects.
    - name: Install Homebrew Bash on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install bash
        printf '%s\n' "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

    - name: Require the Bash floor
      shell: bash
      run: . tools/lib/bash-floor.sh

    # Container jobs run as root over a root-owned checkout, so any later
    # git invocation would die on dubious ownership (this affected
    # tracked-path probes in local tooling scripts during development).
    - name: Register the checkout as a git safe.directory
      if: inputs.safe-directory == 'true'
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install the pinned Rust toolchain
      if: inputs.rustup == 'true'
      shell: bash
      env:
        # Space-separated component list; empty by default.
        RUSTUP_COMPONENTS: ${{ inputs.rustup-components }}
      run: |
        set -euo pipefail
        channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
        component_args=()
        # Intentional word splitting: the input is a space-separated list.
        # shellcheck disable=SC2086
        for component in $RUSTUP_COMPONENTS; do
          component_args+=(--component "$component")
        done
        curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain "$channel" "${component_args[@]}"
        printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
        # Visible to THIS step too: GITHUB_PATH only applies to later steps.
        . "$HOME/.cargo/env"

    # Pinned to the v10.3.3 tag commit. No version input: setup-uv reads
    # required-version from uv.toml (the repository root) and, with the
    # default highest resolution, installs the newest uv that satisfies it.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      if: inputs.uv == 'true'
      with:
        enable-cache: false

    # The one install and build check for every job that takes uv. The frozen
    # references contain the process name python3.15:, and a free-threaded
    # interpreter must fail here rather than as a behaviour difference later.
    - name: Set up pinned repository Python
      if: inputs.uv == 'true'
      shell: bash
      run: |
        set -euo pipefail
        uv python install
        uv run --no-project --managed-python python -X lazy_imports=normal - <<'PYTHON'
        from pathlib import Path
        import subprocess
        import sys
        import sysconfig
        assert sys.implementation.name == "cpython"
        assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
        assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
        assert sys._is_gil_enabled()
        managed = subprocess.check_output(
            ["uv", "python", "find", "--managed-python"],
            text=True).strip()
        assert Path(sys.executable).resolve() == Path(managed).resolve()
        PYTHON

    # The install-action tools, each written once, here, with an exact version
    # so the cache key below is stable. Bump a version here and the key moves
    # with it. The step also builds the key from the runner OS and architecture
    # plus the exact list of tools this call asks for, and the paths to cache
    # (install-action puts all three in ${CARGO_HOME:-~/.cargo}/bin, and none
    # sets CARGO_HOME here).
    - name: Resolve the install-action tools
      id: tools
      shell: bash
      env:
        JUST: ${{ inputs.just }}
        CARGO_NEXTEST: ${{ inputs.cargo-nextest }}
        CARGO_DENY: ${{ inputs.cargo-deny }}
      run: |
        set -euo pipefail
        wanted=()
        paths=()
        resolve() {
          printf '%s=%s@%s\n' "$1" "$1" "$2" >> "$GITHUB_OUTPUT"
          if [ "$3" = true ]; then
            wanted+=("$1@$2")
            paths+=("~/.cargo/bin/$1" "~/.cargo/bin/$1.exe")
          fi
        }
        resolve just 1.59.0 "$JUST"
        resolve cargo-nextest 0.9.150 "$CARGO_NEXTEST"
        resolve cargo-deny 0.20.2 "$CARGO_DENY"
        if [ "${#wanted[@]}" -eq 0 ]; then
          echo 'any=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo 'any=true'
          printf 'key=install-action-tools-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${wanted[*]}" | tr ' ' '-'
          echo 'paths<<EOF_PATHS'
          printf '%s\n' "${paths[@]}"
          echo 'EOF_PATHS'
        } >> "$GITHUB_OUTPUT"

    # An exact hit restores every requested binary and skips install-action.
    # A miss installs as before and the save step below stores the result.
    - name: Restore the install-action tools
      id: tool-cache
      if: steps.tools.outputs.any == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: ${{ steps.tools.outputs.key }}

    # GITHUB_PATH applies to later steps. install-action does this itself on
    # a miss; a restore only extracts files.
    - name: Put the cached tools on PATH
      if: steps.tool-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        bin="$HOME/.cargo/bin"
        if command -v cygpath >/dev/null; then bin="$(cygpath -w "$bin")"; fi
        printf '%s\n' "$bin" >> "$GITHUB_PATH"

    # install-action pins below: v2.90.0 tag commit. Checksum verification stays
    # on (its default) and fallback is off, so a tool the action cannot install
    # from a release fails the job. The action has no retry or timeout input;
    # its downloads retry inside the script.
    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      if: inputs.just == 'true' && steps.tool-cache.outputs.cache-hit != 'true'
      with:
        tool: ${{ steps.tools.outputs.just }}
        fallback: none

    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      if: inputs.cargo-nextest == 'true' && steps.tool-cache.outputs.cache-hit != 'true'
      with:
        tool: ${{ steps.tools.outputs.cargo-nextest }}
        fallback: none

    - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      if: inputs.cargo-deny == 'true' && steps.tool-cache.outputs.cache-hit != 'true'
      with:
        tool: ${{ steps.tools.outputs.cargo-deny }}
        fallback: none

    # Only main writes the Actions cache; every other ref restores only.
    - name: Save the install-action tools
      if: >-
        steps.tools.outputs.any == 'true'
        && steps.tool-cache.outputs.cache-hit != 'true'
        && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: ${{ steps.tools.outputs.key }}

    # The upstream release archive for macOS, an arm64 build, held to its
    # SHA-256. A source build took seven minutes. The version and the hash
    # move together, by hand. A failed download, another hash, another runner
    # or another version fails the step: nothing falls back to a source
    # build. Any cargo-c at or above the minimum that `just doctor` reports
    # builds the same objects (docs/packaging.md, "Regeneration").
    - name: Install cargo-c
      if: inputs.cargo-c == 'true'
      shell: bash
      env:
        CARGO_C_VERSION: 0.10.25
        CARGO_C_SHA256: 0e73d1841be8a582ab9c37e1049f6a2fa352b3a40b0f97276603f987b19f64e8
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS-$RUNNER_ARCH" != macOS-ARM64 ]; then
          printf '::error::the cargo-c archive is for macOS on ARM64, not %s on %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          exit 1
        fi
        archive="$RUNNER_TEMP/cargo-c-macos.zip"
        curl --fail --location --retry 3 --show-error --output "$archive" \
          "https://github.com/lu-zero/cargo-c/releases/download/v$CARGO_C_VERSION/cargo-c-macos.zip"
        printf '%s  %s\n' "$CARGO_C_SHA256" "$archive" | shasum -a 256 --check
        mkdir -p "$RUNNER_TEMP/cargo-c/bin"
        unzip -q "$archive" -d "$RUNNER_TEMP/cargo-c/bin"
        reported=$("$RUNNER_TEMP/cargo-c/bin/cargo-cinstall" --version)
        printf '%s\n' "$reported"
        case "$reported" in
          "cargo-c $CARGO_C_VERSION"|"cargo-c $CARGO_C_VERSION+"*) ;;
          *) printf '::error::cargo-c reports %s, not %s\n' "$reported" "$CARGO_C_VERSION"; exit 1 ;;
        esac
        printf '%s/cargo-c/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # Pinned to the v2.9.2 tag commit (do not bump without re-verifying).
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.rust-cache == 'true'
      with:
        key: ${{ inputs.rust-cache-key }}
        save-if: ${{ inputs.rust-cache-save-if == 'true' && github.ref == 'refs/heads/main' }}
