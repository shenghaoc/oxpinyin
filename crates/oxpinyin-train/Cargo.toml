[package]
name = "oxpinyin-train"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Native trainer orchestrator reproducing the libpinyin trainer's main workflow (segment → generate → estimate → merge → prune → export → evaluate) end to end in Rust. Never ships."

[lints]
workspace = true

[features]
# Backend selection forwarded through the training-crate chain (one backend
# per binary; see oxpinyin-store's [features] for the model): the segment and
# evaluation stages open `phrase_index.<ext>` in the compiled-in backend's
# format. Tkrzw is the default selection; `--no-default-features
# --features {kyotocabinet|redb|lmdb}` picks a peer. oxpinyin-kmm is backend-agnostic.
default = ["tkrzw"]
kyotocabinet = [
    "oxpinyin-segment/kyotocabinet",
    "oxpinyin-counter/kyotocabinet",
    "oxpinyin-lambda/kyotocabinet",
    "oxpinyin-eval/kyotocabinet",
    "oxpinyin-data/kyotocabinet",
]
tkrzw = [
    "oxpinyin-segment/tkrzw",
    "oxpinyin-counter/tkrzw",
    "oxpinyin-lambda/tkrzw",
    "oxpinyin-eval/tkrzw",
    "oxpinyin-data/tkrzw",
]
lmdb = [
    "oxpinyin-segment/lmdb",
    "oxpinyin-counter/lmdb",
    "oxpinyin-lambda/lmdb",
    "oxpinyin-eval/lmdb",
    "oxpinyin-data/lmdb",
]
redb = [
    "oxpinyin-segment/redb",
    "oxpinyin-counter/redb",
    "oxpinyin-lambda/redb",
    "oxpinyin-eval/redb",
    "oxpinyin-data/redb",
]

[[bin]]
name = "oxpinyin-train"
path = "src/bin/oxpinyin-train.rs"

[dependencies]
oxpinyin-core = { path = "../oxpinyin-core" }
oxpinyin-kmm = { path = "../oxpinyin-kmm" }
# default-features = false so the backend selection reaches the chain from
# this crate's features above, not from each crate's defaults.
oxpinyin-segment = { path = "../oxpinyin-segment", default-features = false }
oxpinyin-counter = { path = "../oxpinyin-counter", default-features = false }
oxpinyin-lambda = { path = "../oxpinyin-lambda", default-features = false }
oxpinyin-eval = { path = "../oxpinyin-eval", default-features = false }
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }

[dev-dependencies]
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
