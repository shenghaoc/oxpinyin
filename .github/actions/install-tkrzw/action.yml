name: Install libtkrzw
description: >
  Build and install the pinned libtkrzw release. oxpinyin-migrate's C++ bridge
  links it through pkg-config, so the Linux workspace jobs need it present.
  Ubuntu ships no tkrzw package, so it is built from the upstream tarball and
  verified against a pinned checksum before anything is compiled.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        version=1.0.32
        sha256=d3404dfac6898632b69780c0f0994c5f6ba962191a61c9b0f4b53ba8bb27731c
        workdir="$(mktemp -d)"
        cd "$workdir"
        curl -fsSL --retry 3 --retry-delay 5 \
          -o tkrzw.tar.gz "https://dbmx.net/tkrzw/pkg/tkrzw-${version}.tar.gz"
        echo "${sha256}  tkrzw.tar.gz" | sha256sum -c -
        tar xzf tkrzw.tar.gz
        cd "tkrzw-${version}"
        # Default configure: no zlib/zstd/lz4/lzma. oxpinyin-migrate's build
        # script links tkrzw and stdc++ only and leaves transitive C libs to
        # libtkrzw.so's NEEDED entries, so the lean build is the right one.
        ./configure
        make -j"$(nproc)"
        sudo make install
        sudo ldconfig
        pkg-config --modversion tkrzw
