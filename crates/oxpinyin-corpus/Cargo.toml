[package]
name = "oxpinyin-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only corpus front-end: zhwiki dump -> raw Han text for oxpinyin-segment. Never ships."

[lints]
workspace = true

[[bin]]
name = "oxpinyin-corpus"
path = "src/bin/oxpinyin-corpus.rs"

[dev-dependencies]
# The corpus end-to-end differential exercises the backend-sensitive stage
# modules through one package. Keep this edge test-only and disable defaults
# so workspace backend selection reaches the same peer as the other crates.
oxpinyin-training = { path = "../oxpinyin-training", default-features = false }
# Dev-only edge: the end-to-end differential shares the pin-harness
# helpers (PinDir, locate_bin, parse_estimate_stdout) with the tool
# suites. No shipping code depends on oxpinyin-testsupport.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
