[package]
name = "oxpinyin-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# The fuzz workspace does not inherit the root workspace's lints (separate
# workspace). deny rather than forbid: the FFI-driving capi-commands target
# and the entry point's TMPDIR setting carry scoped unsafe with SAFETY
# comments.
[lints.rust]
unsafe_code = "deny"

# Every target is an ordinary executable. With the `afl` feature, which
# `just fuzz` selects for its cargo-afl builds, AFL++ runs it in persistent
# mode; without it, it reads one input from standard input. src/lib.rs is
# their shared entry point.
[lib]
name = "oxpinyin_fuzz"
path = "src/lib.rs"
test = false
doc = false

# AFL++ records a signal as a crash, not an exit status: a panic must abort.
[profile.release]
panic = "abort"

# See docs/architecture.md#backend-selection. Each feature forwards to
# the library and the C API crate, so a
# target's user store, data readers and facade all use the selected backend.
# The default follows the library's. `just fuzz` builds the host's cell
# (tools/dev/cell.py). docs/runbooks/verification.md, rule 10.2, states the
# backend of the CI compile check.
[features]
default = ["tkrzw"]
bdb = ["oxpinyin/bdb", "oxpinyin-capi/bdb"]
kyotocabinet = ["oxpinyin/kyotocabinet", "oxpinyin-capi/kyotocabinet"]
tkrzw = ["oxpinyin/tkrzw", "oxpinyin-capi/tkrzw"]
# AFL++ persistent mode and shared-memory input (src/lib.rs). Only a cargo-afl
# build links the AFL++ runtime that the `afl` crate calls, so an ordinary
# build leaves the feature off.
afl = ["dep:afl"]

[dependencies]
oxpinyin = { path = "..", default-features = false }
# dict-loader: hostile bytes through the system chunk loader.
# capi-commands: stateful session fuzzer over the C ABI (libchewing
# fuzzer.rs shape). The facade links natively on macOS with Homebrew GLib
# and Berkeley DB 5.3; the nightly CI soak still runs on Linux.
oxpinyin-capi = { path = "../capi", default-features = false, features = ["test-hooks"] }
tempfile = "3.27"
# The version that fuzz/Cargo.lock resolves is the one cargo-afl version:
# tools/dev/fuzz.py installs and requires that cargo-afl.
afl = { version = "0.18", optional = true }

[[bin]]
name = "dict-loader"
path = "fuzz_targets/dict_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "double-pinyin"
path = "fuzz_targets/double_pinyin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi-commands"
path = "fuzz_targets/capi_commands.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phrase-library"
path = "fuzz_targets/phrase_library.rs"
test = false
doc = false
bench = false

[[bin]]
name = "table-conf"
path = "fuzz_targets/table_conf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chewing-parser"
path = "fuzz_targets/chewing_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "user-store-ops"
path = "fuzz_targets/user_store_ops.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
