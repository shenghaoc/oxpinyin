name: Store backends

# Backend coverage for the four peer store backends on a rolling
# toolchain. The four peers (Kyoto Cabinet, redb, LMDB, tkrzw) are
# equal implementations behind the store's trait surface; tkrzw is the
# workspace's default selection. Exactly one peer is compiled per
# build — the exactly-one-backend invariant is enforced at compile
# time by two `compile_error!` guards in `crates/oxpinyin-store/src/lib.rs`
# — so cross-peer equivalence is proven by running the SAME test
# suite through four separate builds, one per peer.
#
# Four jobs:
#   - store-features is a matrix over the four peer backends. Each child
#     runs the whole workspace test suite under exactly ONE peer, on its
#     own runner, so the four sweeps run in PARALLEL (fail-fast: false,
#     max-parallel: 4) instead of sequentially inside one job. Every pass
#     decodes real queries through the fixture tables, not just the store's
#     own unit tests. The matrix value only selects one of four fixed,
#     repository-controlled cargo invocations (see the case in the test
#     step); no command is built from untrusted event input.
#   - backend-matrix is an INDEPENDENT job — it has no needs edge to the
#     matrix, so it schedules concurrently with all four backend children.
#     It runs `tools/store/backend-matrix.sh`, which proves the four valid
#     peer selections each `cargo check --workspace` cleanly AND that
#     every one of the six pairwise plus one three-way combinations plus
#     the zero-backend build is refused by the exactly-one-backend
#     `compile_error!` guards. This is what replaced the old
#     "cross-backend conformance in one binary" job, which is
#     architecturally impossible under exactly-one-backend.
#   - store-backends-gate is the stable aggregate status check. It runs no
#     tests; it only fails unless every backend child AND the
#     backend-matrix job succeeded, so branch protection can keep requiring
#     the historical "store backends (kyotocabinet / redb / tkrzw / lmdb)"
#     context.
#   - tkrzw-sanitizers runs the tkrzw feature's suite under ASan and UBSan.
#
# ROLLING TOOLCHAIN, deliberately unpinned: the jobs run inside
# debian:testing because oxpinyin aims to be a viable libpinyin
# replacement, and building on the newest toolchain distros actually ship
# is a property under test, not an accident — libpinyin's own
# make-check.yml does the same. Debian Testing is the mother distro of
# one of the two major Linux ecosystems (Ubuntu and derivatives descend
# from it); RHEL, the other ecosystem's root, is the primary development
# platform, so CI on Debian Testing covers both lineages. Do NOT pin
# this image by digest or let a later change "stabilise" it. libtkrzw
# comes from libtkrzw-dev: part of the rolling build environment,
# recorded by the provenance step below.
#
# The pin-built oracle and the model20 archive are deliberately NOT CI
# concerns: provisioning them (tools/model/fetch-model.sh,
# tools/oracle/build-oracle.sh) is a LOCAL workflow, and no CI job may
# download model20.text.tar.gz or anything like it. The oracle-gated
# differentials and the model cache live on developer machines only.

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/store-backends.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/store-backends.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: store-backends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-features:
    # One matrix child per backend, each on its own runner: every backend is
    # exercised through the whole workspace — a backend that "passes" only in
    # the store's own unit tests and never reaches the decode path does not
    # count. The alternate-backend children name the store's feature with
    # member/feature syntax because the root manifest is virtual. The four
    # children run in parallel; the historical single-job serialisation of
    # these sweeps is gone.
    name: store backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    strategy:
      # fail-fast: false so one backend's failure does not cancel the other
      # three children — every backend's result is reported independently.
      fail-fast: false
      max-parallel: 4
      matrix:
        backend:
          - kyotocabinet
          - redb
          - tkrzw
          - lmdb

    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bootstrap cluster (safe.directory, pinned toolchain, cache
      # restore) in one call right after the inline checkout; the
      # clippy/rustfmt components preserve the toolchain shape this job
      # always installed. Each backend child
      # gets a distinct cache identity via the extra key; without it the
      # four feature configurations would contend one automatic key. Each
      # runner has its own isolated checkout and target dir — no shared
      # writable target across the matrix.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: store-backend-${{ matrix.backend }}

      - name: Install build dependencies (apt)
        # Every matrix child installs the full set so each lane is
        # self-contained regardless of scheduling order; the marginal apt
        # cost is deliberate (correctness over shaving install seconds).
        # libtkrzw-dev: the tkrzw child builds the C++ shim against the distro
        # library through pkg-config; the redb/lmdb children are pure Rust.
        # libclang-dev: bindgen's runtime dependency for generating tkrzw FFI
        # bindings from tkrzw_langc.h.
        # Debian's libtkrzw-dev builds tkrzw with compression, so tkrzw.pc
        # demands -llzma -llz4 -lzstd -lz at link time; their -dev packages
        # must be present or every final link dies.
        # libkyotocabinet-dev: the explicit kyotocabinet child links the
        # distro Kyoto Cabinet; bindgen reads kclangc.h at build time.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libkyotocabinet-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev

      # This child runs exactly one of four fixed cargo invocations, selected
      # by the matrix backend through a case over a closed set (fail-closed
      # default). The matrix value is bound to a plain shell variable via env
      # indirection — ${{ }} inside a run: body is a template-injection
      # surface — and never spliced into a command.
      - name: Test the workspace under this backend
        id: backend-test
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          case "$BACKEND" in
          # `--features <peer>` at `--workspace` scope enables that
          # feature on every workspace member that declares it, so the
          # peer selection cascades through each consumer's own
          # `<peer> = ["oxpinyin-store/<peer>", ...]` forwarder. A
          # bare passthrough (`--features oxpinyin-store/<peer>`) does
          # NOT — cargo features do not back-propagate — and would
          # leave each consumer's own `#[cfg(feature = "<peer>")]`
          # code (e.g. `user_store_tests!(redb, ...)` in
          # oxpinyin-user, the `Backend::Redb::write()` arm in
          # oxpinyin-datagen) skipped even while `DefaultStore`
          # resolves to the peer. The bare-name form here is the
          # documented public interface — see
          # `docs/findings/backend-selection-audit.md`. The
          # exactly-one-backend invariant is unchanged; the
          # `backend-matrix` job proves it separately.
          kyotocabinet)
            echo "--- kyotocabinet (explicit) ---"
            cargo test --locked --workspace --no-default-features --features kyotocabinet
            ;;
          redb)
            echo "--- redb (workspace, pure-Rust peer) ---"
            cargo test --locked --workspace --no-default-features --features redb
            ;;
          tkrzw)
            echo "--- tkrzw (the default) ---"
            cargo test --locked --workspace
            ;;
          lmdb)
            echo "--- lmdb (workspace) ---"
            cargo test --locked --workspace --no-default-features --features lmdb
            ;;
          *)
            echo "FAIL: unknown matrix.backend value '$BACKEND'" >&2
            exit 2
            ;;
          esac
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## store backend (${BACKEND})"
            echo ""
            echo "Result: **$([ '${{ job.status }}' = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "Whole-workspace sweep under the ${BACKEND} backend only."
            echo ""
            echo "| Backend | Wall clock |"
            echo "|---|---:|"
            echo "| ${BACKEND} | ${{ steps.backend-test.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-matrix:
    # Replaces the historical `store-conformance` job. Under
    # exactly-one-backend the "one binary with three backends compiled
    # in" build is architecturally impossible (a `compile_error!` in
    # `crates/oxpinyin-store/src/lib.rs` refuses it), so the same
    # `tools/store/backend-matrix.sh` script that developers run locally
    # runs here instead: it proves the four valid peer selections each
    # `cargo check --workspace` cleanly AND that every one of the six
    # pairwise combinations, a three-way combination, and the
    # zero-backend build are refused by the guards.
    #
    # Independent job: no needs edge to store-features, so it runs
    # concurrently with the four backend children.
    name: backend-matrix (exactly-one-backend gate)
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same bootstrap cluster as the matrix children; the distinct cache
      # key separates the exactly-one-backend matrix from every backend
      # child's identity.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: backend-matrix

      - name: Install build dependencies (apt)
        # The matrix `cargo check`s the four valid peer selections in
        # turn, so it needs every peer's build-time C dependencies:
        # libkyotocabinet-dev + libtkrzw-dev (+ its compression -dev
        # packages) and libclang-dev for bindgen; lmdb rides on heed and
        # is pure Rust; redb is pure Rust. libglib2.0-dev is a Tier-C
        # requirement: `pinyin_lookup_tokens` /
        # `pinyin_token_get_nth_pronunciation` delegate to
        # `g_array_append_vals` / `g_array_set_size`, so the shipped
        # `.so` NEEDS `libglib-2.0`.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libkyotocabinet-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev

      - name: Exactly-one-backend invariant (13-case matrix)
        id: matrix-test
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          tools/store/backend-matrix.sh
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## backend-matrix (exactly-one-backend gate)"
            echo ""
            echo "Result: **$([ '${{ job.status }}' = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "\`tools/store/backend-matrix.sh\` — proves the four valid"
            echo "peer selections each \`cargo check --workspace\` cleanly and"
            echo "that every multi-peer combination plus the zero-backend"
            echo "build is refused by the exactly-one-backend guards."
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| 13-case matrix | ${{ steps.matrix-test.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  store-backends-gate:
    # Stable aggregate status check. Preserves the historical job
    # display name so branch-protection required-status-check contexts
    # keep resolving after the store-features job became a matrix and
    # after `store-conformance` was replaced by `backend-matrix`. It
    # builds and tests nothing; it only aggregates the results of the
    # four backend children and the backend-matrix job via the
    # documented `needs.<job>.result` semantics. For a matrix upstream,
    # that result is success only when EVERY matrix child succeeded, and
    # failure if any child failed — so this gate is red unless all four
    # peer builds and the exactly-one-backend gate are green.
    name: store backends (kyotocabinet / redb / tkrzw / lmdb)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - store-features
      - backend-matrix
    defaults:
      run:
        shell: bash
    steps:
      - name: Aggregate the backend and matrix results
        # Job results are bound through env rather than spliced into the
        # script body; the values are the closed set
        # success/failure/cancelled/skipped.
        env:
          FEATURES_RESULT: ${{ needs.store-features.result }}
          MATRIX_RESULT: ${{ needs.backend-matrix.result }}
        run: |
          set -euo pipefail
          echo "store-features (matrix): ${FEATURES_RESULT}"
          echo "backend-matrix:          ${MATRIX_RESULT}"
          {
            echo "## store backends (aggregate gate)"
            echo ""
            echo "This job runs no tests. It is the stable aggregate status"
            echo "check that fails unless every peer matrix child AND the"
            echo "exactly-one-backend gate succeeded."
            echo ""
            echo "| Upstream job | Result |"
            echo "|---|---|"
            echo "| store-features (matrix, all four peers) | ${FEATURES_RESULT} |"
            echo "| backend-matrix (exactly-one-backend gate) | ${MATRIX_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${FEATURES_RESULT}" != "success" ] || [ "${MATRIX_RESULT}" != "success" ]; then
            echo "::error::store-backends gate failed: store-features=${FEATURES_RESULT}, backend-matrix=${MATRIX_RESULT}" >&2
            exit 1
          fi
          echo "store-backends gate: all upstream jobs succeeded"

  tkrzw-sanitizers:
    # The shim passes Rust callbacks into tkrzw's visitor dispatch
    # (db_get/db_scan install Process-full visitors handing borrowed key/value
    # records to Rust fn pointers valid only for the callback). Panic-unwinding
    # across that boundary and borrow-escape of those records are the live
    # hazards, so the feature's own test surface runs instrumented: once per
    # sanitizer, any finding kills the job. See the test step for how each arm
    # composes its flags (the mandated -fsanitize=address,undefined pair does
    # not map 1:1 onto rustc's -Zsanitizer list).
    name: tkrzw shim under ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires syscall leeway no other job here needs: Docker's
      # default seccomp profile blocks personality(2), which turned setarch's
      # ASLR-off ASan wrapper into EPERM on the previous run. Unconfining
      # seccomp for THIS matrix alone restores standard sanitizer setups;
      # everything else stays under stock confinement.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    # Non-blocking by policy: this job is excluded from the store-backends
    # aggregate gate (which needs only store-features and
    # store-conformance), so its red X protected nothing — a finding only
    # failed the run as a whole. continue-on-error keeps the run green
    # while the Report step still prints the findings summary (it keys off
    # the test step's outcome: job.status reads 'success' under this flag).
    continue-on-error: true

    strategy:
      fail-fast: true
      matrix:
        sanitizer: [address, undefined]
    env:
      # Beats rust-toolchain.toml's channel pin for this job only: sanitizer
      # builds require nightly rustc. Everything else keeps the pinned file.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same root-owned-checkout caveat as the store-features job. The
      # nightly toolchain below stays bespoke (sanitizer builds need
      # nightly, not the pinned channel), and rust-cache stays off on
      # purpose — see the note above the test step.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'

      - name: Install build dependencies (apt)
        # On Debian, libasan and libubsan ship with gcc and are not separate
        # packages. libtkrzw-dev provides the distro library the shim
        # compiles against; libclang-dev is bindgen's runtime dependency.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          # Visible to THIS step too: GITHUB_PATH only applies to later steps.
          . "$HOME/.cargo/env"
          rustc --version

      # No rust-cache here on purpose: the four-crate shim suite compiles in
      # seconds; a separate sanitizer-flavored cache entry would be pure book-
      # keeping. (Rust-cache hashes RUSTFLAGS into its key anyway, so even a
      # future enablement cannot cross-contaminate the unsanitized dep store.)
      #
      # Both arms implement the mandated -fsanitize=address,undefined pair
      # against the surface where those hazards actually live: the memory-
      # unsafe C++ shim plus the linked runtime. Each arm instruments the shim
      # translation units (clang-style flags through the cc crate) and injects
      # its runtime at cargo's final link (-C linker=cc -Clink-arg=...); any
      # finding traps hard and fails the job — the STOP contract.
      #
      # ADDRESS instruments the whole target graph (-Zsanitizer=address;
      # rustc manages the runtime, so ordering and abort semantics are its
      # problem, not ours) and the shim gets GCC instrumentation on top via
      # CFLAGS/CXXFLAGS. UNDEFINED has no -Zsanitizer equivalent (rustc's
      # option list has never included the value), so it instruments the shim
      # translation units — the memory-unsafe boundary — and injects libubsan
      # at cargo's final link. Any finding traps and fails the job.
      #
      # Both arms build the workspace default backend (tkrzw), so the
      # instrumented binary is pure tkrzw — exactly the surface whose
      # instrumentation exists to catch tkrzw-shim misuse.
      #
      # Both arms pass an EXPLICIT --target on purpose: without it, cargo
      # applies RUSTFLAGS to HOST build scripts and proc macros too, which is
      # how -Zsanitizer=address produced unloadable proc-macro dylibs (E0463
      # on cxxbridge_macro) and how link-arg flags broke build scripts in
      # earlier iterations of this step. With --target, host artifacts
      # compile clean and only the target graph is sanitized. The PREBUILT
      # STANDARD LIBRARY stays uninstrumented in both arms: -Zbuild-std +
      # rust-src is a heavier matrix than this job warrants; recorded here
      # and in docs/findings/upstream-divergences.md.
      - name: Run the tkrzw feature tests under the sanitizer
        id: sanitize-tests
        env:
          # Indirection on purpose: ${{ }} inside run: bodies is a template-
          # injection surface; an env binding gives bash a plain variable.
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          triple=$(rustc -vV | sed -n 's/^host: //p')
          case "$SANITIZER" in
          address)
            export RUSTFLAGS="-D warnings -Zsanitizer=address -Cdebuginfo=1"
            export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
            export CXXFLAGS="$CFLAGS"
            # LeakSanitizer is tuned off by documented choice, not laziness:
            # the Rust harness holds deliberate process-lifetime allocations
            # whose ownership crosses the cxx boundary, which LSan
            # misclassifies, and the hazards under test are misuse of BORROWED
            # records and unwinding, both of which stay fatal.
            # abort_on_error=1 closes the last loophole where a report could
            # print yet the step still go green. setarch -R disables ASLR for
            # the process tree: GitHub runner kernels' mmap entropy exceeds
            # what ASan's shadow mapping assumes, and an unprivileged
            # container cannot lower vm.mmap_rnd_bits itself.
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
            setarch "$(uname -m)" -R \
              cargo test --locked --target "$triple" -p oxpinyin-store
            ;;
          undefined)
            # No -Zsanitizer=undefined exists; instrument the shim and link
            # the runtime explicitly (nightly's default linker does not add
            # it from a bare -fsanitize).
            export RUSTFLAGS="-D warnings -C linker=cc -Clink-arg=-fsanitize=undefined -Clink-arg=-lubsan"
            export CFLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
            export CXXFLAGS="$CFLAGS"
            cargo test --locked --target "$triple" -p oxpinyin-store
            ;;
          *)
            echo "FAIL: unknown matrix.sanitizer value '$SANITIZER'" >&2
            exit 2
            ;;
          esac
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## tkrzw-sanitizers (${{ matrix.sanitizer }})"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"
