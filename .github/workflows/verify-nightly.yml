name: verify-nightly

# Scheduled verification: the checks too slow for the PR gate. The merge
# conditions are docs/runbooks/verification.md, section 10. Findings here
# open issues. Nothing here blocks a merge, because branch protection
# requires only ci.yml's `ci-aggregate`.
#
# Jobs: fuzz-soak, overflow-lane, test-windows and test-macos.
# No job may fail: there are no continue-on-error jobs.
#
# Every Linux job runs natively on the runner (docs/runbooks/verification.md,
# section 10); test-windows runs on windows-2025 and test-macos on macos-26.
# The oracle is never built or run on GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the full Windows workspace job
        type: boolean
        default: false
      macos_only:
        description: Run only the macOS workspace job
        type: boolean
        default: false
      tools_harness:
        description: Also run the tools Python harness on Windows and macOS
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One group per ref: the schedule always runs on main, so scheduled runs
# still queue behind each other, and a dispatch on a branch does not
# displace them.
concurrency:
  group: verify-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-soak:
    # Skipped by a windows_only or macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only && !inputs.macos_only }}
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). Pinned, not ubuntu-latest, so a runner-image
    # move (26.04: actions/runner-images#14748) happens here under review.
    runs-on: &ubuntu ubuntu-26.04
    # The "Minimize restored corpora" step has 30 min. The "Soak each target"
    # step has 60: the target builds take
    # up to 5 min, and each of the 7 targets runs under a FUZZ_GUARD_SECONDS
    # (420 s) limit plus 30 s for the kill, 52.5 min in all. The guard holds
    # FUZZ_SECONDS (180 s) of fuzzing and 240 s for afl-fuzz's start-up run,
    # which calibrates every corpus input before the -V clock starts. The job
    # has 25 more, for
    # the steps before the soak (up to 15 min: LLVM, cargo-afl and the AFL++
    # build) and the upload and cache save after it. The step limit is lower
    # than the job limit, so an overrun fails the step and the crash upload
    # still runs. Add 8 to both numbers for each new target.
    timeout-minutes: 115
    defaults:
      run:
        shell: bash
    env:
      FUZZ_SECONDS: 180
      FUZZ_GUARD_SECONDS: 420
      AFL_NO_UI: 1
    steps:
      # tools/dev/fuzz.py builds each target with the host's cell: Kyoto
      # Cabinet on Linux (tools/dev/cell.py), whose cxx bridge compiles with
      # the image's g++: libkyotocabinet-dev from apt, no libclang.
      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libc6-dev libkyotocabinet-dev libglib2.0-dev util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          # The fuzz recipes run on the managed CPython.
          uv: 'true'
          # The fuzz recipes (just fuzz-setup, just fuzz).
          just: 'true'
          # One nightly toolchain serves cargo-afl, its builds and the runs.
          # fuzz/rust-toolchain.toml names it, with rust-src. rustup reads that
          # file for a command run in fuzz/, so the fuzz recipes run there and
          # no step names the nightly.
          rust-toolchain: 'true'
          rust-toolchain-dir: fuzz
      # The AFL++ LLVM plugins load into the nightly's rustc, so they build
      # against an LLVM of the same major version (llvm-config-<major>).
      # Ubuntu's own archive carries it: fuzz/rust-toolchain.toml pins a
      # nightly on LLVM 22. Without clang, AFL++ compiles the plugins with
      # the system c++.
      - name: Install the LLVM of the fuzz nightly (apt)
        working-directory: fuzz
        run: |
          major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          sudo apt-get install -y --no-install-recommends "llvm-$major-dev"
          "llvm-config-$major" --version
      # afl-fuzz refuses a core_pattern that pipes crashes to a handler
      # (apport on the runner), which delays crash reports past its waitpid.
      - name: Let crashes reach afl-fuzz directly
        run: echo core | sudo tee /proc/sys/kernel/core_pattern
      # cargo-afl at the version of fuzz/tool-versions.env and the AFL++ it
      # bundles, with the LLVM plugins.
      - run: just fuzz-setup
      # Fuzzing memory, half one: the corpora persist across nightly runs
      # (latest-wins — the run-id key always misses so every run saves,
      # the prefix restore-key always loads the newest save), so a soak
      # starts where the last one ended instead of from the single
      # committed seed. Minimize the restore before re-copying the fixtures.
      - name: Restore the accumulated fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Minimize restored corpora
        # Each target uses the same ASan build and input timeout as the soak.
        # A cmin seed issue fails the step and stays in seed-issues/ for upload;
        # the original corpus is not replaced. Run every target even on failure.
        timeout-minutes: 30
        working-directory: fuzz
        run: just fuzz-minimize
      - name: Seed corpora
        # The five MemoryChunk files of the Kyoto Cabinet cell (byte-identical
        # across the cells, fixtures/w3/README.md) and the committed
        # capi-commands command streams, named one by one: a seed that
        # goes missing fails the step rather than silently shrinking the
        # corpus.
        run: |
          seeds=(
            fixtures/w3/kct/gb_char.bin
            fixtures/w3/kct/gbk_char.bin
            fixtures/w3/kct/opengram.bin
            fixtures/w3/kct/merged.bin
            fixtures/w3/kct/art.bin
          )
          capi_seeds=(
            fuzz/seeds/capi-commands/choose
            fuzz/seeds/capi-commands/double-pinyin
            fuzz/seeds/capi-commands/first-run
            fuzz/seeds/capi-commands/import-export
            fuzz/seeds/capi-commands/stale-sentence
          )
          status=0
          for seed in "${seeds[@]}" "${capi_seeds[@]}"; do
            if [ ! -f "$seed" ]; then
              echo "::error::missing seed $seed"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit "$status"
          mkdir -p fuzz/corpus/dict-loader
          cp "${seeds[@]}" fuzz/corpus/dict-loader/
          # dict-loader reads whole files. A mutation longer than its input
          # limit is cut, and the chunk length check then refuses the file
          # before any decoding. The soak step gives this target alone a
          # limit (afl-fuzz -G) that admits its largest seed.
          largest=0
          for seed in "${seeds[@]}"; do
            size=$(($(wc -c < "$seed")))
            if [ "$size" -gt "$largest" ]; then
              largest=$size
            fi
          done
          echo "DICT_LOADER_MAX_LEN=$largest" >> "$GITHUB_ENV"
          # phrase-library writes its own chunk header in front of the input,
          # so its seed is a payload: art.bin, which holds four items, without
          # its 8-byte header.
          mkdir -p fuzz/corpus/phrase-library
          tail -c +9 fixtures/w3/kct/art.bin > fuzz/corpus/phrase-library/art.payload
          # capi-commands: one stream per operation that no mutation of an
          # empty corpus reaches soon (fuzz/fuzz_targets/capi_commands.rs
          # gives the byte layout). just fuzz also copies fuzz/seeds/<target>;
          # naming them here fails the step when one goes missing.
          mkdir -p fuzz/corpus/capi-commands
          cp "${capi_seeds[@]}" fuzz/corpus/capi-commands/
          # table-conf: libc scans the header, so no coverage feedback leads a
          # mutation to a valid one. A real file starts the target past it.
          mkdir -p fuzz/corpus/table-conf
          cp fixtures/w3/kct/table.conf fuzz/corpus/table-conf/
      - name: Soak each target
        # Every target runs even if an earlier one fails; the accumulated
        # status is the step's exit code. just fuzz builds the target with
        # the AFL++ LLVM plugins (CmpLog off), prints the instrumentation and
        # LSAN_OPTIONS, runs afl-fuzz for FUZZ_SECONDS of fuzzing under the
        # FUZZ_GUARD_SECONDS limit, prints afl-fuzz's statistics, and fails
        # when afl-fuzz fails, stops on a seed issue, ran no input or saved a
        # crash or a hang. New queue entries join fuzz/corpus, which the cache
        # saves. actions/cache saves only when the job passes (post-if:
        # success()), so an input that stops cmin or afl-fuzz as a seed issue
        # comes back the next night and fails again until the code is fixed.
        # Lower than the job limit: an overrun fails this step, so the
        # crash upload below still runs. The job's comment gives both numbers.
        timeout-minutes: 60
        # In fuzz/, rustup selects the fuzz nightly, the one toolchain here.
        working-directory: fuzz
        run: |
          mapfile -t targets < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind == ["bin"]) | .name')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::fuzz/Cargo.toml lists no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # The Seed step computed dict-loader's input limit from its seeds.
            max_len=4096
            if [ "$target" = dict-loader ]; then
              max_len=$DICT_LOADER_MAX_LEN
            fi
            if ! just fuzz "$target" -V "$FUZZ_SECONDS" -G "$max_len"; then
              status=1
              echo "::error::fuzz target $target failed"
            fi
            echo "::endgroup::"
          done
          exit $status
      # Fuzzing memory, half two: a crash survives the runner as an
      # artifact, not as a log line that dies with the job. just fuzz gives
      # each run its own directory, fuzz/out/<target>/<run>/: afl-fuzz writes
      # crashing and hanging inputs under default/, and the recipe keeps a
      # seed that crashes or times out in seed-issues/ and afl-fuzz's output
      # in afl-fuzz.log.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: |
            fuzz/out/*/*/default/crashes/
            fuzz/out/*/*/default/hangs/
            fuzz/out/*/*/default/fuzzer_stats
            fuzz/out/*/*/seed-issues/
            fuzz/out/*/*/afl-cmin.log
            fuzz/out/*/*/afl-fuzz.log

  # Latent-overflow lane: the release-optimized codepath with overflow
  # checks and debug assertions forced on — the "NDEBUG question" as CI,
  # not as shipped configuration.
  overflow-lane:
    # Skipped by a windows_only or macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only && !inputs.macos_only }}
    runs-on: *ubuntu
    # Twice a cold release build, which takes about 20 min with no Rust cache; the tests take seconds.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C overflow-checks=y -C debug-assertions=y -D warnings
    steps:
      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libc6-dev libkyotocabinet-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          cargo-nextest: 'true'
      - run: cargo nextest run --locked --profile ci --status-level skip --workspace --release --no-default-features --features kyotocabinet

  # The full Windows workspace: clippy and the tests over the workspace,
  # built with MSVC, GLib and pkgconf from vcpkg and the repository's static
  # tkrzw (tools/tkrzw/windows.py). It runs every night and on
  # manual dispatch; section 10 makes it best-effort and never a PR merge
  # condition (docs/runbooks/verification.md). Not skipped by windows_only;
  # skipped by macos_only.
  test-windows:
    # Skipped by a macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.macos_only }}
    runs-on: windows-2025
    timeout-minutes: 45
    # windows-2025 defaults every `run:` to pwsh; every step here is bash
    # (`"$VCPKG_PACKAGES"`), which pwsh would not expand.
    defaults:
      run:
        shell: bash
    # ci.yml set these at workflow level; this workflow sets none.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      # The package specs (port[features]:triplet) passed to `vcpkg install`,
      # space-separated. The binary cache key hashes this value, so adding a
      # port or feature here gives the cache a new key.
      VCPKG_PACKAGES: glib:x64-windows pkgconf:x64-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          cargo-nextest: 'true'
          uv: 'true'
          just: 'true'
      - run: rustup show active-toolchain
      # vcpkg's binary cache, persisted across runs. vcpkg writes one zip per
      # built package, named by the package's ABI hash, to the files provider
      # below, and `vcpkg install` still runs every time: it computes each
      # ABI hash itself (port files, triplet, compiler, dependencies) and
      # restores only an archive whose hash matches, so a stale entry is
      # never used, only rebuilt. The installed tree is not cached.
      #
      # tools/dev/vcpkg.py holds the key, install and report steps; only the
      # cache actions stay here. The vcpkg revision is the runner image's own
      # checkout, read once in the key step. The cache key changes whenever an input to the
      # ABI hashes can: that revision (ports and baseline), the triplet, the
      # runner image (compiler and SDK) and the requested package specs
      # (VCPKG_PACKAGES). This job installs no repository port, so no
      # overlay or triplet file is hashed. The restore-keys fall
      # back to the newest entry for the same revision and image, then for
      # the same image OS and triplet; vcpkg's own hash check decides what in
      # it is reusable.
      #
      # Restore and save are separate steps. The save runs right after
      # `vcpkg install`, before the build and tests, so a red test run still
      # keeps the archives it built. It runs only on main and is skipped when
      # the restore matched the primary key exactly, because that entry
      # already exists. A branch dispatch restores main's entry through the
      # restore keys and writes nothing. The restore comes before the dependency
      # action, so its pkgconf install reads the cache too.
      - name: Compute the vcpkg binary cache key
        id: vcpkg-cache-key
        run: uv run --managed-python python -X utf8 -m tools.dev.vcpkg cache-key --triplet x64-windows --packages "$VCPKG_PACKAGES"
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-key.outputs.key }}-pkgs-${{ steps.vcpkg-cache-key.outputs.packages }}
          restore-keys: |
            ${{ steps.vcpkg-cache-key.outputs.key }}-
            ${{ steps.vcpkg-cache-key.outputs.prefix }}
      - name: Report the vcpkg binary cache restore
        env:
          REQUESTED_KEY: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.vcpkg-cache-restore.outputs.cache-matched-key }}
        run: uv run --managed-python python -X utf8 -m tools.dev.vcpkg cache-report
      - name: Install GLib and pkgconf (vcpkg)
        run: uv run --managed-python python -X utf8 -m tools.dev.vcpkg install --triplet x64-windows --packages "$VCPKG_PACKAGES"
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}
      # Nothing packages tkrzw for Windows. The repository builds the pinned
      # revision (tools/tkrzw/pin.json) as a static library with
      # upstream's VCMakefile through nmake and the DLL C runtime, and puts
      # its pkg-config directory first on PKG_CONFIG_PATH. The archive is
      # linked into every binary, so nothing of it goes on PATH. The build is
      # one serial nmake run of the library target, so it is not cached.
      - name: Build tkrzw (static)
        run: just tkrzw --prefix "$RUNNER_TEMP/tkrzw" --github-env
      # The default backend, over the whole workspace. Clippy runs first, so
      # a lint in Windows-only code fails here rather than nowhere.
      - name: Clippy (Windows)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Provide the pinned system data
        uses: ./.github/actions/contract-data
      - run: cargo nextest run --locked --profile ci --status-level skip --workspace
      # The tools Python harness, on a dispatch that asks for it: a tooling
      # change that can behave differently on Windows, and before a release
      # (docs/runbooks/verification.md, section 10). The schedule does not
      # run it.
      - name: Run tools Python harness tests
        if: ${{ inputs.tools_harness }}
        run: just test-tools

  # macOS links Homebrew's tkrzw. The full workspace runs here;
  # shipped macOS libraries are also built and checked separately. The tools
  # Python harness runs after the Rust steps on a dispatch that asks for it.
  #
  # Platforms other than Linux are unstable but usable, so the job runs every
  # night and on manual dispatch; section 10 makes it best-effort and never a
  # PR merge condition (docs/runbooks/verification.md). Not skipped by
  # macos_only.
  test-macos:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: macos-26
    timeout-minutes: 45
    # ci.yml set these at workflow level; this workflow sets none.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-toolchain: 'true'
          rust-cache: 'true'
          uv: 'true'
          just: 'true'
          cargo-nextest: 'true'
          cargo-c: 'true'
      - run: rustup show active-toolchain
      # The runner image already provides GLib and pkgconf from Homebrew.
      # Homebrew installs tkrzw's compression dependencies with the formula.
      - name: Install tkrzw (Homebrew)
        run: |
          brew install tkrzw
          pkg-config --modversion tkrzw liblz4 libzstd
      - name: Check shipped macOS library exports
        run: |
          stage="$RUNNER_TEMP/macos-shipped"
          just packaging install libpinyin --prefix=/usr/local --destdir="$stage" -- --release --locked
          just packaging install libzhuyin --prefix=/usr/local --destdir="$stage" -- --release --locked
          OXPINYIN_CAPI_SO="$stage/usr/local/lib/libpinyin.15.0.0.dylib" \
          OXPINYIN_ZHUYIN_SO="$stage/usr/local/lib/libzhuyin.15.0.0.dylib" \
            just abi exports
      # Clippy over the lane's own feature set, so a lint in
      # macOS-only code fails here rather than nowhere.
      - name: Clippy (macOS)
        run: >
          cargo clippy --locked --workspace --all-targets
          -- -D warnings
      - name: Provide the pinned system data
        uses: ./.github/actions/contract-data
      - run: >
          cargo nextest run --locked --profile ci --status-level skip --workspace
      - name: Run tools Python harness tests
        if: ${{ inputs.tools_harness }}
        shell: bash
        run: just test-tools
