[package]
name = "oxpinyin-segment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only Han segmenter reproducing libpinyin ngseg. Never ships."

[lints]
workspace = true

[features]
# Backend selection, forwarded to oxpinyin-data (one backend per binary;
# see oxpinyin-store's [features] for the model). The segmenter and the
# training tools built on it name export tables (`phrase_index.<ext>` &
# co.) in the compiled-in backend's format, so a standalone
# `cargo run -p oxpinyin-segment` must select the same peer backend the
# export was produced with — Kyoto Cabinet is the default selection;
# `--no-default-features --features {redb|lmdb|tkrzw}` picks a peer.
default = ["kyotocabinet"]
kyotocabinet = ["oxpinyin-data/kyotocabinet"]
tkrzw = ["oxpinyin-data/tkrzw"]
lmdb = ["oxpinyin-data/lmdb"]
redb = ["oxpinyin-data/redb"]

[[bin]]
name = "oxpinyin-segment"
path = "src/bin/oxpinyin-segment.rs"

[[bin]]
name = "oxpinyin-spseg"
path = "src/bin/oxpinyin-spseg.rs"

[[bin]]
name = "oxpinyin-mergeseq"
path = "src/bin/oxpinyin-mergeseq.rs"

[dependencies]
# default-features = false so workspace `--no-default-features` builds are
# not re-defaulted through this edge; the [features] block above forwards
# the backend selection instead.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }

[dev-dependencies]
# Dev-only edge: the differential suite uses the shared `locate_bin` pin
# binary locator. No shipping code depends on oxpinyin-testsupport.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
