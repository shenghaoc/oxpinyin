[package]
name = "oxpinyin-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Nonshipping interactive access to oxpinyin's parser, lookup and C facades"

[lints]
workspace = true

[features]
default = ["tkrzw"]
tkrzw = ["oxpinyin-utils/tkrzw", "oxpinyin/tkrzw", "oxpinyin-capi/tkrzw", "oxzhuyin-capi/tkrzw"]
bdb = ["oxpinyin-utils/bdb", "oxpinyin/bdb", "oxpinyin-capi/bdb", "oxzhuyin-capi/bdb"]
kyotocabinet = ["oxpinyin-utils/kyotocabinet", "oxpinyin/kyotocabinet", "oxpinyin-capi/kyotocabinet", "oxzhuyin-capi/kyotocabinet"]

[dependencies]
oxpinyin-utils = { path = "../utils", version = "=0.1.0-alpha.2", default-features = false }
oxpinyin = { workspace = true }
oxpinyin-capi = { path = "../capi", version = "=0.1.0-alpha.2", default-features = false }
oxzhuyin-capi = { path = "../zhuyin-capi", version = "=0.1.0-alpha.2", default-features = false }

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
regex.workspace = true
rstest.workspace = true
sha2.workspace = true
tempfile.workspace = true
# The tests use the native text newline and the fixture store extension.
oxpinyin = { workspace = true, features = ["test-hooks"] }
