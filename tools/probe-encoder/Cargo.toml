[package]
name = "probe-encoder"
version = "0.1.0"
edition = "2024"
publish = false
description = "Probe the pinned oracle to derive SyllableKey → TableKey mapping"

[features]
# Probing drives the pin-built libpinyin; without this feature the binary is a
# stub so that plain `cargo check --workspace` covers the crate everywhere.
oracle-ffi = ["dep:pinyin-oracle", "pinyin-oracle/oracle-ffi"]

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
pinyin-core = { path = "../../crates/pinyin-core" }
pinyin-oracle = { path = "../../crates/pinyin-oracle", optional = true }
pinyin-data = { path = "../../crates/pinyin-data" }
