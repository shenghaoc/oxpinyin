[package]
name = "pinyin-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI subset of libpinyin's public API, for the borrowed frontend. Linux only."

# Supported C ABI (Linux); soname/versioning freezes with the first public release.
[lib]
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "allow" # FFI + glib marshalling only; // SAFETY: on every block
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
pinyin-core.workspace = true
pinyin-data = { path = "../pinyin-data" }
pinyin-engine.workspace = true
pinyin-user.workspace = true
