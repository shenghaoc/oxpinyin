# Path gates: CI runs only when code or a direct input of one of its jobs
# changes, so docs-only changes skip lint, test, python, deny and fuzz
# entirely (mirrors the path gate in store-backends.yml).
#
# Why each path is gated:
#   - crates/** — any code change
#   - fuzz/** — the fuzz job uses fuzz/Cargo.toml and fuzz/src/
#   - tools/** — the test job runs tools/bisection/run-cpp-smoke.sh and
#     run-live-typing-diff.sh, so bisection-script changes are CI inputs
#   - Cargo.toml / Cargo.lock — workspace manifest and lockfile: a
#     dependency or feature change reaches lint, test, python and deny
#   - deny.toml — the deny job reads this directly
#   - rust-toolchain.toml — a toolchain change affects every job
#   - .github/workflows/ci.yml — the workflow file itself
#
# Deliberately NOT gated (changes to these skip CI):
#   - docs/** — findings, design docs, ROADMAP: no code
#   - reference/** — memory safety docs: no code
#   - .kiro/** — specs and steering: no code
#   - *.md at the root — README, CHANGELOG: no code
#   - .github/workflows/store-backends.yml — store-backends has its own
#     trigger and its own path gate; ci.yml doesn't need to re-gate on it
#
# Branch-protection interaction: on a path-filtered run this workflow
# never starts and reports no status, so a required status check pointed
# at a job here would stay "Pending" ("Waiting for status to be
# reported") and block the PR — GitHub has no setting to waive that;
# only checks that actually report a status can pass. main currently
# has no branch protection and no required checks, so nothing blocks
# docs-only changes today. If required checks are ever added, require
# an aggregate check from an always-on workflow, never jobs in this
# path-gated one.

name: CI

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - fuzz/**
      - tools/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deny.toml
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - fuzz/**
      - tools/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deny.toml
      - .github/workflows/ci.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Five jobs:
#   lint — rustfmt + clippy
#   test — cargo test for the whole workspace, and the portable crates on
#          macOS and Windows
#   python — the oxpinyin Python binding on the container image's stock
#            python3 — GIL-enabled CPython 3.14, since actions/setup-python
#            cannot serve a container job and took the old '3.14t' selector
#            with it: wheel build, binding tests, and native-vs-Python
#            parity against the corpus transcript
#   deny — supply-chain gate: RustSec advisories, licenses, sources,
#          duplicate-version drift (docs/safety/oxpinyin-safety-profile.md
#          layer 6)
#   fuzz — bounded parser fuzz smoke test on a pinned nightly/tool version

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: lint-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Tkrzw is the default store backend; bindgen (libclang) reads
        # tkrzw_langc.h at build time, and Debian's libtkrzw build demands
        # the compression -dev packages at link time. The portable jobs
        # below run the pure-Rust redb fallback instead.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          rust-cache-key: test-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Tkrzw is the default store backend; bindgen (libclang) reads
        # tkrzw_langc.h at build time, and Debian's libtkrzw build demands
        # the compression -dev packages at link time. The portable jobs
        # below run the pure-Rust redb fallback instead.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - run: cargo test --locked --workspace
      - name: C++ pinyin.h smoke gate
        run: tools/bisection/run-cpp-smoke.sh
      # The post-choose live-typing/train differential (sentence-surface's
      # §3 machinery). Self-skips unless the pin-built oracle
      # (PINYIN_ORACLE_PREFIX) and a real-unigram system dir
      # (LIVETYPING_SYSTEM) are present — runner-local only: the model20
      # archive is non-redistributable and never enters CI, so this and
      # every model20-dependent check (oxpinyin-datagen's strict tests,
      # sentence-surface parity) run on a provisioned local machine, never
      # on GitHub-hosted runners.
      - name: Live-typing differential
        run: tools/bisection/run-live-typing-diff.sh

  # The Python binding: build the real extension (no mocks), run its pytest
  # suite, which regenerates the pure-Rust transcript via `native-dump` and
  # compares it against the binding's replay of the same corpus. The
  # interpreter is Debian's python3 from the container: actions/setup-python
  # does not support container jobs.
  python:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy
          rust-cache: 'true'
          rust-cache-key: python-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # The python job rides the workspace default (tkrzw): bindgen
        # (libclang) reads tkrzw_langc.h at build time, and Debian's
        # libtkrzw build demands the compression -dev packages at link
        # time (see store-backends.yml). python3 comes from apt —
        # actions/setup-python does not support container jobs — and the
        # pip installs need --break-system-packages: Debian marks its
        # interpreter PEP 668 externally managed, and this container is
        # ephemeral with no system Python to protect.
        run: apt-get install -y --no-install-recommends python3 python3-pip gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - name: Lint the binding feature set
        run: cargo clippy --locked -p oxpinyin-python --features bindings --all-targets -- -D warnings
      - name: Build and install the wheel
        working-directory: crates/oxpinyin-python
        # Pinned to the versions validated locally. --no-build-isolation makes
        # the build use this exact maturin instead of resolving its own from
        # the build-system requires range (>=1.14,<2) in an isolated env; that
        # range only bounds human-driven builds.
        #
        # On this GIL-enabled interpreter pyo3's abi3-py310 applies and
        # abi3t-py315 does not (abi3t needs 3.15+), so the wheel built here is
        # a stable-ABI cp310-abi3 one, not a version-specific build. See
        # docs/python.md, "Supported platforms".
        run: |
          pip install --break-system-packages maturin==1.15.0 pytest==9.1.1
          pip install --break-system-packages --no-build-isolation .
      # The ABI above is asserted, not just documented. debian:testing is
      # deliberately unpinned, so its python3 can move under us: to 3.15,
      # where abi3t-py315 takes over from abi3-py310, or to a free-threaded
      # build, where neither stable ABI applies and pyo3 emits a
      # version-specific extension. Either silently invalidates the
      # cp310-abi3 claim in the step above and in docs/python.md — which is
      # exactly how that prose went stale when this job was containerized.
      # Read the tag off the installed dist-info: `pip install .` leaves no
      # wheel file behind, but it does record what it built.
      - name: Assert the wheel is the documented stable ABI
        run: |
          python3 - <<'PY' >&2
          import importlib.metadata as metadata
          import sys

          wheel = metadata.distribution("oxpinyin").read_text("WHEEL") or ""
          tags = [
              line.split(":", 1)[1].strip()
              for line in wheel.splitlines()
              if line.startswith("Tag:")
          ]
          if not tags or any(not tag.startswith("cp310-abi3-") for tag in tags):
              print(
                  f"::error::built wheel tags {tags or '(none)'} are not the "
                  "documented cp310-abi3; the interpreter or pyo3's stable-ABI "
                  "selection moved. See docs/python.md, 'Supported platforms'."
              )
              sys.exit(1)
          print(f"wheel tags: {tags}")
          PY
      - name: Rust runtime tests
        run: cargo test --locked -p oxpinyin-python
      - name: Binding tests and native-vs-Python parity
        working-directory: crates/oxpinyin-python
        run: pytest -q

  # The portable crates on the other two supported operating systems.
  # structure.md marks core/data/user/engine portable; the oracle harness is
  # portable too with its Linux-only `oracle-ffi` feature off, and it carries
  # the graph and decode-level differentials. capi/oracle-ffi stay Linux-first
  # and are covered by the job above.
  #
  # Two jobs rather than a matrix: containers run on Linux runners only, so
  # a containerized matrix cannot cover these operating systems.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      # All backends but redb require Linux system libraries; redb is the
      # pure-Rust peer, selected by disabling the default (tkrzw)
      # feature chain and passing --features redb so the exactly-one-backend
      # guard sees exactly one peer.
      - run: >
          cargo test --locked --no-default-features --features redb
          -p oxpinyin-core -p oxpinyin-data -p oxpinyin-user -p oxpinyin-engine
      # Separately and with --no-default-features --features redb, so
      # oracle-ffi stays off even if it ever became a default feature — it
      # links the pin-built libpinyin and is Linux-only; on this runner it
      # would not build at all — and so the exactly-one-backend guard is
      # satisfied.
      - run: cargo test --locked -p pinyin-oracle --no-default-features --features redb

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      # Same selection as the macOS leg above: redb only, because every
      # other backend requires Linux system libraries.
      - run: >
          cargo test --locked --no-default-features --features redb
          -p oxpinyin-core -p oxpinyin-data -p oxpinyin-user -p oxpinyin-engine
      # Separately and with --no-default-features --features redb, so
      # oracle-ffi stays off even if it ever became a default feature — it
      # links the pin-built libpinyin and is Linux-only; on this runner it
      # would not build at all — and so the exactly-one-backend guard is
      # satisfied.
      - run: cargo test --locked -p pinyin-oracle --no-default-features --features redb

  # Supply-chain gate. cargo-deny's advisories check consumes the same
  # RustSec DB cargo-audit uses, so this one job replaces both tools; the
  # policy (allow-lists, deviation registry with review-by dates) lives in
  # deny.toml. The binary is downloaded pinned rather than `cargo install`ed
  # to keep the job under a minute.
  #
  # Debian Testing container in the store-backends.yml style: the supply
  # chain is checked on the rolling toolchain distros actually ship, and
  # the image is deliberately unpinned for the same reason (see that
  # workflow's header).
  deny:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny shells out to `cargo metadata`, so a cargo binary is
      # required; minimal profile suffices (nothing here compiles code).
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      - name: Install pinned cargo-deny
        run: |
          ver=0.20.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -sSfL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz
          mkdir -p ~/.local/bin
          install -m755 "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Default-feature tree first, then the feature-gated dependency
      # subtrees (lmdb/tkrzw, oracle-ffi). --locked pins both graphs to
      # the committed lockfiles. The fuzz workspace has its own lock and
      # its own graph (libfuzzer-sys), checked the same way.
      - run: cargo deny --locked --log-level error check
      - run: cargo deny --locked --all-features --log-level error check
      - run: cargo deny --locked --log-level error --manifest-path fuzz/Cargo.toml check
      # The RUSTSEC-2025-0141 (bincode) ignore in deny.toml is justified
      # by the heed-types path behind the non-default `lmdb` feature.
      # ignores are global, so assert the default graph stays bincode-free:
      # if bincode ever leaks into the default build, this fails loudly
      # instead of being silently masked by the ignore entry.
      - name: Assert the default graph is bincode-free
        run: |
          if cargo tree --workspace -i bincode >/dev/null 2>&1; then
            echo '::error::bincode is reachable in the default dependency graph; the RUSTSEC-2025-0141 ignore covers the lmdb path only' >&2
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      - name: Install build dependencies (apt)
        # The fuzz targets ride the workspace default (tkrzw): bindgen
        # (libclang) reads tkrzw_langc.h at build time, and Debian's
        # libtkrzw build demands the compression -dev packages at link
        # time.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - name: Install pinned nightly with Rust sources
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
      - name: Install pinned cargo-fuzz
        run: |
          ver=0.13.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
          curl -sSfL -o cargo-fuzz.tar.gz "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${ver}/cargo-fuzz-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-fuzz.tar.gz" | sha256sum -c -
          tar xzf cargo-fuzz.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-fuzz ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify fuzz lockfile
        run: cargo +nightly-2026-08-01 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Build every fuzz target
        # Compile gate for the whole fuzz workspace. Only the parser is run
        # here; the other targets used to reach a compiler solely in the
        # nightly soak lane (verify-nightly.yml), so a PR that broke one
        # merged green and surfaced the next night at best. The target
        # list is derived from the manifest's [[bin]] entries via
        # `cargo fuzz list` rather than enumerated, so a new target cannot
        # be forgotten here; an empty list fails loudly rather than passing
        # while building nothing. `fuzz build` and `fuzz run` share the
        # ASan release profile and the pinned gnu triple (see the next
        # step), so this warms exactly the parser binary the run step
        # executes — the two steps are not redundant.
        run: |
          set -euo pipefail
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          for target in "${targets[@]}"; do
            echo "::group::build $target"
            cargo +nightly-2026-08-01 fuzz build --target x86_64-unknown-linux-gnu "$target"
            echo "::endgroup::"
          done
      - name: Run bounded fuzz smoke pass (every target)
        # The pinned cargo-fuzz release binary is itself a musl build, and
        # cargo-fuzz defaults the fuzz target to the triple it was built for
        # (rust-fuzz/cargo-fuzz#398) — pin the runner's gnu triple so the
        # fuzzers build against the gnu std exactly as they did under the
        # source-built tool (ASan will not link musl's static libc).
        #
        # Every target gets a short run, not just the parser: building is
        # not executing. A harness whose environment went stale (the
        # capi-commands fixture path, 2026-09-04) compiled green and
        # failed only in the nightly soak — the first input already
        # panicked. A 10s run per target boots each harness against its
        # real inputs, fixtures, and temp state, so that class fails the
        # PR. The soak lane still does the deep work (180s/target).
        run: |
          set -euo pipefail
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz smoke $target"
            if ! cargo +nightly-2026-08-01 fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=10 -timeout=15 -max_len=4096; then
              status=1
              echo "::error::fuzz smoke failed for $target"
            fi
            echo "::endgroup::"
          done
          exit $status
