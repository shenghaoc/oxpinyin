[package]
name = "oxpinyin-training"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Private training stages and command-line tools; never ships."

[lints]
workspace = true

[features]
default = ["tkrzw"]
# The shared segment/data path opens phrase-index and related system files
# using the selected on-disk backend. Every backend-sensitive stage and
# command therefore shares this single selection.
kyotocabinet = ["oxpinyin-data/kyotocabinet"]
bdb = ["oxpinyin-data/bdb"]
tkrzw = ["oxpinyin-data/tkrzw"]

[dependencies]
oxpinyin-core.workspace = true
oxpinyin-data.workspace = true
# Direct, so cargo passes this package's build script the store's links
# metadata (the Kyoto Cabinet library directory, for the rpath). The
# backend feature reaches the store through oxpinyin-data.
oxpinyin-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
