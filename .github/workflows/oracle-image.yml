name: oracle-image

# Builds the pin-built oracle LIBRARIES (libpinyin.so, libzhuyin.so, headers,
# pkg-config files, oracle-pin.txt for the bdb, kc and tkrzw cells) in the
# Debian trixie pin-reference image and publishes them to GHCR as
#
#   ghcr.io/shenghaoc/oxpinyin-oracle:<tag>
#
# (<tag> is printed by `just compat image-tag`: the libpinyin commit, the
# base image codename and a hash of the recipe and oracle-pin.txt, so it
# changes whenever the library hashes or their record can; an existing tag is
# never overwritten).
# Native linux/amd64 and linux/arm64 jobs build separately. The amd64 job
# keeps its historical <tag> and <tag>-deps tags; the arm64 job publishes the
# sibling <tag>-arm64 and <tag>-deps-arm64 tags. The library hashes are in each
# platform's image labels.
# The build is reproducible (tools/oracle/build-oracle.sh), so each job checks
# its platform's hashes against tools/oracle/oracle-pin.txt before anything is
# pushed.
#
# The image carries NO model20-derived data: the model is not redistributable
# (docs/findings/model-provenance.md) and no job here fetches it. Lanes
# regenerate lib/libpinyin/data locally (docs/runbooks/oracle.md). The job
# builds and verifies on pull requests that touch the recipe, and pushes only
# only from a normal push to main. Compatibility-only inputs do not rebuild
# the frozen libraries. The changes job selects the appropriate validation path.
#
# A later push to a pull request skips the rebuild and verification of an
# image that push's tag and verifier files already passed on that pull request
# and architecture (#1241). The jobs still run and report success under the
# same names; main pushes and publication are unchanged.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/oracle/build-oracle.sh
      - tools/oracle/Dockerfile.oracle
      - tools/oracle/oracle-pin.txt
      - tools/oracle/version-manifest.json
      - tools/oracle/versions.py
      - tools/tkrzw/distro-probe.sh
      - tools/dev/compat/**
      - .github/workflows/oracle-image.yml
      - tools/oracle/Dockerfile.compat
      - tools/oracle/compat.sh
      - tools/oracle/compat-inside.sh
      - tools/cloud/setup.sh
      - rust-toolchain.toml
  pull_request:
    branches: [main]
    paths:
      - tools/oracle/build-oracle.sh
      - tools/oracle/Dockerfile.oracle
      - tools/oracle/oracle-pin.txt
      - tools/oracle/version-manifest.json
      - tools/oracle/versions.py
      - tools/tkrzw/distro-probe.sh
      - tools/dev/compat/**
      - .github/workflows/oracle-image.yml
      - tools/oracle/Dockerfile.compat
      - tools/oracle/compat.sh
      - tools/oracle/compat-inside.sh
      - tools/cloud/setup.sh
      - rust-toolchain.toml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: oracle-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). Pinned, not ubuntu-latest, so a runner-image
    # move (26.04: actions/runner-images#14748) happens here under review.
    runs-on: &ubuntu ubuntu-26.04
    outputs:
      oracle: ${{ steps.scope.outputs.oracle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the Bash floor
        shell: bash
        run: . tools/lib/bash-floor.sh
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          oracle=false
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            oracle=true
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if grep -E '^(tools/dev/compat/.*|tools/oracle/(build-oracle.sh|Dockerfile.oracle|oracle-pin.txt|version-manifest.json|versions.py)|tools/tkrzw/distro-probe.sh|.github/workflows/oracle-image.yml)$' <<< "$changed" >/dev/null; then
              oracle=true
            fi
          fi
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"

  oracle-image:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: *ubuntu
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps: &validation_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the Bash floor
        shell: bash
        run: . tools/lib/bash-floor.sh

      - name: Provision managed Python
        run: bash tools/cloud/setup.sh --python-only

      - name: Derive the tag and labels from oracle-pin.txt
        id: meta
        run: |
          set -euo pipefail
          pin=tools/oracle/oracle-pin.txt
          field() { sed -n "s/^$1=//p" "$pin"; }
          commit=$(field libpinyin_commit)
          base=$(field base_image)
          {
            echo "tag=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat image-tag)"
            echo 'labels<<LABELS_EOF'
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.description=Reproducible pin-built libpinyin/libzhuyin oracle libraries (no model data)"
            echo "io.github.shenghaoc.oxpinyin.libpinyin-commit=${commit}"
            echo "io.github.shenghaoc.oxpinyin.base-image=${base}"
            for dbm in bdb kc tkrzw; do
              echo "io.github.shenghaoc.oxpinyin.${dbm}.libpinyin-sha256=$(field "libpinyin_sha256_${dbm}")"
              echo "io.github.shenghaoc.oxpinyin.${dbm}.libzhuyin-sha256=$(field "libzhuyin_sha256_${dbm}")"
            done
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      # A completed build and verification is recorded per (tag, architecture)
      # in the Actions cache (#1241). The cache is scoped to this PR's ref, so a
      # record exists only for an image this PR already built and verified. The
      # key is the full image tag plus a hash of the files that verify it, so a
      # change to the image (the tag) or to its verification rebuilds. A record
      # is written by the last step, after every check has passed, and never
      # for a failure. Main pushes neither read nor write it.
      - name: Look up the verified amd64 image record
        id: record
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle-image-verified
          key: oracle-image-verified-linux-amd64-${{ steps.meta.outputs.tag }}-${{ hashFiles('.github/workflows/oracle-image.yml', 'tools/oracle/Dockerfile.compat', 'tools/oracle/compat.sh', 'tools/oracle/compat-inside.sh', 'tools/dev/compat/*.py', 'tools/cloud/setup.sh', 'tools/tkrzw/distro-probe.sh', 'rust-toolchain.toml') }}
          lookup-only: true

      - name: Skip the amd64 image rebuild
        if: steps.record.outputs.cache-hit == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: echo "::notice::oracle image tag ${TAG} was already built and verified for linux/amd64 on this pull request; skipping the rebuild and verification"

      - name: Set up buildx
        if: steps.record.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the oracle image
        if: needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/oracle/Dockerfile.oracle
          platforms: linux/amd64
          load: true
          provenance: false
          tags: oxpinyin-oracle:candidate
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the library hashes and the absence of model data
        if: needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        run: uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat verify-image --engine docker oxpinyin-oracle:candidate

      - name: Reuse the immutable reference for compatibility-only changes
        if: needs.changes.outputs.oracle != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker pull "ghcr.io/shenghaoc/oxpinyin-oracle:$TAG"
          docker tag "ghcr.io/shenghaoc/oxpinyin-oracle:$TAG" oxpinyin-oracle:candidate
          uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat verify-image --engine docker oxpinyin-oracle:candidate

      # Reuse the exact pinned environment needed for local --regen-data.
      # No model inputs enter this stage or the published artifact.
      - name: Build the recorded oracle build environment
        id: deps
        if: steps.record.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/oracle/Dockerfile.oracle
          target: deps
          platforms: linux/amd64
          load: true
          provenance: false
          tags: oxpinyin-oracle-deps:candidate

      - name: Verify deps is exactly the recorded build stage
        if: steps.record.outputs.cache-hit != 'true'
        env:
          BUILT_STAGE_ID: ${{ steps.deps.outputs.imageid }}
        run: |
          set -euo pipefail
          # Publish only the image produced by the explicit file/target above.
          test "$(docker image inspect --format '{{.Id}}' oxpinyin-oracle-deps:candidate)" = "$BUILT_STAGE_ID"
          base=$(sed -n 's/^base_image=//p' tools/oracle/oracle-pin.txt)
          test "$base" = debian:trixie
          grep -Fq "$base AS deps" tools/oracle/Dockerfile.oracle
          # The deps stage is the trixie pin-reference environment. It may
          # COPY only the version-check inputs and has no secret-bearing ENV.
          stage=$(sed '/^FROM deps AS build/,$d' tools/oracle/Dockerfile.oracle)
          grep -q '^FROM .*debian:trixie' <<< "$stage"
          if grep -qE '^(ADD|ENV) ' <<< "$stage"; then
            echo 'unexpected ADD or ENV in the deps stage' >&2
            exit 1
          fi
          bad=$(grep -E '^COPY ' <<< "$stage" | \
            grep -vE '^COPY tools/(oracle/(version-manifest.json|versions.py)|tkrzw/distro-probe.sh) ' || true)
          if [[ -n $bad ]]; then
            printf 'unexpected COPY in the deps stage: %s\n' "$bad" >&2
            exit 1
          fi
          docker run --rm oxpinyin-oracle-deps:candidate sh -ec '
            test ! -e /opt/pinyin-oracle
            test ! -e /root/.docker/config.json
            test ! -e /root/.aws
            test ! -e /state
            test ! -e /run/secrets/cacert
            test -z "$(find / -name "*model20*" -print -quit 2>/dev/null)"
            command -v cc; command -v pkg-config; command -v python3'

      - name: Build compatibility execution environment from the same stages
        if: steps.record.outputs.cache-hit != 'true'
        run: |
          docker buildx build --builder default --load --platform linux/amd64 \
            --build-arg DEPS_IMAGE=oxpinyin-oracle-deps:candidate \
            --build-arg REFERENCE_IMAGE=oxpinyin-oracle:candidate \
            -f tools/oracle/Dockerfile.compat -t oxpinyin-compat:candidate .
          docker run --rm --workdir /tmp/toolchain oxpinyin-compat:candidate rustc -Vv
          bash -n tools/oracle/compat.sh tools/oracle/compat-inside.sh tools/cloud/setup.sh
          # No CI job fetches model20. End-to-end local differentials are
          # recorded separately and never turn missing model input into pass.

      - name: Record the verified amd64 image
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p .oracle-image-verified
          printf '%s\n' "$TAG" > .oracle-image-verified/linux-amd64

      - name: Save the verified amd64 image record
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle-image-verified
          key: oracle-image-verified-linux-amd64-${{ steps.meta.outputs.tag }}-${{ hashFiles('.github/workflows/oracle-image.yml', 'tools/oracle/Dockerfile.compat', 'tools/oracle/compat.sh', 'tools/oracle/compat-inside.sh', 'tools/dev/compat/*.py', 'tools/cloud/setup.sh', 'tools/tkrzw/distro-probe.sh', 'rust-toolchain.toml') }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.oracle == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.oracle == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          image=ghcr.io/shenghaoc/oxpinyin-oracle:${TAG}
          # The tag names its recipe, so a tag that already exists was built
          # from this recipe: keep it, never overwrite.
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo "::notice::${image} already exists; not overwriting it"
            exit 0
          elif ! grep -qiE 'no such manifest|manifest unknown|not found' <<<"$out"; then
            echo "::error::cannot tell whether ${image} exists: ${out}"
            exit 1
          fi
          docker tag oxpinyin-oracle:candidate "$image"
          docker push "$image"

      - name: Push pinned build environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.oracle == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          image=ghcr.io/shenghaoc/oxpinyin-oracle:${TAG}-deps
          if out=$(docker manifest inspect "$image" 2>&1); then
            echo "::notice::${image} already exists; not overwriting it"
            exit 0
          elif ! grep -qiE 'no such manifest|manifest unknown|not found' <<<"$out"; then
            echo "::error::cannot tell whether ${image} exists: ${out}"
            exit 1
          fi
          docker tag oxpinyin-oracle-deps:candidate "$image"
          docker push "$image"

  oracle-image-arm64:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the Bash floor
        shell: bash
        run: . tools/lib/bash-floor.sh

      - name: Provision managed Python
        run: bash tools/cloud/setup.sh --python-only

      - name: Derive the arm64 tag and labels from oracle-pin.txt
        id: meta
        run: |
          set -euo pipefail
          pin=tools/oracle/oracle-pin.txt
          platform=linux/arm64
          field() { sed -n "s/^$1=//p" "$pin"; }
          pfield() { uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat pin-field --platform "$platform" "$1"; }
          commit=$(field libpinyin_commit)
          base=$(field base_image)
          {
            echo "tag=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat image-tag)"
            echo 'labels<<LABELS_EOF'
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.description=Reproducible pin-built libpinyin/libzhuyin oracle libraries (no model data), linux/arm64"
            echo "io.github.shenghaoc.oxpinyin.platform=${platform}"
            echo "io.github.shenghaoc.oxpinyin.libpinyin-commit=${commit}"
            echo "io.github.shenghaoc.oxpinyin.base-image=${base}"
            for dbm in bdb kc tkrzw; do
              echo "io.github.shenghaoc.oxpinyin.${dbm}.libpinyin-sha256=$(pfield "libpinyin_sha256_${dbm}")"
              echo "io.github.shenghaoc.oxpinyin.${dbm}.libzhuyin-sha256=$(pfield "libzhuyin_sha256_${dbm}")"
            done
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      # A completed build and verification is recorded per (tag, architecture)
      # in the Actions cache (#1241). The cache is scoped to this PR's ref, so a
      # record exists only for an image this PR already built and verified. The
      # key is the full image tag plus a hash of the files that verify it, so a
      # change to the image (the tag) or to its verification rebuilds. A record
      # is written by the last step, after every check has passed, and never
      # for a failure. Main pushes neither read nor write it.
      - name: Look up the verified arm64 image record
        id: record
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle-image-verified
          key: oracle-image-verified-linux-arm64-${{ steps.meta.outputs.tag }}-${{ hashFiles('.github/workflows/oracle-image.yml', 'tools/oracle/Dockerfile.compat', 'tools/oracle/compat.sh', 'tools/oracle/compat-inside.sh', 'tools/dev/compat/*.py', 'tools/cloud/setup.sh', 'tools/tkrzw/distro-probe.sh', 'rust-toolchain.toml') }}
          lookup-only: true

      - name: Skip the arm64 image rebuild
        if: steps.record.outputs.cache-hit == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: echo "::notice::oracle image tag ${TAG} was already built and verified for linux/arm64 on this pull request; skipping the rebuild and verification"

      - name: Set up buildx
        if: steps.record.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the arm64 oracle image
        if: steps.record.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/oracle/Dockerfile.oracle
          platforms: linux/arm64
          build-args: ORACLE_PLATFORM=linux/arm64
          load: true
          provenance: false
          tags: oxpinyin-oracle:candidate-arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the arm64 library hashes and the absence of model data
        if: steps.record.outputs.cache-hit != 'true'
        run: uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat verify-image --engine docker --platform linux/arm64 oxpinyin-oracle:candidate-arm64

      - name: Build the recorded arm64 oracle build environment
        id: deps
        if: steps.record.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/oracle/Dockerfile.oracle
          target: deps
          platforms: linux/arm64
          build-args: ORACLE_PLATFORM=linux/arm64
          load: true
          provenance: false
          tags: oxpinyin-oracle-deps:candidate-arm64

      - name: Verify the arm64 deps stage is exactly the recorded build stage
        if: steps.record.outputs.cache-hit != 'true'
        env:
          BUILT_STAGE_ID: ${{ steps.deps.outputs.imageid }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' oxpinyin-oracle-deps:candidate-arm64)" = "$BUILT_STAGE_ID"
          base=$(sed -n 's/^base_image=//p' tools/oracle/oracle-pin.txt)
          test "$base" = debian:trixie
          grep -Fq "$base AS deps" tools/oracle/Dockerfile.oracle
          # The deps stage is the trixie pin-reference environment. It may
          # COPY only the version-check inputs and has no secret-bearing ENV.
          stage=$(sed '/^FROM deps AS build/,$d' tools/oracle/Dockerfile.oracle)
          grep -q '^FROM .*debian:trixie' <<< "$stage"
          if grep -qE '^(ADD|ENV) ' <<< "$stage"; then
            echo 'unexpected ADD or ENV in the deps stage' >&2
            exit 1
          fi
          bad=$(grep -E '^COPY ' <<< "$stage" | \
            grep -vE '^COPY tools/(oracle/(version-manifest.json|versions.py)|tkrzw/distro-probe.sh) ' || true)
          if [[ -n $bad ]]; then
            printf 'unexpected COPY in the deps stage: %s\n' "$bad" >&2
            exit 1
          fi
          docker run --rm oxpinyin-oracle-deps:candidate-arm64 sh -ec '
            test ! -e /opt/pinyin-oracle
            test ! -e /root/.docker/config.json
            test ! -e /root/.aws
            test ! -e /state
            test ! -e /run/secrets/cacert
            test -z "$(find / -name "*model20*" -print -quit 2>/dev/null)"
            command -v cc; command -v pkg-config; command -v python3'

      - name: Check arm64 reproducibility against the frozen hashes
        if: steps.record.outputs.cache-hit != 'true'
        run: uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev compat reproducible --engine docker --platform linux/arm64 --image oxpinyin-oracle-deps:candidate-arm64

      - name: Record the verified arm64 image
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p .oracle-image-verified
          printf '%s\n' "$TAG" > .oracle-image-verified/linux-arm64

      - name: Save the verified arm64 image record
        if: github.event_name == 'pull_request' && needs.changes.outputs.oracle == 'true' && steps.record.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oracle-image-verified
          key: oracle-image-verified-linux-arm64-${{ steps.meta.outputs.tag }}-${{ hashFiles('.github/workflows/oracle-image.yml', 'tools/oracle/Dockerfile.compat', 'tools/oracle/compat.sh', 'tools/oracle/compat-inside.sh', 'tools/dev/compat/*.py', 'tools/cloud/setup.sh', 'tools/tkrzw/distro-probe.sh', 'rust-toolchain.toml') }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.oracle == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arm64 images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.oracle == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          push_one() {
            local target=$1 source=$2 out
            if out=$(docker manifest inspect "$target" 2>&1); then
              echo "::notice::${target} already exists; not overwriting it"
              return 0
            elif ! grep -qiE 'no such manifest|manifest unknown|not found' <<<"$out"; then
              echo "::error::cannot tell whether ${target} exists: ${out}"
              return 1
            fi
            docker tag "$source" "$target"
            docker push "$target"
          }
          push_one "ghcr.io/shenghaoc/oxpinyin-oracle:${TAG}-arm64" oxpinyin-oracle:candidate-arm64
          push_one "ghcr.io/shenghaoc/oxpinyin-oracle:${TAG}-deps-arm64" oxpinyin-oracle-deps:candidate-arm64


  compatibility-environment:
    needs: changes
    if: needs.changes.outputs.oracle != 'true'
    runs-on: *ubuntu
    timeout-minutes: 90
    permissions:
      contents: read
    # Same checks/recipe; frozen build and publication steps are gated out.
    steps: *validation_steps
