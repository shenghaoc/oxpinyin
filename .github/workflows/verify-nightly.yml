name: verify-nightly

# Tier-3 scheduled verification (docs/safety/ci-strategy.md): everything
# too slow or too nightly for the PR gate. Findings here open issues —
# they do not block merges unless a ratchet exists (two: the coverage
# floor and the public-API snapshot; Lizard's CCN limit moved to ci.yml's
# lint job on 2026-09-08 — seconds of runtime, so it gates the PR).
#
# No trial lanes remain: the Miri, cargo-mutants and cargo-geiger jobs
# were retired on 2026-09-01 (docs/findings/verify-nightly.md). There are
# no continue-on-error lanes; every job in this workflow must be green.
# Surviving lanes: fuzz-soak, differentials, overflow-lane, coverage (via
# coverage.yml, also the path-filtered PR gate), public-api, nextest.
#
# All jobs run in debian:testing containers in the store-backends.yml
# style: the nightly lanes exist to surface drift early, and the rolling
# distro toolchain is part of what they exercise. The image is
# deliberately unpinned — do not "stabilise" it.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-nightly
  cancel-in-progress: false

jobs:
  # Every fuzz target, 3 minutes each, ASan+LSan on by default with
  # cargo-fuzz 0.13.2. The list comes from `cargo fuzz list`, as in
  # ci.yml's smoke pass, so a new target cannot be left out of the soak:
  # the five-name literal this replaced silently skipped the three targets
  # added on 2026-09-08. The dict-loader corpus is seeded from the
  # committed w3 tables so the decoder starts from valid headers.
  fuzz-soak:
    runs-on: ubuntu-latest
      # Same ASan leeway as the tkrzw sanitizer job in store-backends.yml:
      # Docker's default seccomp profile blocks personality(2), which the
      # setarch ASLR-off wrapper below needs.
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # The override the comment above exists for: without it Docker's
      # default seccomp profile blocks personality(2) and setarch -R dies
      # with EPERM before any target runs.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      # One nightly toolchain serves both cargo-fuzz's build and the runs
      # (cargo install works on nightly; no second toolchain needed).
      - name: Install the pinned nightly with Rust sources
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly-2026-08-01 --component rust-src
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Fuzzing memory, half one: the corpora persist across nightly runs
      # (latest-wins — the run-id key always misses so every run saves,
      # the prefix restore-key always loads the newest save), so a soak
      # starts where the last one ended instead of from the single
      # committed seed. Restored before seeding: the seed step re-copies
      # its fixture inputs over whatever the cache brought back.
      - name: Restore the accumulated fuzz corpora
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Seed corpora
        run: |
          shopt -s nullglob
          seeds=(fixtures/w3/*.bin)
          mkdir -p fuzz/corpus/dict-loader
          if [ ${#seeds[@]} -gt 0 ]; then
            cp "${seeds[@]}" fuzz/corpus/dict-loader/
          else
            echo '::warning::no fixtures/w3 .bin seeds found; dict-loader starts from an empty corpus'
          fi
      - name: Soak each target
        # Every target runs even if an earlier one fails; the accumulated
        # status is the step's exit code. -print_final_stats leaves the
        # coverage/edge counters in the log so a soak that explored
        # nothing is visible as one, not just green.
        run: |
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # setarch -R disables ASLR for the process tree: runner
            # kernels' mmap entropy exceeds ASan's shadow mapping, and an
            # unprivileged container cannot lower vm.mmap_rnd_bits itself
            # (same rationale as store-backends.yml's sanitizer job).
            if ! setarch "$(uname -m)" -R cargo +nightly-2026-08-01 fuzz run "$target" -- -max_total_time=180 -timeout=15 -max_len=4096 -print_final_stats=1; then
              status=1
              echo "::error::fuzz target $target failed"
            fi
            echo "::endgroup::"
          done
          exit $status
      # Fuzzing memory, half two: a crash survives the runner as an
      # artifact (cargo-fuzz writes crash-* inputs under
      # fuzz/artifacts/<target>/), not as a log line that dies with the
      # job.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/

  # The fixture tier of the oracle differentials: build the pinned
  # libpinyin (public source, SHA read from tools/oracle/build-oracle.sh
  # and verified) and run, nightly, every differential gate COMMITTED
  # fixtures can carry — the tkrzw drop-in (byte-exact datagen parity
  # over the toned mini-model), ngseg live parity (toned tables), and
  # the KMM gen/export/merge/validate + spseg live gates (committed w3
  # tables, whose token space matches those gates' corpora). This
  # honors the no-model20-in-CI policy (store-backends.yml header)
  # while turning part of the manual evidence into a drift alarm. What
  # committed data cannot carry stays on developer machines, each
  # exclusion recorded by mechanism in the script header: the
  # model20-token-space goldens and corpora (lambda, counter, ngseg
  # goldens), mergeseq live (the pin emits a token outside the w3
  # phrase table), KMM prune (the pin SIGSEGVs on that gate's fixture
  # input), and eval (no interpolation2.text consistent with w3).
  differentials:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the runner essentials and oracle build deps (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make pkg-config autoconf automake autopoint libtool gettext libglib2.0-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libclang-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - name: Run the fixture-tier differentials
        run: tools/oracle/nightly-fixture-differentials.sh

  # Latent-overflow lane: the releaseoptimized codepath with overflow
  # checks and debug assertions forced on (docs/safety/
  # tooling-evaluation.md §8) — the "NDEBUG question" as CI, not as
  # shipped configuration.
  overflow-lane:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C overflow-checks=y -C debug-assertions=y -D warnings
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libkyotocabinet-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - run: cargo test --locked --workspace --release --no-default-features --features kyotocabinet

  # Coverage floor: the reusable job in coverage.yml, which is also the
  # path-filtered PR gate. Called here unconditionally so the whole-tree
  # number is measured nightly whatever a PR touched. The floor and its
  # history live in that file.
  coverage:
    uses: ./.github/workflows/coverage.yml

  # Public-API snapshot for the supported Rust surface (structure.md:
  # "cargo-public-api snapshots apply to the supported surface only").
  # The committed snapshot is docs/api/oxpinyin-engine.public-api.txt;
  # any diff fails the lane. A deliberate surface change regenerates the
  # file in the same PR (docs/runbooks/goldens-and-pins.md). The tool
  # reads rustdoc JSON, which is nightly-only, so it shares the fuzz
  # lane's pinned nightly; cargo-public-api is cargo-installed and
  # version-pinned the way cargo-fuzz is above. The engine has no
  # features and no store dependency, so no C library is needed.
  public-api:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      # libssl-dev above: cargo-public-api links openssl-sys; the first
      # container run without it failed in that build script.
      - name: Install the pinned nightly
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly-2026-08-01
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff the engine's public API against the committed snapshot
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-01 public-api -p oxpinyin-engine --simplified > public-api.txt
          diff -u docs/api/oxpinyin-engine.public-api.txt public-api.txt

  # nextest over the whole workspace: proven equivalent locally (751/751
  # vs cargo test). If this stays green on the schedule, flipping the PR
  # gate's unit lane to nextest is a one-line follow-up.
  nextest:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libkyotocabinet-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - name: Install pinned cargo-nextest
        run: |
          ver=0.9.143
          sum=6d891c18105ec2d33f6e441a4f92b7ccab47ba263e22055c8bb66884243f3389
          curl -sSfL -o cargo-nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf cargo-nextest.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-nextest ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo nextest run --locked --workspace --no-default-features --features kyotocabinet
      # doctests stay on cargo test (nextest does not run them)
      - run: cargo test --locked --workspace --doc --no-default-features --features kyotocabinet

  # Perf-and-size snapshot series. NOT a gate: it measures the tree once a
  # night, compares tonight against the previous sample, and reports. Nothing
  # here runs on the PR path and nothing here blocks a merge.
  #
  # The per-PR gate this replaces was rejected as infeasible — a gate is a
  # before-and-after comparison and a PR run cannot produce a trustworthy
  # pair. The decision, the reasons, and what this lane may and may not claim
  # are in docs/perf/ci-perf-size-gate-proposal-2026-09-09.md. Three of its
  # rules are load-bearing here:
  #
  #   - Record freely, threshold almost nothing. A flag means "a human should
  #     look", never "this merge is bad".
  #   - The series localizes WHEN a level moved, not WHY. The environment is
  #     recorded with each sample, and a move across an environment change is
  #     reported as unattributable rather than flagged.
  #   - Only the schedule writes the series. A workflow_dispatch run measures
  #     and reports, but must never become the predecessor the next real
  #     night compares against.
  #
  # Wall clock is deliberately absent. The image stays unpinned like every
  # other lane here: a size series that steps when the toolchain moves is
  # reporting something true, and that is what this workflow is for.
  perf-snapshot:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      # tkrzw is the default backend and the one the w3 fixture directory the
      # snapshot opens was compiled for. valgrind supplies the instruction
      # count; it is optional by design — snapshot.sh records null rather than
      # zero when it is absent, so losing it degrades the sample instead of
      # corrupting the series.
      - name: Install build and measurement dependencies (apt)
        run: |
          apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev \
            liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev libssl-dev \
            binutils valgrind python3 util-linux
      # libssl-dev above: cargo-c pulls openssl-sys through the cargo crate,
      # and without it the build script dies with "Could not find directory of
      # OpenSSL installation" — the same way cargo-public-api did in the
      # public-api job, which is why that job installs it too. Confirmed by
      # dispatching this lane once without it.
      - run: cargo install cargo-c --version 0.10.25 --locked
      # Its own cache namespace: perf-snapshot-, disjoint from fuzz-corpus-.
      # Same latest-wins shape the fuzz soak uses — the run-id key always
      # misses so a save always happens, the prefix restore-key always loads
      # the newest save. A miss is normal (first run, or an eviction) and the
      # lane reports "nothing to compare" rather than failing.
      # restore/save split rather than the combined actions/cache, because the
      # combined action's post step is `post-if: success()`. The compare step
      # below exits non-zero on a flagged move, which would skip the save and
      # drop the very sample that was flagged — the next night would then
      # compare against an older predecessor and could miss the move entirely.
      # Save explicitly, with `if: always()`, and fail after it.
      - name: Restore the snapshot series
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .perf-series
          key: perf-snapshot-${{ github.run_id }}
          restore-keys: |
            perf-snapshot-
      - name: Measure
        run: tools/perf-gate/snapshot.sh --out snapshot.json --backend tkrzw
      # --append only on the schedule. A manual run gets the full report and
      # writes nothing, so an off-cadence sample cannot silently become
      # tomorrow's baseline.
      # The exit status is captured rather than allowed to end the step, so the
      # save below still runs. It is re-raised after the save.
      - name: Compare against the previous night and report
        id: compare
        run: |
          set -uo pipefail
          args=(--snapshot snapshot.json --series-dir .perf-series
                --summary "$GITHUB_STEP_SUMMARY")
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            args+=(--append)
          fi
          status=0
          tools/perf-gate/series.py "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            echo "::error::series.py failed with $status"
            exit "$status"
          fi
      # Only the schedule writes, so a workflow_dispatch run cannot become the
      # predecessor the next real night compares against.
      - name: Save the snapshot series
        if: always() && github.event_name == 'schedule'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .perf-series
          key: perf-snapshot-${{ github.run_id }}
      - name: Re-raise a flagged comparison
        if: steps.compare.outputs.status == '1'
        run: |
          echo "::warning::a metric moved more than the attention threshold; see the job summary"
          exit 1
      # The durable copy. The cache is evictable; artifacts are not, so the
      # history survives an eviction even though the night-over-night
      # comparison skips that one night. Uploaded whether or not the compare
      # step flagged something.
      - name: Upload the snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-snapshot-${{ github.run_id }}
          path: snapshot.json
          retention-days: 90
