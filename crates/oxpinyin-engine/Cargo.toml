[package]
name = "oxpinyin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; the supported interfaces are the C APIs."

# Internal session layer; no Rust stability promise (AGENTS.md, "External interfaces").
[lints]
workspace = true

[dependencies]
# Internal workspace crate: the parser, decoder and vocabulary types this API
# is a façade over. Not an external dependency.
oxpinyin-core = { path = "../oxpinyin-core" }
smallvec.workspace = true
compact_str.workspace = true

[dev-dependencies]
# Fixture-backed doubles shared with the other test suites.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
# Micro-benches (benches/); workspace lock pins 0.8.
criterion = "0.8"

[[bench]]
name = "session_keystroke"
harness = false

[features]
# Off-by-default gate for the scan-matrix fan-out diagnostic driven by
# issue #403: enables one test that prints per-input matrix and path
# counters under --nocapture. Never enabled in CI or the shipped surface;
# only turned on locally for the diagnostic.
diagnostic_403 = []

# Counterfactual tail ordering for the existing ranking attribution driver.
# Never enabled by a shipping build.
diagnostic_ranking = []
