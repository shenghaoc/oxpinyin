[package]
name = "pinyin-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Converter: Tkrzw HashDB → redb for pinyin data. Handles phrase_index specially."

[lints.rust]
unsafe_code = "allow" # FFI to libtkrzw
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
pinyin-oracle = { path = "../pinyin-oracle", optional = true }
redb = { workspace = true }
pinyin-core = { path = "../pinyin-core" }
pinyin-data = { path = "../pinyin-data" }

[features]
oracle-ffi = ["dep:pinyin-oracle"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
