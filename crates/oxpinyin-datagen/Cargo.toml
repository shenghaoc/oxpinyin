[package]
name = "oxpinyin-datagen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "model20 → oxpinyin runtime tables compiler for every storage backend. Never ships."

[features]
# Tkrzw is the default selected backend (matching oxpinyin-store's
# workspace-default feature set) so a plain
# `cargo run -p oxpinyin-datagen -- compile ...` produces `.tkt` tables.
# The other four producers (redb, lmdb, kyotocabinet, bdb) are peer
# implementations behind the same `WriteStore` trait; each is chosen
# explicitly with `--no-default-features --features
# {redb|lmdb|kyotocabinet|bdb}` on the build and `--backend
# {redb|lmdb|kyotocabinet|bdb}` on the run. Only the producers whose
# cargo features are enabled are available at runtime.
default = ["tkrzw"]
# Enable the Kyoto Cabinet producer (`--backend kyotocabinet`); mirrors
# oxpinyin-store.
kyotocabinet = ["oxpinyin-store/kyotocabinet", "oxpinyin-testsupport/kyotocabinet"]
# Enable the Berkeley DB producer (`--backend bdb`); mirrors oxpinyin-store.
bdb = ["oxpinyin-store/bdb", "oxpinyin-testsupport/bdb"]
# Enable the LMDB producer (`--backend lmdb`); mirrors oxpinyin-store.
lmdb = ["oxpinyin-store/lmdb", "oxpinyin-testsupport/lmdb"]
# Enable the Tkrzw producer (`--backend tkrzw`); mirrors oxpinyin-store.
tkrzw = ["oxpinyin-store/tkrzw", "oxpinyin-testsupport/tkrzw"]
# The redb peer producer; forwarded to oxpinyin-store, which now gates
# redb behind the same feature. Select with
# `--no-default-features --features redb`.
redb = ["oxpinyin-store/redb", "oxpinyin-testsupport/redb"]

[lints]
workspace = true

[dependencies]
# ChewingKey encoding for libpinyin-compatible pinyin index output.
oxpinyin-core = { workspace = true }
# default-features = false: the producer set is selected by this crate's own
# features above, never dragged in by the store's default.
oxpinyin-store = { path = "../oxpinyin-store", default-features = false }
# Model-cache location and the pinned model20 constants for the compile
# defaults and the manifest. The locator's canonical home is testsupport
# (pinyin-oracle re-exports it for its own bins); datagen is its one
# non-dev consumer — a dev-lane edge, since this crate never ships.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
# The shared MemoryChunk chunk-format module (checksum, header, mask) the
# chunk writer shares with the runtime reader; tests additionally verify
# produced tables through the real loader. default-features = false so
# workspace `--no-default-features` runs are not re-defaulted through
# this edge.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }

[[bin]]
name = "oxpinyin-datagen"
path = "src/bin/oxpinyin-datagen.rs"
