[package]
name = "oxpinyin-user"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
oxpinyin-core = { workspace = true }
# The user store persists in libpinyin's own file shapes; the codecs
# (chunk builder, tree record builders, SingleGram, the logger and
# user.conf codecs) live in oxpinyin-data beside their readers.
oxpinyin-data = { workspace = true }
# The workspace table carries default-features = false for this edge; the
# [features] block below forwards the backend selection.
oxpinyin-store = { workspace = true }

[features]
# Backend selection, forwarded to oxpinyin-data and oxpinyin-store (one
# backend per binary; see the store's [features] for the model and
# precedence).
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-data/kyotocabinet", "oxpinyin-store/kyotocabinet"]
bdb = ["oxpinyin-data/bdb", "oxpinyin-store/bdb"]
lmdb = ["oxpinyin-data/lmdb", "oxpinyin-store/lmdb"]
tkrzw = ["oxpinyin-data/tkrzw", "oxpinyin-store/tkrzw"]
redb = ["oxpinyin-data/redb", "oxpinyin-store/redb"]

[dev-dependencies]
# Store micro-benches (benches/); workspace lock pins 0.8.
criterion = "0.8"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
redb = { workspace = true }

[[bench]]
name = "export_phrases"
harness = false

[[bench]]
name = "phrase_read"
harness = false
