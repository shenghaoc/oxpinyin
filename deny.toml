# cargo-deny policy — the single supply-chain gate (docs/safety/
# oxpinyin-safety-profile.md layer 6). Advisories share the RustSec DB with
# cargo-audit; running both in CI would be redundant.

[graph]
# Audit the default build. Feature-gated dependency subtrees (lmdb/tkrzw,
# oracle-ffi) are re-checked by the second, --all-features CI invocation.
all-features = false

[advisories]
version = 2
yanked = "deny"
# Deviation registry: every ignore carries its justification and a
# review-by date inside the reason string; re-review on that date and
# either renew or remove the entry.
ignore = [
    # bincode 1.x is unmaintained upstream; it reaches us only through
    # heed-types behind the non-default `lmdb` feature (the default redb
    # path never links it). No fix exists until heed migrates or we drop
    # the LMDB backend. Unmaintained, not a vulnerability.
    { id = "RUSTSEC-2025-0141", reason = "transitive via heed-types behind the non-default lmdb feature; unmaintained, not a vulnerability; redb is the default backend; review by 2027-02-28" },
]

[bans]
# Duplicate versions are a Stage-2 binary-size signal, not a correctness
# issue — warn and let the size pins arbitrate.
multiple-versions = "warn"
highlight = "simplest-path"
# Constitution §7 (no pinyin/IME crates as dependencies) stays a review
# rule; a concrete ban lands here only when it needs mechanical teeth.
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
# The project is GPL-3.0-or-later; runtime deps must be GPL-compatible.
allow = [
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
