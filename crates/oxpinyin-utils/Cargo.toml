[package]
name = "oxpinyin-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "libpinyin's utilities under their own names and interfaces (external-I/O boundary stage 5). Never ships."

[features]
# The data layer's backend selection, forwarded to every backend-sensitive
# edge the utilities use.
default = ["tkrzw"]
kyotocabinet = [
    "oxpinyin-capi/kyotocabinet",
    "oxpinyin-zhuyin-capi/kyotocabinet",
    "oxpinyin-data/kyotocabinet",
    "oxpinyin-store/kyotocabinet",
    "oxpinyin-user/kyotocabinet",
    "oxpinyin-kmm/kyotocabinet",
]
bdb = [
    "oxpinyin-capi/bdb",
    "oxpinyin-zhuyin-capi/bdb",
    "oxpinyin-data/bdb",
    "oxpinyin-store/bdb",
    "oxpinyin-user/bdb",
    "oxpinyin-kmm/bdb",
]
tkrzw = [
    "oxpinyin-capi/tkrzw",
    "oxpinyin-zhuyin-capi/tkrzw",
    "oxpinyin-data/tkrzw",
    "oxpinyin-store/tkrzw",
    "oxpinyin-user/tkrzw",
    "oxpinyin-kmm/tkrzw",
]

[lints]
workspace = true

[dependencies]
oxpinyin-runtime = { workspace = true, features = ["tools"] }
oxpinyin-capi-marshal = { path = "../oxpinyin-capi-marshal" }
# The test drivers exercise the existing C facades through safe ownership
# adapters. These tools and adapters are absent from shipping builds.
oxpinyin-capi = { path = "../oxpinyin-capi", default-features = false, features = ["tools"] }
oxpinyin-zhuyin-capi = { path = "../oxpinyin-zhuyin-capi", default-features = false, features = ["tools"] }
oxpinyin-core = { workspace = true, features = ["tools"] }
oxpinyin-engine = { workspace = true, features = ["tools"] }
# pinyin_exact_compare2, shared with the table writers.
oxpinyin-data = { workspace = true }
# The pin's DBM files, written and read through the backend seam the data
# layer and datagen share.
oxpinyin-store = { workspace = true, features = ["tools"] }
# The storage text importer reuses the user store's pin-exact pronunciation
# count handling.
oxpinyin-user = { workspace = true, features = ["tools"] }
# The utilities' edge calls: GLib options and text, input streams, C stdio.
oxpinyin-input = { workspace = true, features = ["tools"] }
# The seven k-mixture-model operations on the pin's flexible-bigram
# container; the utilities under the pin's names parse options and load the
# system tables before calling them.
oxpinyin-kmm = { path = "../oxpinyin-kmm", default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
assert_fs = "1.1"
libc.workspace = true
regex = "1.13"
rstest = { version = "0.28", default-features = false }
sha2 = "0.11"
tempfile.workspace = true
