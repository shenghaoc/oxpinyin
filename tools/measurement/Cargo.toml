[package]
name = "oxpinyin-measurement"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false
doctest = false

[[bin]]
name = "bisect"
path = "src/bin/bisect.rs"

[[bin]]
name = "system-import-profile"
path = "src/bin/system_import_profile.rs"

[dependencies]
libloading = "0.9.1"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = "0.4.9"
# The safe posix_fadvise of PERF_PAGE_OUT.
rustix = { version = "1.1.5", features = ["fs"] }
# Real requests only. Linux builds require Valgrind's development headers.
valgrind-requests = { version = "1.2.0", default-features = false, features = ["act"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_LibraryLoader",
    "Win32_System_Performance", "Win32_System_SystemInformation",
    "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug",
    "Win32_System_WindowsProgramming",
] }
