[package]
name = "oxpinyin-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["/src/**"]
description = "The facade-orchestration layer shared by the pinyin and zhuyin C-ABI facades: instance/context state machines and the laws both facades already implement identically. The Rust interface is unstable."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
oxpinyin-core.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
oxpinyin-core = { workspace = true, features = ["test-hooks"] }
sha2.workspace = true

[features]
tools = ["oxpinyin-core/tools"]
# Forward the selected backend to core.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-core/kyotocabinet"]
bdb = ["oxpinyin-core/bdb"]
tkrzw = ["oxpinyin-core/tkrzw"]
