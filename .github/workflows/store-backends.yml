name: Store backends

# Backend coverage for the peer store backends on a rolling
# toolchain. The peers (Kyoto Cabinet, tkrzw, Berkeley
# DB) are equal implementations behind the store's trait surface;
# Berkeley DB is the workspace's default selection since 2026-09-20 (the
# analogue of a bare libpinyin ./configure); tkrzw was before that.
# Exactly one peer is compiled per
# build — the exactly-one-backend invariant is enforced at compile
# time by two `compile_error!` guards in `crates/oxpinyin-store/src/lib.rs`
# — so cross-peer equivalence is proven by running the SAME test
# suite through separate builds, one per peer.
#
# Six jobs:
#   - store-features is a matrix over the non-default peer backends
#     (Kyoto Cabinet and tkrzw). Each child
#     runs the workspace's backend-relevant crates (everything but the
#     backend-independent corpus, KMM, punctuation, and word packages)
#     under exactly ONE peer, on its
#     own runner, so the sweeps run in PARALLEL (fail-fast: false,
#     max-parallel: 4) instead of sequentially inside one job. Berkeley DB
#     has no child: it is the workspace default, and ci.yml's Linux test
#     job already runs the whole workspace under it. Every pass
#     decodes real queries through the fixture tables, not just the store's
#     own unit tests. The matrix value only selects one of the fixed,
#     repository-controlled cargo invocations (see the case in the test
#     step); no command is built from untrusted event input.
#   - backend-matrix is an INDEPENDENT job — it has no needs edge to the
#     matrix, so it schedules concurrently with all the backend children.
#     It runs `tools/store/backend-matrix.sh`, which proves the valid
#     peer selections each `cargo check --workspace` cleanly AND that
#     every one of the pairwise combinations plus the three-way
#     combination plus the zero-backend build is refused by the
#     exactly-one-backend `compile_error!` guards. This is what replaced
#     the old "cross-backend conformance in one binary" job, which is
#     architecturally impossible under exactly-one-backend. It then runs
#     `cargo doc --no-deps --workspace` once per peer, rustdoc warnings
#     denied.
#   - store-backends-gate is this workflow's aggregate status check. It runs
#     no tests; it only fails unless every backend child, the backend-matrix
#     job AND all three sanitizer jobs succeeded. Its display name tracks the
#     peer set. Berkeley DB is the workspace default, and the pure-Rust
#     peer left on 2026-09-20. The name is free to track the set because
#     main's only required status check is `ci-aggregate`; before
#     2026-09-08 the name was
#     held fixed because branch protection named this job directly.
#   - tkrzw-sanitizers, bdb-sanitizers and kc-sanitizers each run one
#     backend's gate through `tools/sanitize.sh <backend>`, the command
#     `just sanitize` runs locally, on the date-pinned nightly that
#     tools/sanitize.sh names: the tkrzw suite under ASan
#     (`tools/tkrzw/run-sanitizers.sh`), the Berkeley DB suite under ASan
#     plus the C call-pattern harnesses under ASan+UBSan
#     (`tools/bdb/run-sanitizers.sh`), and the Kyoto Cabinet suite under
#     ASan + LeakSanitizer (`tools/kc/run-sanitizers.sh`). Each feeds
#     store-backends-gate, so a finding turns that check red. On a
#     BerkeleyDB distro the system bigram.db is BDB and every session
#     opens it through that FFI, so the instrumentation is load-bearing,
#     not precautionary.
#
# Every check in this workflow is advisory: branch protection requires only
# ci.yml's `ci-aggregate`, which does not depend on any job here. A red
# result here does not block a merge on its own; read it before merging.
#
# ROLLING TOOLCHAIN, deliberately unpinned: the jobs run inside
# debian:testing because oxpinyin aims to be a viable libpinyin
# replacement, and building on the newest toolchain distros actually ship
# is a property under test, not an accident — libpinyin's own
# make-check.yml does the same. Debian Testing is the mother distro of
# one of the two major Linux ecosystems (Ubuntu and derivatives descend
# from it); RHEL, the other ecosystem's root, is the primary development
# platform, so CI on Debian Testing covers both lineages. Do NOT pin
# this image by digest or let a later change "stabilise" it. libtkrzw
# comes from libtkrzw-dev: part of the rolling build environment,
# recorded by the provenance step below.
#
# The pin-built oracle and the model20 archive are deliberately NOT CI
# concerns: provisioning them (tools/model/fetch-model.sh,
# tools/oracle/build-oracle.sh) is a LOCAL workflow, and no CI job may
# download model20.text.tar.gz or anything like it. The oracle-gated
# differentials and the model cache live on developer machines only.

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/store-backends.yml
      # Direct inputs: every child decodes the fixture tables;
      # backend-matrix runs tools/store/backend-matrix.sh; the sanitizer
      # jobs run tools/sanitize.sh, which runs
      # tools/{bdb,kc,tkrzw}/run-sanitizers.sh (the tkrzw script also
      # sources tools/cloud/env.sh and tools/bisection/oracle-cell.sh);
      # every job runs the bootstrap composite action.
      - fixtures/**
      - tools/store/**
      - tools/kc/**
      - tools/bdb/**
      - tools/tkrzw/**
      - tools/sanitize.sh
      - tools/cloud/env.sh
      - tools/bisection/oracle-cell.sh
      - .github/actions/**
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/store-backends.yml
      # Direct inputs: every child decodes the fixture tables;
      # backend-matrix runs tools/store/backend-matrix.sh; the sanitizer
      # jobs run tools/sanitize.sh, which runs
      # tools/{bdb,kc,tkrzw}/run-sanitizers.sh (the tkrzw script also
      # sources tools/cloud/env.sh and tools/bisection/oracle-cell.sh);
      # every job runs the bootstrap composite action.
      - fixtures/**
      - tools/store/**
      - tools/kc/**
      - tools/bdb/**
      - tools/tkrzw/**
      - tools/sanitize.sh
      - tools/cloud/env.sh
      - tools/bisection/oracle-cell.sh
      - .github/actions/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: store-backends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-features:
    # One matrix child per non-default backend, each on its own runner:
    # every such backend is
    # exercised through the backend-relevant workspace (the seven
    # backend-independent training crates are excluded — see the test
    # step) — a backend that "passes" only in the store's own unit tests
    # and never reaches the decode path does not count. The
    # alternate-backend children name the store's feature with
    # member/feature syntax because the root manifest is virtual. The
    # children run in parallel; the historical single-job serialisation of
    # these sweeps is gone.
    name: store backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    strategy:
      # fail-fast: false so one backend's failure does not cancel the other
      # children — every backend's result is reported independently.
      fail-fast: false
      max-parallel: 4
      matrix:
        backend:
          - kyotocabinet
          - tkrzw

    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bootstrap cluster (safe.directory, pinned toolchain, cache
      # restore) in one call right after the inline checkout; the
      # clippy/rustfmt components preserve the toolchain shape this job
      # always installed. Each backend child
      # gets a distinct cache identity via the extra key; without it the
      # feature configurations would contend one automatic key. Each
      # runner has its own isolated checkout and target dir — no shared
      # writable target across the matrix.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: store-backend-${{ matrix.backend }}

      - name: Install build dependencies (apt)
        # Every matrix child installs the full set so each lane is
        # self-contained regardless of scheduling order; the marginal apt
        # cost is deliberate (correctness over shaving install seconds).
        # libtkrzw-dev: the explicit tkrzw child builds against the
        # distro library through pkg-config.
        # libclang-dev: bindgen's runtime dependency for generating the
        # tkrzw and Kyoto Cabinet FFI declarations from their headers.
        # Debian's libtkrzw-dev builds tkrzw with compression, so tkrzw.pc
        # demands -llzma -llz4 -lzstd -lz at link time; their -dev packages
        # must be present or every final link dies.
        # libkyotocabinet-dev: the explicit kyotocabinet child links the
        # distro Kyoto Cabinet; bindgen reads kclangc.h at build time.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libkyotocabinet-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev

      # This child runs exactly one of the fixed cargo invocations, selected
      # by the matrix backend through a case over a closed set (fail-closed
      # default). The matrix value is bound to a plain shell variable via env
      # indirection — ${{ }} inside a run: body is a template-injection
      # surface — and never spliced into a command.
      #
      # Corpus, KMM, punctuation, and word remain backend-independent and
      # run once per PR in ci.yml's full test job. The consolidated training
      # package stays in this matrix: its segment, eval, and trainer stages
      # use the selected store backend, and the other stage modules compile
      # against that same selection.
      # What stays is everything a backend choice can change: the store
      # itself, the user store, data readers, datagen writers, runtime,
      # engine, facade, both C ABIs, dictool, the oracle harness, and the
      # training package (segment, eval, train modules).
      - name: Test the workspace under this backend
        id: backend-test
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          excludes=(
            --exclude oxpinyin-corpus
            --exclude oxpinyin-kmm
            --exclude oxpinyin-punct
            --exclude oxpinyin-word
          )
          case "$BACKEND" in
          # `--features <peer>` at `--workspace` scope enables that
          # feature on every workspace member that declares it, so the
          # peer selection cascades through each consumer's own
          # `<peer> = ["oxpinyin-store/<peer>", ...]` forwarder. A
          # bare passthrough (`--features oxpinyin-store/<peer>`) does
          # NOT — cargo features do not back-propagate — and would
          # leave each consumer's own `#[cfg(feature = "<peer>")]`
          # code (e.g. `user_store_tests!(<peer>, ...)` in
          # oxpinyin-user, the `Backend::<Peer>::write()` arm in
          # oxpinyin-datagen) skipped even while `DefaultStore`
          # resolves to the peer. The bare-name form here is the
          # documented public interface — see
          # `docs/findings/backend-selection-audit.md`. The
          # exactly-one-backend invariant is unchanged; the
          # `backend-matrix` job proves it separately.
          kyotocabinet)
            echo "--- kyotocabinet (explicit) ---"
            cargo test --locked --workspace --no-default-features --features kyotocabinet "${excludes[@]}"
            ;;
          tkrzw)
            echo "--- tkrzw (explicit) ---"
            cargo test --locked --workspace --no-default-features --features tkrzw "${excludes[@]}"
            ;;
          *)
            echo "FAIL: unknown matrix.backend value '$BACKEND'" >&2
            exit 2
            ;;
          esac
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## store backend (${BACKEND})"
            echo ""
            echo "Result: **$([ '${{ job.status }}' = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "Backend-relevant workspace sweep under the ${BACKEND} backend only."
            echo ""
            echo "| Backend | Wall clock |"
            echo "|---|---:|"
            echo "| ${BACKEND} | ${{ steps.backend-test.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-matrix:
    # Replaces the historical `store-conformance` job. Under
    # exactly-one-backend the "one binary with three backends compiled
    # in" build is architecturally impossible (a `compile_error!` in
    # `crates/oxpinyin-store/src/lib.rs` refuses it), so the same
    # `tools/store/backend-matrix.sh` script that developers run locally
    # runs here instead: it proves the valid peer selections each
    # `cargo check --workspace` cleanly AND that every pairwise
    # combination, the all-peers combination, and the
    # zero-backend build are refused by the guards.
    #
    # Independent job: no needs edge to store-features, so it runs
    # concurrently with the backend children.
    name: backend-matrix (exactly-one-backend gate)
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same bootstrap cluster as the matrix children; the distinct cache
      # key separates the exactly-one-backend matrix from every backend
      # child's identity.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: backend-matrix

      - name: Install build dependencies (apt)
        # The matrix `cargo check`s the valid peer selections in
        # turn, so it needs every peer's build-time C dependencies:
        # libkyotocabinet-dev + libtkrzw-dev (+ its compression -dev
        # packages) + libdb-dev, and libclang-dev for
        # bindgen, which generates the C backends' declarations.
        # libglib2.0-dev is a Tier-C
        # requirement: `pinyin_lookup_tokens` /
        # `pinyin_token_get_nth_pronunciation` delegate to
        # `g_array_append_vals` / `g_array_set_size`, so the shipped
        # `.so` NEEDS `libglib-2.0`.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libkyotocabinet-dev libtkrzw-dev libdb-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev

      - name: Exactly-one-backend invariant (backend-matrix pass)
        id: matrix-test
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          tools/store/backend-matrix.sh
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      # Rustdoc for the whole workspace under each backend with every warning
      # denied. The store's crate docs linked all three backend types, and
      # each exists under only its own feature, so every build had two
      # broken intra-doc links while no job built rustdoc with warnings
      # denied (#1129). This job installs every peer's build-time C
      # dependencies. The workspace's remaining diagnostics were fixed in
      # #1136, so the step covers every crate, not just the store. The loop
      # runs a closed set of repository-controlled feature names.
      - name: Document the workspace under each backend (rustdoc warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          for backend in bdb kyotocabinet tkrzw; do
            echo "--- cargo doc: ${backend} ---"
            cargo doc --locked --no-deps --workspace --no-default-features --features "${backend}"
          done

      - name: Report
        if: always()
        run: |
          {
            echo "## backend-matrix (exactly-one-backend gate)"
            echo ""
            echo "Result: **$([ '${{ job.status }}' = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "\`tools/store/backend-matrix.sh\` — proves the valid"
            echo "peer selections each \`cargo check --workspace\` cleanly and"
            echo "that every multi-peer combination plus the zero-backend"
            echo "build is refused by the exactly-one-backend guards."
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| backend-matrix (workspace-check pass) | ${{ steps.matrix-test.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  store-backends-gate:
    # Aggregate status check (advisory; see the header). The display name lists the peers
    # and is extended as peers land (bdb, 2026-09-12); it is no longer
    # pinned to a historical string, because main's required context is
    # `ci-aggregate` rather than this job. It
    # builds and tests nothing; it only aggregates the results of the
    # backend children and the backend-matrix job via the
    # documented `needs.<job>.result` semantics. For a matrix upstream,
    # that result is success only when EVERY matrix child succeeded, and
    # failure if any child failed — so this gate is red unless every
    # non-default peer build, the exactly-one-backend gate and all three
    # sanitizer jobs are green.
    name: store backends (kyotocabinet / tkrzw / bdb)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - store-features
      - backend-matrix
      - tkrzw-sanitizers
      - bdb-sanitizers
      - kc-sanitizers
    defaults:
      run:
        shell: bash
    steps:
      - name: Aggregate the backend, matrix and sanitizer results
        # Job results are bound through env rather than spliced into the
        # script body; the values are the closed set
        # success/failure/cancelled/skipped.
        env:
          FEATURES_RESULT: ${{ needs.store-features.result }}
          MATRIX_RESULT: ${{ needs.backend-matrix.result }}
          SANITIZER_RESULT: ${{ needs.tkrzw-sanitizers.result }}
          BDB_SANITIZER_RESULT: ${{ needs.bdb-sanitizers.result }}
          KC_SANITIZER_RESULT: ${{ needs.kc-sanitizers.result }}
        run: |
          set -euo pipefail
          echo "store-features (matrix): ${FEATURES_RESULT}"
          echo "backend-matrix:          ${MATRIX_RESULT}"
          echo "tkrzw-sanitizers:        ${SANITIZER_RESULT}"
          echo "bdb-sanitizers:          ${BDB_SANITIZER_RESULT}"
          echo "kc-sanitizers:           ${KC_SANITIZER_RESULT}"
          {
            echo "## store backends (aggregate gate)"
            echo ""
            echo "This job runs no tests. It is this workflow's advisory"
            echo "aggregate check: it fails unless every peer matrix child, the"
            echo "exactly-one-backend gate AND all three sanitizer jobs succeeded."
            echo ""
            echo "| Upstream job | Result |"
            echo "|---|---|"
            echo "| store-features (matrix, every peer) | ${FEATURES_RESULT} |"
            echo "| backend-matrix (exactly-one-backend gate) | ${MATRIX_RESULT} |"
            echo "| tkrzw-sanitizers (ASan) | ${SANITIZER_RESULT} |"
            echo "| bdb-sanitizers (ASan + UBSan) | ${BDB_SANITIZER_RESULT} |"
            echo "| kc-sanitizers (ASan + LSan) | ${KC_SANITIZER_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${FEATURES_RESULT}" != "success" ] || [ "${MATRIX_RESULT}" != "success" ] || [ "${SANITIZER_RESULT}" != "success" ] || [ "${BDB_SANITIZER_RESULT}" != "success" ] || [ "${KC_SANITIZER_RESULT}" != "success" ]; then
            echo "::error::store-backends gate failed: store-features=${FEATURES_RESULT}, backend-matrix=${MATRIX_RESULT}, tkrzw-sanitizers=${SANITIZER_RESULT}, bdb-sanitizers=${BDB_SANITIZER_RESULT}, kc-sanitizers=${KC_SANITIZER_RESULT}" >&2
            exit 1
          fi
          echo "store-backends gate: all upstream jobs succeeded"

  tkrzw-sanitizers:
    # The tkrzw backend passes Rust callbacks into tkrzw's visitor dispatch
    # (db_get/db_scan install Process-full visitors handing borrowed key/value
    # records to Rust fn pointers valid only for the callback). Panic-unwinding
    # across that FFI boundary and borrow-escape of those records are the live
    # hazards, so the feature's own test surface runs under ASan and any
    # finding kills the job. There are no compiled C/C++ translation units —
    # the backend is pure bindgen over tkrzw_langc.h — so ASan instruments
    # the Rust side of the FFI. A UBSan arm ran here until 2026-10-22; with
    # no C targets and no rustc `undefined` sanitizer it instrumented
    # nothing, and it was removed.
    name: tkrzw FFI under address
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires syscall leeway no other job here needs: Docker's
      # default seccomp profile blocks personality(2), which turned setarch's
      # ASLR-off ASan wrapper into EPERM on the previous run. Unconfining
      # seccomp for THIS job alone restores standard sanitizer setups;
      # everything else stays under stock confinement.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    # Feeds store-backends-gate since 2026-09-08 (it had been
    # continue-on-error and outside that gate). Like every check in this
    # workflow it is advisory: only ci.yml's `ci-aggregate` is required.

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same root-owned-checkout caveat as the store-features job. The
      # nightly toolchain below stays bespoke (sanitizer builds need
      # nightly, not the pinned channel), and rust-cache stays off on
      # purpose — see the note above the gate step.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'

      # The sanitizer nightly lives in tools/sanitize.sh (NIGHTLY=), which
      # every backend script reads. RUSTUP_TOOLCHAIN beats
      # rust-toolchain.toml's channel pin for this job only.
      - name: Select the sanitizer nightly
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^NIGHTLY=//p' tools/sanitize.sh)" >> "$GITHUB_ENV"

      - name: Install build dependencies (apt)
        # On Debian, libasan ships with gcc and is not a separate package.
        # libtkrzw-dev provides the distro library the backend links
        # against; libclang-dev is bindgen's runtime dependency.
        # tkrzw-utils: with no setup.sh environment here, the gate trusts
        # the distro libtkrzw only after tools/tkrzw/distro-probe.sh, which
        # runs tkrzw_dbm_util, passes it (Ubuntu's build fails that probe).
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libclang-dev libtkrzw-dev tkrzw-utils liblzma-dev liblz4-dev libzstd-dev zlib1g-dev

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          # Visible to THIS step too: GITHUB_PATH only applies to later steps.
          . "$HOME/.cargo/env"
          rustc --version

      # No rust-cache here on purpose: the store crate compiles in seconds;
      # a separate sanitizer-flavored cache entry would be pure book-keeping.
      # (Rust-cache hashes RUSTFLAGS into its key anyway, so even a future
      # enablement cannot cross-contaminate the unsanitized dep store.)
      # tools/tkrzw/run-sanitizers.sh carries the flags and their reasons.
      - name: Run the tkrzw sanitizer gate
        id: sanitize-tests
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          bash tools/sanitize.sh tkrzw
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## tkrzw-sanitizers (address)"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  bdb-sanitizers:
    # The Berkeley DB feature's own suite under ASan, plus the C
    # call-pattern harnesses under ASan+UBSan, via the same
    # tools/bdb/run-sanitizers.sh developers run locally. The hazards
    # are the DBT plumbing and cursor buffers (Rust, ASan) and the
    # SingleGram chunk arithmetic the C harness mirrors (ASan+UBSan —
    # rustc has no `undefined` sanitizer, so the C half is where UBSan
    # has something to instrument). On a BerkeleyDB distro the system
    # bigram.db is BDB and every session opens it through this FFI, so
    # the lane feeds store-backends-gate like tkrzw-sanitizers does
    # (advisory, like every check in this workflow).
    #
    # debian:testing deliberately unpinned like every job here. The
    # harness half needs libdb-dev (the system libdb the backend links
    # and the -ldb it compiles against) and gcc for the C probes.
    name: bdb backend sanitizers
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires the same seccomp leeway as the tkrzw lane above.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'

      # Same nightly source as the tkrzw lane above.
      - name: Select the sanitizer nightly
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^NIGHTLY=//p' tools/sanitize.sh)" >> "$GITHUB_ENV"

      - name: Install build dependencies (apt)
        # libdb-dev resolves to libdb5.3-dev — the system libdb this
        # backend binds (and whose db.h bindgen reads); libclang-dev is
        # bindgen's runtime dependency; gcc builds the C harnesses.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libclang-dev libdb-dev

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustc --version

      - name: Run the bdb sanitizer gate
        id: sanitize-tests
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          bash tools/sanitize.sh bdb
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## bdb-sanitizers"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite + C harnesses | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  kc-sanitizers:
    # The Kyoto Cabinet feature's own suite under ASan + LeakSanitizer, via
    # tools/sanitize.sh kc. The backend's hazard is ownership: kcdbget,
    # kccurgetkey, kccurgetvalue and kccurget return caller-owned regions
    # released with kcfree, so a leak, a double free or a free through the
    # wrong allocator is what ASan and LSan see. Fedora and Arch ship this
    # backend. Feeds store-backends-gate (advisory, like every check here).
    name: kc backend sanitizers
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires the same seccomp leeway as the tkrzw lane above.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
