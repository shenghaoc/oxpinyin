name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Five jobs:
#   lint — rustfmt + clippy
#   test — cargo test for the whole workspace, and the portable crates on
#          macOS and Windows
#   python — the oxpinyin Python binding on a free-threaded interpreter:
#            wheel build, binding tests, and native-vs-Python parity against
#            the corpus transcript
#   deny — supply-chain gate: RustSec advisories, licenses, sources,
#          duplicate-version drift (docs/safety/oxpinyin-safety-profile.md
#          layer 6)
#   fuzz — bounded parser fuzz smoke test on a pinned nightly/tool version

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace
      - name: C++ pinyin.h smoke gate
        run: tools/bisection/run-cpp-smoke.sh
      # The post-choose live-typing/train differential (sentence-surface's
      # §3 machinery). Self-skips unless the pin-built oracle
      # (PINYIN_ORACLE_PREFIX) and a real-unigram system dir
      # (LIVETYPING_SYSTEM) are present — runner-local only: the model20
      # archive is non-redistributable and never enters CI, so this and
      # every model20-dependent check (oxpinyin-datagen's strict tests,
      # sentence-surface parity) run on a provisioned local machine, never
      # on GitHub-hosted runners.
      - name: Live-typing differential
        run: tools/bisection/run-live-typing-diff.sh

  # The Python binding: build the real extension (no mocks), run its pytest
  # suite, which regenerates the pure-Rust transcript via `native-dump` and
  # compares it against the binding's replay of the same corpus. Runs on a
  # free-threaded interpreter, which is what makes the shared-engine
  # thread-safety test mean anything; see the version selector below.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Free-threaded is the platform this binding is written for, so it
          # is the one the binding is tested on. `Engine.lookup` detaches the
          # GIL before it takes the shared-engine mutex, so
          # `test_shared_engine_is_thread_safe` contends that mutex even under
          # a GIL; free-threaded is what additionally lets the Python-side
          # worker loop run concurrently rather than serialised behind the GIL.
          #
          # `3.14t` is setup-python's free-threaded spelling: the `t` suffix
          # combines with x.y, x.y.z or x.y-dev. 3.14 has shipped, so this
          # resolves to the current stable 3.14.x without
          # `allow-prereleases`.
          python-version: '3.14t'
      - name: Verify free-threaded build
        # A silent fallback to a GIL build would leave this job green while
        # proving none of what it exists to prove, so this gates rather than
        # merely logging. `sys._is_gil_enabled` only exists from 3.13, so it
        # is probed rather than called outright — a pre-3.13 fallback is
        # exactly what this guards against, and it should report that rather
        # than raise AttributeError.
        run: |
          python -c "
          import sys, sysconfig
          gil = getattr(sys, '_is_gil_enabled', None)
          disabled = sysconfig.get_config_var('Py_GIL_DISABLED')
          if gil is None or gil() or not disabled:
              raise SystemExit('Expected free-threaded build; got GIL-enabled or pre-3.13')
          print(f'ok: {sys.version}, Py_GIL_DISABLED={disabled}')
          "
      - name: Lint the binding feature set
        run: cargo clippy --locked -p oxpinyin-python --features bindings --all-targets -- -D warnings
      - name: Build and install the wheel
        working-directory: crates/oxpinyin-python
        # Pinned to the versions validated locally. --no-build-isolation makes
        # the build use this exact maturin instead of resolving its own from
        # the build-system requires range (>=1.14,<2) in an isolated env; that
        # range only bounds human-driven builds.
        run: |
          pip install maturin==1.15.0 pytest==9.1.1
          pip install --no-build-isolation .
      - name: Rust runtime tests
        run: cargo test --locked -p oxpinyin-python
      - name: Binding tests and native-vs-Python parity
        working-directory: crates/oxpinyin-python
        run: pytest -q

  # The portable crates on the other two supported operating systems.
  # structure.md marks core/data/user/engine portable; the oracle harness is
  # portable too with its Linux-only `oracle-ffi` feature off, and it carries
  # the graph and decode-level differentials. capi/oracle-ffi stay Linux-first
  # and are covered by the job above.
  test-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >
          cargo test --locked
          -p oxpinyin-core -p oxpinyin-data -p oxpinyin-user -p oxpinyin-engine
      # Separately and with --no-default-features, so oracle-ffi stays off even
      # if it ever became a default feature. It links the pin-built libpinyin
      # and is Linux-only; on this runner it would not build at all.
      - run: cargo test --locked -p pinyin-oracle --no-default-features

  # Supply-chain gate. cargo-deny's advisories check consumes the same
  # RustSec DB cargo-audit uses, so this one job replaces both tools; the
  # policy (allow-lists, deviation registry with review-by dates) lives in
  # deny.toml. The binary is downloaded pinned rather than `cargo install`ed
  # to keep the job under a minute.
  #
  # Debian Testing container in the store-backends.yml style: the supply
  # chain is checked on the rolling toolchain distros actually ship, and
  # the image is deliberately unpinned for the same reason (see that
  # workflow's header).
  deny:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # cargo-deny shells out to `cargo metadata`, so a cargo binary is
      # required; minimal profile suffices (nothing here compiles code).
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - name: Install pinned cargo-deny
        run: |
          ver=0.20.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -sSfL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz
          mkdir -p ~/.local/bin
          install -m755 "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Default-feature tree first, then the feature-gated dependency
      # subtrees (lmdb/tkrzw, oracle-ffi). --locked pins both graphs to
      # the committed lockfiles. The fuzz workspace has its own lock and
      # its own graph (libfuzzer-sys), checked the same way.
      - run: cargo deny --locked --log-level error check
      - run: cargo deny --locked --all-features --log-level error check
      - run: cargo deny --locked --log-level error --manifest-path fuzz/Cargo.toml check
      # The RUSTSEC-2025-0141 (bincode) ignore in deny.toml is justified
      # by the heed-types path behind the non-default `lmdb` feature.
      # ignores are global, so assert the default graph stays bincode-free:
      # if bincode ever leaks into the default build, this fails loudly
      # instead of being silently masked by the ignore entry.
      - name: Assert the default graph is bincode-free
        run: |
          if cargo tree --workspace -i bincode >/dev/null 2>&1; then
            echo '::error::bincode is reachable in the default dependency graph; the RUSTSEC-2025-0141 ignore covers the lmdb path only' >&2
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly with Rust sources
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify fuzz lockfile
        run: cargo +nightly-2026-08-01 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Run bounded parser fuzz pass
        run: cargo +nightly-2026-08-01 fuzz run parser -- -max_total_time=10 -timeout=5 -max_len=4096
