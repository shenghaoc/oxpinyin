name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Four jobs:
#   lint — rustfmt + clippy
#   test — cargo test for the whole workspace, and the portable crates on
#          macOS and Windows
#   python — the oxpinyin Python binding on a free-threaded interpreter:
#            wheel build, binding tests, and native-vs-Python parity against
#            the corpus transcript
#   fuzz — bounded parser fuzz smoke test on a pinned nightly/tool version

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace
      - name: C++ pinyin.h smoke gate
        run: tools/bisection/run-cpp-smoke.sh
      # The post-choose live-typing/train differential (sentence-surface's
      # §3 machinery). Self-skips unless the pin-built oracle
      # (PINYIN_ORACLE_PREFIX) and a real-unigram system dir
      # (LIVETYPING_SYSTEM) are present — runner-local only: the model20
      # archive is non-redistributable and never enters CI, so this and
      # every model20-dependent check (oxpinyin-datagen's strict tests,
      # sentence-surface parity) run on a provisioned local machine, never
      # on GitHub-hosted runners.
      - name: Live-typing differential
        run: tools/bisection/run-live-typing-diff.sh

  # The Python binding: build the real extension (no mocks), run its pytest
  # suite, which regenerates the pure-Rust transcript via `native-dump` and
  # compares it against the binding's replay of the same corpus. Runs on a
  # free-threaded interpreter, which is what makes the shared-engine
  # thread-safety test mean anything; see the version selector below.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Free-threaded. `test_shared_engine_is_thread_safe` is
          # near-vacuous under a GIL — the interpreter serialises the worker
          # loop, so the shared-engine lock is never actually contended — and
          # free-threaded is the platform this binding is written for, so it
          # is the one the binding is tested on.
          #
          # `3.14t` is setup-python's free-threaded spelling: the `t` suffix
          # combines with x.y, x.y.z or x.y-dev. 3.14 has shipped, so this
          # resolves to the current stable 3.14.x without
          # `allow-prereleases`.
          python-version: '3.14t'
      - name: Verify free-threaded build
        # A silent fallback to a GIL build would leave this job green while
        # proving none of what it exists to prove, so this gates rather than
        # merely logging. `sys._is_gil_enabled` only exists from 3.13, so it
        # is probed rather than called outright — a pre-3.13 fallback is
        # exactly what this guards against, and it should report that rather
        # than raise AttributeError.
        run: |
          python -c "
          import sys, sysconfig
          gil = getattr(sys, '_is_gil_enabled', None)
          disabled = sysconfig.get_config_var('Py_GIL_DISABLED')
          if gil is None or gil() or not disabled:
              raise SystemExit('Expected free-threaded build; got GIL-enabled or pre-3.13')
          print(f'ok: {sys.version}, Py_GIL_DISABLED={disabled}')
          "
      - name: Lint the binding feature set
        run: cargo clippy --locked -p oxpinyin-python --features bindings --all-targets -- -D warnings
      - name: Build and install the wheel
        working-directory: crates/oxpinyin-python
        # Pinned to the versions validated locally; build-system requires
        # only bounds maturin for human-driven builds (>=1.8,<2).
        run: |
          pip install maturin==1.15.0 pytest==9.1.1
          pip install .
      - name: Rust runtime tests
        run: cargo test --locked -p oxpinyin-python
      - name: Binding tests and native-vs-Python parity
        working-directory: crates/oxpinyin-python
        run: pytest -q

  # The portable crates on the other two supported operating systems.
  # structure.md marks core/data/user/engine portable; the oracle harness is
  # portable too with its Linux-only `oracle-ffi` feature off, and it carries
  # the graph and decode-level differentials. capi/oracle-ffi stay Linux-first
  # and are covered by the job above.
  test-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >
          cargo test --locked
          -p oxpinyin-core -p oxpinyin-data -p oxpinyin-user -p oxpinyin-engine
      # Separately and with --no-default-features, so oracle-ffi stays off even
      # if it ever became a default feature. It links the pin-built libpinyin
      # and is Linux-only; on this runner it would not build at all.
      - run: cargo test --locked -p pinyin-oracle --no-default-features

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly with Rust sources
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify fuzz lockfile
        run: cargo +nightly-2026-08-01 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Run bounded parser fuzz pass
        run: cargo +nightly-2026-08-01 fuzz run parser -- -max_total_time=10 -timeout=5 -max_len=4096
