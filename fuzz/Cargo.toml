[package]
name = "oxpinyin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# The fuzz workspace does not inherit the root workspace's lints (separate
# workspace). deny rather than forbid: future FFI-driving harnesses (the
# planned capi-commands target) carry scoped unsafe with SAFETY comments.
[lints.rust]
unsafe_code = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
oxpinyin-core = { path = "../crates/oxpinyin-core" }
# dict-loader: hostile bytes through the table decoder (audit F-3 class).
oxpinyin-data = { path = "../crates/oxpinyin-data" }
# capi-commands: stateful session fuzzer over the C ABI (libchewing
# fuzzer.rs shape). Linux-only, matching the fuzz CI job — as is capi.
oxpinyin-capi = { path = "../crates/oxpinyin-capi", features = ["fuzz-api"] }
# fixture-model: the fixture Dictionary/LanguageModel doubles live in the
# test-support crate, not oxpinyin-core (core defines the traits; testsupport
# holds the in-memory test implementations).
oxpinyin-testsupport = { path = "../crates/oxpinyin-testsupport" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dict-loader"
path = "fuzz_targets/dict_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixture-model"
path = "fuzz_targets/fixture_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "double-pinyin"
path = "fuzz_targets/double_pinyin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi-commands"
path = "fuzz_targets/capi_commands.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
