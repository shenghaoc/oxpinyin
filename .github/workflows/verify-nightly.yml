name: verify-nightly

# Scheduled verification: the checks too slow for the PR gate. The merge
# conditions are docs/runbooks/verification.md, section 10. Findings here
# open issues. Nothing here blocks a merge, because branch protection
# requires only ci.yml's `ci-aggregate`.
#
# Jobs: fuzz-soak, overflow-lane, coverage (coverage.yml, advisory),
# test-windows and test-macos.
# No job may fail: there are no continue-on-error jobs.
#
# Every Linux job runs in a debian:testing container in the
# store-backends.yml style (test-windows runs on windows-2025,
# test-macos on macos-26): the nightly lanes exist to surface drift early, and the rolling
# distro toolchain is part of what they exercise. The image is
# deliberately unpinned — do not "stabilise" it.
# The oracle is never built or run on GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the full Windows workspace job
        type: boolean
        default: false
      macos_only:
        description: Run only the macOS workspace job
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One group per ref: the schedule always runs on main, so scheduled runs
# still queue behind each other, and a dispatch on a branch does not
# displace them.
concurrency:
  group: verify-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-soak:
    # Skipped by a windows_only or macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only && !inputs.macos_only }}
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). Pinned, not ubuntu-latest, so a runner-image
    # move (26.04: actions/runner-images#14748) happens here under review.
    runs-on: &ubuntu ubuntu-26.04
      # Same ASan leeway as the tkrzw sanitizer job in store-backends.yml:
      # Docker's default seccomp profile blocks personality(2), which the
      # setarch ASLR-off wrapper below needs.
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # The override the comment above exists for: without it Docker's
      # default seccomp profile blocks personality(2) and setarch -R dies
      # with EPERM before any target runs.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libglib2.0-dev util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw
      # One nightly toolchain serves both cargo-fuzz's build and the runs
      # (cargo install works on nightly; no second toolchain needed).
      # fuzz/rust-toolchain.toml names it, with rust-src. rustup reads that
      # file for a command run in fuzz/, so each cargo step below runs there
      # and no step names the nightly. No default toolchain is installed.
      - name: Install the pinned nightly with Rust sources
        working-directory: fuzz
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install
      # Exact on purpose: cargo-fuzz passes unstable flags to the pinned nightly above, so the two move together.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
        working-directory: fuzz
      # Fuzzing memory, half one: the corpora persist across nightly runs
      # (latest-wins — the run-id key always misses so every run saves,
      # the prefix restore-key always loads the newest save), so a soak
      # starts where the last one ended instead of from the single
      # committed seed. Restored before seeding: the seed step re-copies
      # its fixture inputs over whatever the cache brought back.
      - name: Restore the accumulated fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Seed corpora
        run: |
          shopt -s nullglob
          seeds=(fixtures/w3/*.bin)
          mkdir -p fuzz/corpus/dict-loader
          if [ ${#seeds[@]} -gt 0 ]; then
            cp "${seeds[@]}" fuzz/corpus/dict-loader/
          else
            echo '::warning::no fixtures/w3 .bin seeds found; dict-loader starts from an empty corpus'
          fi
      - name: Soak each target
        # Every target runs even if an earlier one fails; the accumulated
        # status is the step's exit code. -print_final_stats leaves the
        # coverage/edge counters in the log so a soak that explored
        # nothing is visible as one, not just green.
        working-directory: fuzz
        run: |
          mapfile -t targets < <(cargo fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # setarch -R disables ASLR for the process tree: runner
            # kernels' mmap entropy exceeds ASan's shadow mapping, and an
            # unprivileged container cannot lower vm.mmap_rnd_bits itself
            # (same rationale as store-backends.yml's sanitizer job).
            if ! setarch "$(uname -m)" -R cargo fuzz run "$target" -- -max_total_time=180 -timeout=15 -max_len=4096 -print_final_stats=1; then
              status=1
              echo "::error::fuzz target $target failed"
            fi
            echo "::endgroup::"
          done
          exit $status
      # Fuzzing memory, half two: a crash survives the runner as an
      # artifact (cargo-fuzz writes crash-* inputs under
      # fuzz/artifacts/<target>/), not as a log line that dies with the
      # job.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/

  # Latent-overflow lane: the release-optimized codepath with overflow
  # checks and debug assertions forced on — the "NDEBUG question" as CI,
  # not as shipped configuration.
  overflow-lane:
    # Skipped by a windows_only or macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only && !inputs.macos_only }}
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C overflow-checks=y -C debug-assertions=y -D warnings
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libkyotocabinet-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
      - run: cargo test --locked --workspace --release --no-default-features --features kyotocabinet

  # Coverage floor: the nightly caller of the reusable job in coverage.yml,
  # which has no pull request trigger. Called here unconditionally so the
  # whole-tree number is measured nightly. The floor and its history live
  # in that file.
  coverage:
    # Skipped by a windows_only or macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only && !inputs.macos_only }}
    uses: ./.github/workflows/coverage.yml

  # The full Windows workspace: clippy and the tests over the workspace
  # less WINDOWS_EXCLUDES, built with MSVC
  # and the tkrzw action, and GLib from vcpkg. It runs every night and on
  # manual dispatch; section 10 makes it best-effort and never a PR merge
  # condition (docs/runbooks/verification.md). Not skipped by windows_only;
  # skipped by macos_only.
  test-windows:
    # Skipped by a macos_only dispatch; runs on the schedule.
    if: ${{ !inputs.macos_only }}
    runs-on: windows-2025
    timeout-minutes: 45
    # windows-2025 defaults every `run:` to pwsh; every step here is bash
    # (`>> "$GITHUB_ENV"`, `sha256sum`), which under pwsh would write nowhere.
    defaults:
      run:
        shell: bash
    # ci.yml set these at workflow level; this workflow sets none.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      # bindgen reads tkrzw_langc.h through the runner's preinstalled LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # The package specs (port[features]:triplet) passed to `vcpkg install`,
      # space-separated. The binary cache key hashes this value, so adding a
      # port or feature here gives the cache a new key. The tkrzw action
      # installs pkgconf:x64-windows itself; it is listed so its build is
      # cached under the same key.
      VCPKG_PACKAGES: glib:x64-windows pkgconf:x64-windows
      # All workspace crates are in this lane. GLib supplies the tools
      # boundary. The C-ABI locale tests select the Windows UTF-8 locale;
      # text expectations use the host newline. KMM's native tests pass.
      WINDOWS_EXCLUDES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rustup-components: clippy
          rust-cache: 'true'
          cargo-nextest: 'true'
          uv: 'true'
      - run: rustup show active-toolchain
      # vcpkg's binary cache, persisted across runs. vcpkg writes one zip per
      # built package, named by the package's ABI hash, to the files provider
      # below, and `vcpkg install` still runs every time: it computes each
      # ABI hash itself (port files, triplet, compiler, dependencies) and
      # restores only an archive whose hash matches, so a stale entry is
      # never used, only rebuilt. The installed tree is not cached.
      #
      # The vcpkg revision is the runner image's own checkout, read once in
      # the key step below. The cache key changes whenever an input to the
      # ABI hashes can: that revision (ports and baseline), the triplet, the
      # runner image (compiler and SDK), the requested package specs
      # (VCPKG_PACKAGES), and any vcpkg manifest, configuration, overlay or
      # triplet file in this repository (none today). The restore-keys fall
      # back to the newest entry for the same revision and image, then for
      # the same image OS and triplet; vcpkg's own hash check decides what in
      # it is reusable.
      #
      # Restore and save are separate steps. The save runs right after
      # `vcpkg install`, before the build and tests, so a red test run still
      # keeps the archives it built. It runs only on main and is skipped when
      # the restore matched the primary key exactly, because that entry
      # already exists. A branch dispatch restores main's entry through the
      # restore keys and writes nothing. The restore comes before the tkrzw
      # action, so its pkgconf install reads the cache too.
      - name: Compute the vcpkg binary cache key
        id: vcpkg-cache-key
        run: |
          set -euo pipefail
          if vcpkg_rev=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD 2>/dev/null); then
            echo "vcpkg revision: $vcpkg_rev"
          else
            vcpkg_rev=baseline-$(sha256sum "$VCPKG_INSTALLATION_ROOT/versions/baseline.json" | cut -c1-40)
            echo "vcpkg checkout has no git metadata; keyed on $vcpkg_rev"
          fi
          image="${ImageOS:?runner image OS unknown}-${ImageVersion:?runner image version unknown}"
          cache_dir="${RUNNER_TEMP//\\//}/vcpkg-binary-cache"
          mkdir -p "$cache_dir"
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache_dir,readwrite" >> "$GITHUB_ENV"
          packages=$(printf '%s' "$VCPKG_PACKAGES" | sha256sum | cut -c1-16)
          echo "vcpkg packages: $VCPKG_PACKAGES (key component $packages)"
          {
            echo "dir=$cache_dir"
            echo "prefix=vcpkg-bin-$ImageOS-x64-windows-"
            echo "key=vcpkg-bin-$ImageOS-x64-windows-$vcpkg_rev-$image"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-key.outputs.key }}-pkgs-${{ steps.vcpkg-cache-key.outputs.packages }}-manifest-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'triplets/**') || 'none' }}
          restore-keys: |
            ${{ steps.vcpkg-cache-key.outputs.key }}-
            ${{ steps.vcpkg-cache-key.outputs.prefix }}
      - name: Report the vcpkg binary cache restore
        env:
          REQUESTED_KEY: ${{ steps.vcpkg-cache-key.outputs.key }}-pkgs-${{ steps.vcpkg-cache-key.outputs.packages }}-manifest-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'triplets/**') || 'none' }}
          MATCHED_KEY: ${{ steps.vcpkg-cache-restore.outputs.cache-matched-key }}
        run: |
          printf 'vcpkg cache: requested=%s restored=%s image=%s/%s\n' \
            "$REQUESTED_KEY" "$MATCHED_KEY" "${ImageOS:?}" "${ImageVersion:?}"
      # nmake in the Visual Studio developer environment, a static tkrzw.lib
      # with the DLL C runtime, and a tkrzw.pc the store build script finds
      # through PKG_CONFIG_PATH (tools/tkrzw/build.py). It also installs
      # vcpkg's pkgconf and sets PKG_CONFIG to it.
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw
      # GLib for glib-sys (the C-ABI crates and the `tools` boundary).
      # glib-sys finds it through PKG_CONFIG, set by the tkrzw action, and
      # the installed tree's lib/pkgconfig, added here after the tkrzw build
      # on PKG_CONFIG_PATH; the DLL directory joins PATH for the test
      # binaries.
      - name: Install GLib (vcpkg)
        run: |
          set -euo pipefail
          read -ra specs <<< "$VCPKG_PACKAGES"
          vcpkg install "${specs[@]}"
          installed="${VCPKG_INSTALLATION_ROOT//\\//}/installed/x64-windows"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH;$installed/lib/pkgconfig" | tee -a "$GITHUB_ENV"
          echo "$installed/bin" >> "$GITHUB_PATH"
          PKG_CONFIG_PATH="$PKG_CONFIG_PATH;$installed/lib/pkgconfig" "$PKG_CONFIG" --modversion --cflags --libs glib-2.0
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache-key.outputs.dir }}
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}
      # The default backend, over the workspace less WINDOWS_EXCLUDES.
      # Clippy runs first, over the same set, so a lint in Windows-only
      # code fails here rather than nowhere.
      - name: Clippy (Windows)
        run: |
          read -ra excludes <<< "$WINDOWS_EXCLUDES"
          cargo clippy --locked --workspace --all-targets "${excludes[@]}" -- -D warnings
      - name: Provide the pinned system data
        uses: ./.github/actions/contract-data
      - run: |
          read -ra excludes <<< "$WINDOWS_EXCLUDES"
          cargo nextest run --locked --profile ci --status-level skip --workspace "${excludes[@]}"
      # nextest does not run doctests; keep the same exclusions.
      - run: |
          read -ra excludes <<< "$WINDOWS_EXCLUDES"
          cargo test --locked --doc --workspace "${excludes[@]}"

  # macOS links tkrzw from the tkrzw action. The full workspace runs here;
  # shipped macOS libraries are also built
  # and checked separately. The tools Python harness runs after the Rust steps.
  #
  # Platforms other than Linux are unstable but usable, so the job runs every
  # night and on manual dispatch; section 10 makes it best-effort and never a
  # PR merge condition (docs/runbooks/verification.md). Not skipped by
  # macos_only.
  test-macos:
    # Skipped by a windows_only dispatch; runs on the schedule.
    if: ${{ !inputs.windows_only }}
    runs-on: macos-26
    timeout-minutes: 45
    # ci.yml set these at workflow level; this workflow sets none.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rustup-components: clippy
          rust-cache: 'true'
          uv: 'true'
          just: 'true'
          cargo-nextest: 'true'
      - run: rustup show active-toolchain
      # GLib, pkg-config and the call-site LLVM from Homebrew; tkrzw from the
      # tkrzw action, which puts its build first on PKG_CONFIG_PATH.
      - name: Install GLib, pkg-config and the call-site LLVM (Homebrew)
        run: |
          llvm_major=$(uv run --no-project --managed-python python tools/audit/glib_call_sites.py --print-llvm-major)
          brew install glib pkgconf "llvm@${llvm_major}"
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw
      - name: Install cargo-c for shipped macOS libraries
        uses: ./.github/actions/bootstrap
        with:
          cargo-c: 'true'
      - name: Check shipped macOS library exports
        run: |
          stage="$RUNNER_TEMP/macos-shipped"
          just packaging install libpinyin --prefix=/usr/local --destdir="$stage" -- --release --locked --features shipped
          just packaging install libzhuyin --prefix=/usr/local --destdir="$stage" -- --release --locked
          OXPINYIN_CAPI_SO="$stage/usr/local/lib/libpinyin.15.0.0.dylib" \
          OXPINYIN_ZHUYIN_SO="$stage/usr/local/lib/libzhuyin.15.0.0.dylib" \
            just abi exports --shipped
      # Clippy over the lane's own feature set, so a lint in
      # macOS-only code fails here rather than nowhere.
      - name: Clippy (macOS)
        run: >
          cargo clippy --locked --workspace --all-targets
          -- -D warnings
      - name: Provide the pinned system data
        uses: ./.github/actions/contract-data
      - run: >
          cargo nextest run --locked --profile ci --status-level skip --workspace
      # nextest does not run doctests; keep the same feature set.
      - run: >
          cargo test --locked --doc --workspace
      - name: Run tools Python harness tests
        shell: bash
        run: just test-tools
