[package]
name = "pinyin-emitter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only interpolation2.text emitter reproducing libpinyin export_interpolation. Never ships."

[lints]
workspace = true

[[bin]]
name = "pinyin-emitter"
path = "src/bin/pinyin-emitter.rs"

[dependencies]
pinyin-segment = { path = "../pinyin-segment" }
pinyin-counter = { path = "../pinyin-counter" }

[dev-dependencies]
pinyin-data = { path = "../pinyin-data" }
