[package]
name = "oxpinyin-zhuyin-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI of libpinyin's zhuyin facade (libzhuyin.so.15), the --enable-libzhuyin counterpart to libpinyin.so.15. Linux only."

# The ABI namespace mirrors upstream: libzhuyin is a SEPARATE shared object
# from libpinyin (upstream builds it from `$(pinyin_SOURCES) zhuyin.cpp`
# with its own version script, src/Makefile.am:108-125 at the pin
# 0c5e80e1). The Cargo package name is project identity; the built artifact
# is deliberately `zhuyin_capi` (the checked-in header stays `zhuyin.h` with
# the exported `zhuyin_*` symbols), and the INSTALLED file is
# `libzhuyin.so.15` via [package.metadata.capi.library].
[lib]
name = "zhuyin_capi"
# cdylib is the ABI; rlib lets in-tree tools call the same symbols
# in-process; staticlib is required by cargo-c and shipped alongside.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Declared so cargo-c identifies this crate as the workspace's zhuyin C-API
# export target (the same mechanism oxpinyin-capi uses).
capi = []
# Safe ownership adapter for the nonshipping oxpinyin-repl's zhuyin mode.
tools = []
# Backend selection (one backend per binary; see oxpinyin-store's
# [features] for the model and precedence). Each peer feature forwards to
# oxpinyin-facade, which carries it down facade -> runtime -> user -> data ->
# store. The peer features stay on this crate because build.rs reads
# `CARGO_FEATURE_<PEER>` of this crate for the cxx backends' link setup, and
# because `cargo cinstall --features <peer>` names them. `just packaging
# install` writes the matching `database_format` into libzhuyin.pc.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-facade/kyotocabinet"]
bdb = ["oxpinyin-facade/bdb"]
tkrzw = ["oxpinyin-facade/tkrzw"]

[lints]
workspace = true

[dependencies]
# Marshalling macros shared with oxpinyin-capi (macro-only, no compiled
# code): the opaque-handle pointer casts and the char**-out sentence
# writer expand into this crate, where the unsafe is allowed.
oxpinyin-capi-marshal = { path = "../oxpinyin-capi-marshal" }
oxpinyin-core.workspace = true
# The shared facade-orchestration layer this crate's C wrappers translate.
oxpinyin-facade = { path = "../oxpinyin-facade", default-features = false }
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }
oxpinyin-engine.workspace = true
oxpinyin-runtime.workspace = true
oxpinyin-user.workspace = true
glib-sys.workspace = true

[dev-dependencies]
# Dev-only: the death-test helpers wait for their child with a time limit.
assert_cmd = "2.2"
# Dev-only: the user.conf expectation uses the boundary's text-mode newline.
oxpinyin-input.workspace = true
# Dev-only: shared-shape cases in the crate tests.
rstest = { version = "0.28", default-features = false }
# Dev-only: scratch dirs for the test fixtures. Never a dependency of the
# C ABI itself.
tempfile.workspace = true
# Dev-only: the pinned-data handoff test compares a saved user bigram by SHA-256.
sha2 = "0.11"
# Dev-only: the boundary test that cuts a save lowers RLIMIT_FSIZE.
libc.workspace = true
# Dev-only: the copy fault points of the DBM-copy death tests
# (`oxpinyin_store::copy_faults`), a test-only hook; a dev-dependency feature
# never reaches the normal build.
oxpinyin-store = { workspace = true, features = ["test-hooks"] }


# cargo-c packaging metadata. See docs/packaging.md for the rationale and the
# upstream libzhuyin.pc.in this mirrors.
[package.metadata.capi.header]
# The checked-in zhuyin.h ships verbatim; never regenerate it with cbindgen.
generation = false
# The real libzhuyin installs its header under the same version-stamped
# subdirectory as libpinyin (/usr/include/libpinyin-2.11.92/zhuyin.h).
# zhuyin.h includes novel_types.h and zhuyin_custom2.h; zhuyin_custom2.h
# includes pinyin_custom2.h, so all three shipped companions close the set.
subdirectory = "libpinyin-2.11.92"

[package.metadata.capi.install.include]
asset = [
    { from = "zhuyin.h", to = "libpinyin-2.11.92" },
    { from = "zhuyin_custom2.h", to = "libpinyin-2.11.92" },
    # zhuyin.h -> novel_types.h; zhuyin_custom2.h -> pinyin_custom2.h. Both
    # companions ship so the header resolves standalone (the drop-in installs
    # the closed include set, matching upstream's libzhuyin install tree).
    { from = "novel_types.h", to = "libpinyin-2.11.92" },
    { from = "pinyin_custom2.h", to = "libpinyin-2.11.92" },
]

[package.metadata.capi.pkg_config]
name = "libzhuyin"
filename = "libzhuyin"
description = "Library to deal with zhuyin"
version = "2.11.92"
requires = "glib-2.0"
# cargo-c cannot emit the extra variables real consumers read (database_format,
# libzhuyinincludedir, libzhuyin_binary_version), so `just packaging install`
# computes them and fills the install-time prefix — the same wrapper
# contract oxpinyin-capi uses (docs/findings/installed-naming.md).
generate = false

[package.metadata.capi.library]
# The INSTALLED artifact is libzhuyin.so.15, matching upstream's libtool
# -version-info 15:0 (same ABI current as libpinyin — both read
# @LT_VERSION_INFO@ in src/Makefile.am:118-121 at the pin).
name = "zhuyin"
version = "15.0.0"
versioning = true
