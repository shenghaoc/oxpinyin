[package]
name = "oxpinyin-datagen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "model20 → oxpinyin runtime tables compiler for every storage backend. Never ships."

[features]
# Kyoto Cabinet is the native default (matching oxpinyin-store) so a plain
# `cargo run -p oxpinyin-datagen -- compile ...` produces `.kct` tables.
# redb is always compiled as the pure-Rust portability producer; select it
# explicitly with `--no-default-features --features redb` (and `--backend
# redb`). The tool's backend is chosen per invocation with `--backend`;
# only the producers whose cargo features are enabled are available at
# runtime.
default = ["kyotocabinet"]
# Enable the Kyoto Cabinet producer (`--backend kyotocabinet`); mirrors
# oxpinyin-store.
kyotocabinet = ["oxpinyin-store/kyotocabinet"]
# Enable the LMDB producer (`--backend lmdb`); mirrors oxpinyin-store.
lmdb = ["oxpinyin-store/lmdb"]
# Enable the Tkrzw producer (`--backend tkrzw`); mirrors oxpinyin-store.
tkrzw = ["oxpinyin-store/tkrzw"]
# Marker for the pure-Rust portability producer. redb itself is always
# compiled as the no-backend-feature fallback; select it with
# `--no-default-features --features redb`.
redb = []

[lints]
workspace = true

[dependencies]
# default-features = false: the producer set is selected by this crate's own
# features above, never dragged in by the store's default.
oxpinyin-store = { path = "../oxpinyin-store", default-features = false }
# Model-cache location and the pinned model20 constants only; the oracle
# itself (oracle-ffi) is never linked by this crate.
pinyin-oracle = { path = "../pinyin-oracle", default-features = false }

[dev-dependencies]
# Loader-level verification of produced tables through the real data path.
# default-features = false so workspace `--no-default-features` runs are not
# re-defaulted through this dev edge.
oxpinyin-data = { path = "../oxpinyin-data", default-features = false }

[[bin]]
name = "oxpinyin-datagen"
path = "src/bin/oxpinyin-datagen.rs"
