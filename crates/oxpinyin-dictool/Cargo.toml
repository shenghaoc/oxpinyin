[package]
name = "oxpinyin-dictool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conversions and the standalone vocabulary exporter."

[lints]
workspace = true

[dependencies]
# default-features = false so `--no-default-features` builds actually reach
# the store's backend selection; the [features] block below forwards it.
oxpinyin-capi = { path = "../oxpinyin-capi", default-features = false }

[features]
# Backend selection, forwarded to the C ABI crate (one backend per binary;
# see oxpinyin-store's [features] for the model and precedence).
default = ["kyotocabinet"]
kyotocabinet = ["oxpinyin-capi/kyotocabinet"]
tkrzw = ["oxpinyin-capi/tkrzw"]
lmdb = ["oxpinyin-capi/lmdb"]
redb = ["oxpinyin-capi/redb"]
