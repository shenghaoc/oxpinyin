[package]
name = "oxpinyin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
redb = { workspace = true }
heed = { workspace = true, optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }

[features]
# The four backends (kyotocabinet, redb, lmdb, tkrzw) are peer
# implementations behind the store's `ReadStore`/`WriteStore` traits.
# Exactly one is compiled in per binary; `DefaultStore` resolves it at
# compile time along the chain kyotocabinet > tkrzw > lmdb > redb (a
# tie-break for cargo's additive feature unification, not a hierarchy).
# `kyotocabinet` is the enabled feature in the workspace's default set,
# which is what "default" means here — select any peer explicitly with
# `--no-default-features --features {kyotocabinet|redb|lmdb|tkrzw}`.
default = ["kyotocabinet"]
lmdb = ["dep:heed"]
tkrzw = ["dep:bindgen"]
# Kyoto Cabinet backend. bindgen is build-time only (it needs libclang);
# the runtime dependency is the system libkyotocabinet the distro already
# ships.
kyotocabinet = ["dep:bindgen"]
# Marker for the redb backend. redb itself is always compiled as the
# no-backend-feature selection; this marker exists so intent can be
# spelled on the command line: `--no-default-features --features redb`.
redb = []
