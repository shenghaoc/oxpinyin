name: Store backends

# Backend coverage for the peer store backends on a rolling
# toolchain. The peers (Kyoto Cabinet, tkrzw, Berkeley
# DB) are equal implementations behind the store's trait surface.
# Exactly one peer is compiled per build — the exactly-one-backend invariant is enforced at compile
# time by two `compile_error!` guards in `crates/oxpinyin-store/src/lib.rs`
# — so cross-peer equivalence is proven by running the SAME test
# suite through separate builds, one per peer.
#
# Jobs:
#   - changes is the path gate. It runs first when ci.yml calls this
#     workflow and sets `run` when tools/bisection/cells-for-diff.py selects
#     all three cells for the event's base...HEAD (docs/runbooks/verification.md,
#     rule 2, the rule local verification uses) or the diff touches
#     this workflow's own infrastructure, listed in the gate step. A missing
#     base runs everything.
#     The other jobs need it and run only when `run` is true; when it is
#     false they report `skipped`, which still reaches the aggregate.
#   - store-features is a matrix over all three peer backends. Each child
#     lints all workspace targets and tests the workspace under exactly ONE peer, on its
#     own runner, so the sweeps run in PARALLEL (fail-fast: false,
#     max-parallel: 4) instead of sequentially inside one job. The tkrzw
#     child repeats the build that ci.yml's Linux test job also runs; the
#     Berkeley DB and Kyoto Cabinet children are where those non-default
#     backends' workspace suites run. Every pass
#     decodes real queries through the fixture tables, not just the store's
#     own unit tests. The matrix value only selects one of the fixed,
#     repository-controlled cargo invocations (see the case in the test
#     step); no command is built from untrusted event input.
#   - store-backends-gate is this workflow's aggregate status check,
#     required through ci-aggregate. It runs no tests; it
#     fails when the changes job did not succeed, passes without running
#     anything when the path gate says no relevant path changed, and
#     all three sanitizer jobs succeeded.
#   - tkrzw-sanitizers, bdb-sanitizers and kc-sanitizers each run one
#     backend's gate through `python -m tools.dev sanitize <backend>`, the command
#     `just sanitize` runs locally, on the date-pinned nightly that
#     tools/dev/test_runner.py names: the tkrzw suite under ASan, the
#     Berkeley DB suite under ASan plus the C call-pattern harnesses under
#     ASan+UBSan, and the Kyoto Cabinet suite under ASan + LeakSanitizer.
#     Each feeds
#     store-backends-gate, so a finding turns that check red. On a
#     BerkeleyDB distro the system bigram.db is BDB and every session
#     opens it through that FFI, so the instrumentation is load-bearing,
#     not precautionary.
#
# ci.yml calls this workflow once and requires its result in ci-aggregate.
# The backend and sanitizer jobs still do the work; this workflow's
# gate aggregates their results without a separate required-check setting.
#
# ROLLING TOOLCHAIN, deliberately unpinned: the jobs run inside
# debian:testing because oxpinyin aims to be a viable libpinyin
# replacement, and building on the newest toolchain distros actually ship
# is a property under test, not an accident — libpinyin's own
# make-check.yml does the same. Debian Testing is the mother distro of
# one of the two major Linux ecosystems (Ubuntu and derivatives descend
# from it); RHEL, the other ecosystem's root, is the primary development
# platform, so CI on Debian Testing covers both lineages. Do NOT pin
# this image by digest or let a later change "stabilise" it. libtkrzw
# comes from the tkrzw action (.github/actions/tkrzw): upstream tkrzw at
# the revision tools/cloud/setup.sh provisions, built and cached, found
# through PKG_CONFIG_PATH. libdb and libkyotocabinet come from the image.
#
# The pin-built oracle and the model20 archive are deliberately NOT CI
# concerns: provisioning them (just fetch-model,
# tools/oracle/build-oracle.sh) is a LOCAL workflow, and no CI job may
# download model20.text.tar.gz or anything like it. The oracle-gated
# differentials and the model cache live on developer machines only.

on:
  # ci.yml owns push/PR triggers and cancellation; independent triggers here
  # would run the same backend jobs twice. Selection stays in changes.
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DEBIAN_FRONTEND: noninteractive

jobs:
  # The path gate as a job: one run flag for the whole workflow. Runs first
  # on every push and PR; each job that does work carries
  # if: needs.changes.outputs.run == 'true' so it reports skipped, a
  # conclusion that still reaches required-check accounting (a
  # workflow-level path filter would suppress the whole run). No
  # third-party filter action: checkout with full history and hand the
  # event's base (the PR base sha; the previous pushed head on main) to
  # tools/bisection/cells-for-diff.py, which diffs base...HEAD from the
  # merge base. A missing base (first push, force-push rewrite, rebased
  # base) or one with no merge base falls back to running everything, the over-trigger direction,
  # never the skip direction. The --also list is this workflow's own
  # infrastructure; keep it in lockstep with the inputs only these jobs
  # consume.
  changes:
    name: store-backends changes
    # The one Linux runner label in this workflow; the other Linux jobs
    # alias it (*ubuntu). Pinned, not ubuntu-latest, so a runner-image
    # move (26.04: actions/runner-images#14748) happens here under review.
    runs-on: &ubuntu ubuntu-26.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reuse: ${{ steps.evidence.outputs.reuse }}
      tree: ${{ steps.evidence.outputs.tree }}
      source_run: ${{ steps.evidence.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Look up complete successful PR evidence for this tree
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.dev.ci_tree evidence store
      - name: Require the Bash floor
        shell: bash
        run: . tools/lib/bash-floor.sh
      - name: Compute the path-gate flag
        id: gate
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "base $base unavailable; running every job"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # cells-for-diff.py diffs from the merge base; a base with none (an
          # unrelated history) over-triggers like an unavailable one.
          if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "no merge base with $base; running every job"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The backend rule is docs/runbooks/verification.md, rule 2, as
          # tools/bisection/cells-for-diff.py implements it for local runs:
          # a path under crates/oxpinyin-store/, a feature = "<backend>" line
          # in a changed non-Markdown file, or a Cargo.toml line naming a
          # backend. --also adds this workflow's own infrastructure: the
          # workflow, the backend provisioning under tools/bdb, tools/tkrzw and
          # .github/actions/tkrzw, the contract-verify action,
          # service (tools/dev/test_runner.py), the toolchain pin and this
          # gate's own script.
          python3 tools/bisection/cells-for-diff.py --run-flag \
            --also .github/workflows/store-backends.yml \
            --also .github/workflows/ci.yml \
            --also tools/dev/ci_tree.py \
            --also tools/dev/ci_tree.test.py \
            --also tools/bisection/cells-for-diff.py \
            --also tools/bdb \
            --also tools/tkrzw \
            --also .github/actions/tkrzw \
            --also .github/actions/contract-verify \
            --also tools/dev/check.py \
            --also tools/dev/test_runner.py \
            --also rust-toolchain.toml \
            "$base" >> "$GITHUB_OUTPUT"

  store-features:
    needs: changes
    if: needs.changes.outputs.run == 'true' && (needs.changes.outputs.reuse != 'true' || github.event_name == 'push')
    # One matrix child per backend, each on its own runner:
    # every such backend is exercised through the whole workspace — a
    # backend that "passes" only in the store's own unit tests
    # and never reaches the decode path does not count. The
    # alternate-backend children name the store's feature with
    # member/feature syntax because the root manifest is virtual. The
    # children run in parallel; the historical single-job serialisation of
    # these sweeps is gone.
    name: store backend (${{ matrix.backend }})
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    strategy:
      # fail-fast: false so one backend's failure does not cancel the other
      # children — every backend's result is reported independently.
      fail-fast: false
      max-parallel: 4
      matrix:
        backend:
          - bdb
          - kyotocabinet
          - tkrzw

    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bootstrap cluster (safe.directory, pinned toolchain, cache
      # restore) in one call right after the inline checkout; the
      # clippy/rustfmt components preserve the toolchain shape this job
      # always installed. Each backend child
      # gets a distinct cache identity via the extra key; without it the
      # feature configurations would contend one automatic key. Each
      # runner has its own isolated checkout and target dir — no shared
      # writable target across the matrix.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: store-backend-${{ matrix.backend }}
          # The KC and BDB children also run the contract references (contract-verify).
          uv: ${{ matrix.backend != 'tkrzw' && needs.changes.outputs.reuse != 'true' }}

      - name: Install build dependencies (apt)
        # Every matrix child installs the full set so each lane is
        # self-contained regardless of scheduling order; the marginal apt
        # cost is deliberate (correctness over shaving install seconds).
        # libdb-dev: the explicit bdb child links the system libdb.
        # libclang-dev: bindgen's runtime dependency for generating the
        # Berkeley DB FFI declarations from db.h.
        # libkyotocabinet-dev: the explicit kyotocabinet child links the
        # distro Kyoto Cabinet; its cxx bridge compiles against the headers.
        # The tkrzw child's library comes from the tkrzw action below.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libdb-dev libkyotocabinet-dev zlib1g-dev libglib2.0-dev

      - name: Provision tkrzw (built at the setup.sh revision and cached)
        if: matrix.backend == 'tkrzw'
        uses: ./.github/actions/tkrzw

      - name: Clippy for this backend
        if: needs.changes.outputs.reuse != 'true'
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = tkrzw ]; then
            cargo clippy --locked --workspace --all-targets -- -D warnings
          else
            cargo clippy --locked --workspace --all-targets --no-default-features --features "$BACKEND" -- -D warnings
          fi

      # Rustdoc for this backend, warnings denied, with the backend named
      # explicitly.
      - name: Rustdoc for this backend
        if: needs.changes.outputs.reuse != 'true'
        env:
          BACKEND: ${{ matrix.backend }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --no-default-features --features "$BACKEND"

      # This child runs exactly one of the fixed cargo invocations, selected
      # by the matrix backend through a case over a closed set (fail-closed
      # default). The matrix value is bound to a plain shell variable via env
      # indirection — ${{ }} inside a run: body is a template-injection
      # surface — and never spliced into a command.
      #
      # The KMM crate is backend-dependent since 2026-10-31 UTC: its
      # operations run on the selected store backend and its integration
      # tests spawn the seven utilities against `fixtures/w3/<backend>`.
      # It therefore runs in this matrix. The consolidated training package
      # stays too: its segment and eval stages use the selected store
      # backend, and the other stage modules compile against that selection.
      # What stays is everything a backend choice can change: the store
      # itself, the user store, data readers, runtime, engine, facade, both
      # C ABIs, the oracle harness, the training package (segment and eval
      # modules) and KMM.
      - name: Test the workspace under this backend
        if: needs.changes.outputs.reuse != 'true'
        id: backend-test
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          case "$BACKEND" in
          # `--features <peer>` at `--workspace` scope enables that
          # feature on every workspace member that declares it, so the
          # peer selection cascades through each consumer's own
          # `<peer> = ["oxpinyin-store/<peer>", ...]` forwarder. A
          # bare passthrough (`--features oxpinyin-store/<peer>`) does
          # NOT — cargo features do not back-propagate — and would
          # leave each consumer's own `#[cfg(feature = "<peer>")]`
          # code (e.g. `user_store_tests!(<peer>, ...)` in
          # oxpinyin-user) skipped even while `DefaultStore`
          # resolves to the peer. The bare-name form here is the
          # documented public interface — see
          # `docs/findings/backend-selection-audit.md`. The
          # exactly-one-backend invariant is unchanged.
          bdb)
            echo "--- bdb (explicit) ---"
            cargo test --locked --workspace --no-default-features --features bdb
            ;;
          kyotocabinet)
            echo "--- kyotocabinet (explicit) ---"
            cargo test --locked --workspace --no-default-features --features kyotocabinet
            ;;
          tkrzw)
            echo "--- tkrzw ---"
            cargo test --locked --workspace
            ;;
          *)
            echo "FAIL: unknown matrix.backend value '$BACKEND'" >&2
            exit 2
            ;;
          esac
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      # Backend database behaviour is verified by the native Rust tests above. The contract cases
      # that read no system data also run here, against the frozen pin observations (the tkrzw
      # cell verifies in ci.yml; nothing runs nightly for KC or BDB).
      - name: Contract references (verify under this backend)
        if: ${{ needs.changes.outputs.reuse != 'true' && matrix.backend != 'tkrzw' }}
        uses: ./.github/actions/contract-verify
        with:
          cell: ${{ matrix.backend == 'kyotocabinet' && 'kc' || matrix.backend }}

      - name: Report
        if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' }}
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## store backend (${BACKEND})"
            echo ""
            echo "Result: **$([ '${{ job.status }}' = 'success' ] && echo 'passed' || echo 'FAILED')**"
            echo ""
            echo "Backend-relevant workspace sweep under the ${BACKEND} backend only."
            echo ""
            echo "| Backend | Wall clock |"
            echo "|---|---:|"
            echo "| ${BACKEND} | ${{ steps.backend-test.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh the main Rust cache using the lane's compile mode
        if: github.event_name == 'push' && needs.changes.outputs.reuse == 'true'
        env:
          BACKEND: ${{ matrix.backend }}
        run: python3 -m tools.dev.ci_tree refresh store-features --backend "$BACKEND"

  store-backends-gate:
    # Aggregate checked by the caller's required ci-aggregate. It builds and
    # tests nothing; it has three outcomes: red when
    # the changes job did not succeed; green without running anything when
    # the path gate says no relevant path changed; and otherwise green only
    # when every upstream job succeeded. Via needs.<job>.result, a matrix
    # upstream is success only when EVERY matrix child succeeded, and a
    # skipped upstream is not success, so a skipped backend or
    # sanitizer job fails the gate.
    name: store backends (kyotocabinet / tkrzw / bdb)
    runs-on: *ubuntu
    if: ${{ !cancelled() }}
    needs:
      - changes
      - store-features
      - tkrzw-sanitizers
      - bdb-sanitizers
      - kc-sanitizers
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -m tools.dev.ci_tree aggregate store

  tkrzw-sanitizers:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.reuse != 'true'
    # The tkrzw backend crosses into C++ through a cxx bridge: borrowed byte
    # slices become std::string_view for one call, iterator reads land in
    # std::string out-parameters, and a RecordProcessor subclass in the
    # adapter (crates/oxpinyin-store/src/tkrzw/adapter.cc) walks keys. The
    # live hazards are a borrow outliving its call and a C++ exception
    # crossing the noexcept shim, so the feature's own test surface runs
    # under ASan and any finding kills the job. The adapter and cxx's
    # generated glue are compiled C++ translation units; the store's build
    # script passes -fsanitize=address -fno-omit-frame-pointer to them when
    # CARGO_CFG_SANITIZE names address, as the Kyoto Cabinet bridge's does
    # (#1531), so both sides of the bridge are instrumented. A UBSan arm ran
    # here until 2026-10-22, when the backend had no C targets; it was
    # removed then.
    name: tkrzw FFI under address
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires syscall leeway no other job here needs: Docker's
      # default seccomp profile blocks personality(2), which turned setarch's
      # ASLR-off ASan wrapper into EPERM on the previous run. Unconfining
      # seccomp for THIS job alone restores standard sanitizer setups;
      # everything else stays under stock confinement.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    # Feeds store-backends-gate since 2026-09-08 (it had been
    # continue-on-error and outside that gate). The gate becomes required
    # when the ruleset names it; until then only ci.yml's `ci-aggregate`
    # is required.

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same root-owned-checkout caveat as the store-features job. The
      # nightly toolchain below stays bespoke (sanitizer builds need
      # nightly, not the pinned channel), and rust-cache stays off on
      # purpose — see the note above the gate step.
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          uv: 'true'

      # The sanitizer nightly is declared once in tools/dev/test_runner.py and
      # read through `tools.dev sanitize-toolchain`. RUSTUP_TOOLCHAIN beats
      # rust-toolchain.toml's channel pin for this job only.
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          tools/install-python.sh
          uv run --no-project --managed-python python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON

      - name: Select the sanitizer nightly
        run: echo "RUSTUP_TOOLCHAIN=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize-toolchain)" >> "$GITHUB_ENV"

      - name: Install build dependencies (apt)
        # On Debian, libasan ships with gcc and is not a separate package.
        # libclang-dev is bindgen's runtime dependency.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libclang-dev libglib2.0-dev

      # The library the backend links against. With no setup.sh environment
      # here, the gate trusts it only after tools/tkrzw/distro-probe.sh,
      # which runs the tkrzw_dbm_util the action puts first on PATH.
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          # Visible to THIS step too: GITHUB_PATH only applies to later steps.
          . "$HOME/.cargo/env"
          rustc --version

      # No rust-cache here on purpose: the store crate compiles in seconds;
      # a separate sanitizer-flavored cache entry would be pure book-keeping.
      # (Rust-cache hashes RUSTFLAGS into its key anyway, so even a future
      # enablement cannot cross-contaminate the unsanitized dep store.)
      # tools.dev.test_runner carries the flags, their reasons and the
      # verified-runtime check.

      - name: Run the tkrzw sanitizer gate
        id: sanitize-tests
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize tkrzw
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## tkrzw-sanitizers (address)"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  bdb-sanitizers:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.reuse != 'true'
    # The Berkeley DB feature's own suite under ASan, plus the C
    # call-pattern harnesses under ASan+UBSan, via the same
    # `python -m tools.dev sanitize bdb` developers run locally. The hazards
    # are the DBT plumbing and cursor buffers (Rust, ASan) and the
    # SingleGram chunk arithmetic the C harness mirrors (ASan+UBSan —
    # rustc has no `undefined` sanitizer, so the C half is where UBSan
    # has something to instrument). On a BerkeleyDB distro the system
    # bigram.db is BDB and every session opens it through this FFI, so
    # the lane feeds store-backends-gate like tkrzw-sanitizers does.
    #
    # debian:testing deliberately unpinned like every job here. The
    # harness half needs libdb-dev (the system libdb the backend links
    # and the -ldb it compiles against) and gcc for the C probes.
    name: bdb backend sanitizers
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires the same seccomp leeway as the tkrzw lane above.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          uv: 'true'

      # Same nightly source as the tkrzw lane above.
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          tools/install-python.sh
          uv run --no-project --managed-python python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON

      - name: Select the sanitizer nightly
        run: echo "RUSTUP_TOOLCHAIN=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize-toolchain)" >> "$GITHUB_ENV"

      - name: Install build dependencies (apt)
        # libdb-dev resolves to libdb5.3-dev — the system libdb this
        # backend binds (and whose db.h bindgen reads); libclang-dev is
        # bindgen's runtime dependency; gcc builds the C harnesses.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libclang-dev libdb-dev

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustc --version

      - name: Run the bdb sanitizer gate
        id: sanitize-tests
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize bdb
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## bdb-sanitizers"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite + C harnesses | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  kc-sanitizers:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.reuse != 'true'
    # The Kyoto Cabinet feature's own suite under ASan + LeakSanitizer, via
    # `python -m tools.dev sanitize kc`. The backend crosses into C++ through a
    # cxx bridge (crates/oxpinyin-store/src/kyotocabinet/adapter.cc): visitor
    # regions are borrowed for one callback, cursors borrow their database, and
    # an empty region must not reach Kyoto Cabinet as address 1. The store's
    # build script instruments the adapter and cxx's generated glue under
    # address, as for tkrzw above. Fedora and Arch ship this backend. Feeds
    # store-backends-gate.
    name: kc backend sanitizers
    runs-on: *ubuntu
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # ASan requires the same seccomp leeway as the tkrzw lane above.
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          uv: 'true'

      # Same nightly source as the tkrzw lane above.
      - name: Set up pinned repository Python
        run: |
          set -euo pipefail
          tools/install-python.sh
          uv run --no-project --managed-python python -X lazy_imports=normal - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          assert sys.implementation.name == "cpython"
          assert sys.version_info.releaselevel == "final" and (3, 15, 0) <= sys.version_info[:3] < (3, 16, 0)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 0
          assert sys._is_gil_enabled()
          managed = subprocess.check_output(
              ["uv", "python", "find", "--managed-python"],
              text=True).strip()
          assert Path(sys.executable).resolve() == Path(managed).resolve()
          PYTHON

      - name: Select the sanitizer nightly
        run: echo "RUSTUP_TOOLCHAIN=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize-toolchain)" >> "$GITHUB_ENV"

      - name: Install build dependencies (apt)
        # libkyotocabinet-dev: the library this backend links and the
        # headers its cxx bridge compiles against with g++; no bindgen, so
        # no libclang.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config util-linux libkyotocabinet-dev

      - name: Install nightly Rust (sanitizer support)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustc --version

      - name: Run the kc sanitizer gate
        id: sanitize-tests
        run: |
          set -euo pipefail
          start=$EPOCHSECONDS
          uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev sanitize kc
          echo "elapsed=$((EPOCHSECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "## kc-sanitizers"
            echo ""
            echo "Result: **$([ '${{ steps.sanitize-tests.outcome }}' = 'success' ] && echo 'clean — zero findings' || echo 'FINDINGS PRESENT — STOP')**"
            echo ""
            echo "| Phase | Wall clock |"
            echo "|---|---:|"
            echo "| instrumented suite | ${{ steps.sanitize-tests.outputs.elapsed || '—' }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  tree-evidence:
    name: tested tree ${{ needs.changes.outputs.tree }}
    needs: [changes, store-backends-gate, store-features, tkrzw-sanitizers, bdb-sanitizers, kc-sanitizers]
    if: ${{ needs.changes.outputs.run == 'true' && needs.changes.outputs.reuse == 'false' && needs.changes.result == 'success' && needs.store-backends-gate.result == 'success' && needs.store-features.result == 'success' && needs.tkrzw-sanitizers.result == 'success' && needs.bdb-sanitizers.result == 'success' && needs.kc-sanitizers.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'All concrete verification lanes passed for this checkout tree.'

  reused-tree-evidence:
    name: reused tree ${{ needs.changes.outputs.tree }} from run ${{ needs.changes.outputs.source_run }}
    needs: [changes, store-backends-gate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'true' && needs.store-backends-gate.result == 'success' }}
    runs-on: *ubuntu
    steps:
      - run: echo 'The original full PR run was revalidated for this exact tree.'