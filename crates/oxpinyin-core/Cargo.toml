[package]
name = "oxpinyin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bitflags.workspace = true
num_enum.workspace = true
compact_str.workspace = true
phf.workspace = true

[build-dependencies]
# Generates the phf maps over the frozen syllable inventories (see build.rs).
phf_codegen.workspace = true

[dev-dependencies]
rstest = { version = "0.28", default-features = false }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[features]
# Parser result access for the nonshipping pin test programs.
tools = []
