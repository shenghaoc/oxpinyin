# Path gates: CI runs its lanes only when code or a direct input of one
# of its jobs changes, so docs-only changes skip lint, test,
# deny and fuzz entirely. The gate moved from the workflow trigger to
# the jobs themselves (2026-09-08): the workflow always starts, the
# `changes` job computes one `run` flag from the path set below, and
# every lane carries `if: needs.changes.outputs.run == 'true'`.
#
# The skip claim above holds only for a branch up to date with main: the
# `changes` job computes its flag with a two-dot diff (git diff
# --name-only "$base" HEAD, where $base is pull_request.base.sha), so a
# branch behind main sees main's own commits in the gated paths and
# sets run=true. Demonstrated on PR #487 (2026-09-19): 5 behind main,
# tools/bisection/ changes on main ran the full matrix; rebased onto
# the landing tip, the same docs-only branch skipped every code lane.
# That over-approximation is intentional under rebase-and-merge — the
# two-dot diff asks whether the post-merge tree differs from main's
# current tree, which is the question that matters — not a bug to be
# fixed.
#
# Why each path is gated:
#   - crates/** — any code change
#   - fuzz/** — the fuzz job uses fuzz/Cargo.toml and fuzz/src/
#   - tools/** — the test job runs tools/bisection/run-cpp-smoke.sh and
#     run-live-typing-diff.sh, so bisection-script changes are CI inputs
#   - Cargo.toml / Cargo.lock — workspace manifest and lockfile: a
#     dependency or feature change reaches lint, test and deny
#   - deny.toml — the deny job reads this directly
#   - rust-toolchain.toml — a toolchain change affects every job
#   - .github/workflows/ci.yml — the workflow file itself
#   - .github/scripts/lint-crate-cfg-placement.sh and
#     tests/lint-crate-cfg-placement.test.sh — the lint job runs the
#     crate-cfg placement checker and the harness that gates it, so a
#     change to either is a direct input of that job
#   - fixtures/** — the frozen tables, goldens and DBM files that the
#     test and fuzz jobs decode through; a fixture-only change
#     is exactly the kind that must be re-proven (added 2026-09-06 — until
#     then a fixture-only PR ran no CI at all)
#   - tests/parity/** — the parity corpus pinyin-oracle's tests replay
#   - clippy.toml — the lint job's Clippy configuration (msrv)
#   - .github/actions/** — the bootstrap composite action every job runs
#
# Deliberately NOT gated (changes to these skip every lane):
#   - docs/** — findings, design docs, ROADMAP: no code
#   - reference/** — memory safety docs: no code
#   - .kiro/** — specs and steering: no code
#   - *.md at the root — README, CHANGELOG: no code
#   - .github/workflows/store-backends.yml — store-backends has its own
#     trigger and its own path gate; ci.yml doesn't need to re-gate on it
#
# Branch-protection interaction: skipped lanes still REPORT (conclusion
# `skipped`), which required status checks treat as satisfied, and the
# always-running `ci-aggregate` job at the tail reports on every push
# and PR no matter what changed — it is the shape a required check
# needs. Main's required set is `ci-aggregate`, `trailer-lint`, and
# `trailer-test` (the last two from commit-trailers.yml). `ci-aggregate`
# fails when any lane that should have run failed or was cancelled,
# and when a gated-out lane was skipped despite its paths changing.
# The path-set bypass (a PR editing ci.yml to skip its own lanes) is
# closed as far as this workflow can close it — the aggregate compares
# each lane's conclusion against the same `changes` output — but a PR
# that rewrites the workflow itself can always rewrite its gates; that
# residual is a branch-protection policy question (enforce for
# administrators), not a workflow one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Four job groups (plus path gate and aggregate):
#   lint — rustfmt + clippy + the Lizard CCN ratchet
#   test — cargo test for the whole workspace (the ONE full sweep per
#          PR), and the portable workspace (all but capi, zhuyin-capi,
#          and the seven backend-independent training crates — corpus,
#          counter, emitter, kmm, lambda, punct, word, which run once
#          here on Linux) on macOS and Windows
#   deny — supply-chain gate: RustSec advisories, licenses, sources,
#          duplicate-version drift (docs/safety/oxpinyin-safety-profile.md
#          layer 6)
#   fuzz — bounded parser fuzz smoke test on a pinned nightly/tool version

jobs:
  # The path gate as a job: one `run` flag for the whole workflow (the
  # lanes all share one input set, so they gate together). Runs first on
  # every push and PR; each lane carries `if: needs.changes.outputs.run
  # == 'true'` so it reports `skipped` — a conclusion, which unlike a
  # workflow-level path filter still reaches required-check accounting.
  #
  # No third-party filter action: checkout with full history and diff
  # against the event's base (the PR base sha; the previous pushed head
  # on main). A missing base (first push, force-push rewrite, rebased
  # base) falls back to running everything — the over-trigger direction,
  # never the skip direction. Diffing the event base directly (not the
  # merge-base) can only pick up extra files when the base moved under
  # the event; that over-triggers too. The pathspec list is the one the
  # header documents; keep the two in lockstep.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compute the path-gate flag
        id: gate
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "base $base unavailable; running every lane"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD --             crates fuzz tools             Cargo.toml Cargo.lock rust-toolchain.toml deny.toml clippy.toml             .github/workflows/ci.yml             .github/scripts/lint-crate-cfg-placement.sh             tests/lint-crate-cfg-placement.test.sh             fixtures tests/parity .github/actions)
          if [ -n "$changed" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rustup-components: clippy rustfmt
          rust-cache: 'true'
          rust-cache-key: lint-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Tkrzw is the default store backend; bindgen (libclang) reads
        # tkrzw_langc.h at build time, and Debian's libtkrzw build demands
        # the compression -dev packages at link time. test-macos installs
        # its own Homebrew tkrzw and test-windows links vcpkg Berkeley DB,
        # so neither of those jobs uses this apt line.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      # Placement gate for crate-level `#![cfg(...)]`. A gate that
      # evaluates false discards the crate attributes written AFTER it, so
      # one placed above a `//!` block takes the docs with it and
      # `missing_docs` fires — on the excluded platform only, which no job
      # here can see: this container makes every `target_os = "linux"`
      # gate true, and test-macos/test-windows build the portable crates
      # only, so the breakage surfaced on a contributor's macOS checkout
      # instead. The checker reads placement, not cfg outcomes, so it holds
      # for every host from here. Harness first: a regression in the
      # checker itself must not pass quietly.
      - run: tests/lint-crate-cfg-placement.test.sh
      - run: .github/scripts/lint-crate-cfg-placement.sh
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Complexity ratchet: no function may exceed CCN 40 (current max is
      # 38, the user/store.rs quartet — a tracked refactor target, never
      # allowed to grow past the limit). Moved here from verify-nightly
      # on 2026-09-08: seconds of runtime, and a ratchet that fired only
      # the night after a merge was a ratchet in name only.
      # --break-system-packages: PEP 668 marking; this container is
      # ephemeral, there is no system Python to protect. 1.24.0 is the
      # release the ratchet was validated against locally.
      - run: apt-get install -y --no-install-recommends python3-pip
      - run: pip install --break-system-packages lizard==1.24.0
      - run: lizard crates/ -l rust -C 40

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          rust-cache-key: test-job
      - run: rustup show active-toolchain
      - name: Install build dependencies (apt)
        # Tkrzw is the default store backend; bindgen (libclang) reads
        # tkrzw_langc.h at build time, and Debian's libtkrzw build demands
        # the compression -dev packages at link time. test-macos installs
        # its own Homebrew tkrzw and test-windows links vcpkg Berkeley DB,
        # so neither of those jobs uses this apt line.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - run: cargo test --locked --workspace
      - name: C++ pinyin.h smoke gate
        run: tools/bisection/run-cpp-smoke.sh
      # The exported-symbol gate: each cdylib exports exactly its pin
      # version script's set (libpinyin.ver 79, libzhuyin.ver 52) and
      # leaks nothing else — in the development build (fixture hooks
      # allowed) and in the packaged one (--features shipped, hooks
      # compiled out). Cheap: only the two capi crates rebuild for the
      # second mode.
      - name: ABI export gate (development build)
        run: tools/abi/check-exports.sh
      - name: ABI export gate (shipped build)
        run: tools/abi/check-exports.sh --shipped
      # The allocator-pairing gate: every pointer the two C ABIs hand a
      # consumer is classified in libpinyin.alloc / libzhuyin.alloc, and a
      # C++ consumer built from those registers releases each one with its
      # declared deallocator under AddressSanitizer/LeakSanitizer. Catches a
      # library-side leak, a borrowed pointer wrongly declared owned, and a
      # new allocating entry point nobody classified. No extra apt package:
      # the g++ installed above already carries libasan/liblsan.
      - name: Allocator-pairing gate
        run: tools/abi/check-alloc-pairing.sh
      # The post-choose live-typing/train differential (sentence-surface's
      # §3 machinery). Self-skips unless the pin-built oracle
      # (PINYIN_ORACLE_PREFIX) and a real-unigram system dir
      # (LIVETYPING_SYSTEM) are present — runner-local only: the model20
      # archive is non-redistributable and never enters CI, so this and
      # every model20-dependent check (oxpinyin-datagen's strict tests,
      # sentence-surface parity) run on a provisioned local machine, never
      # on GitHub-hosted runners.
      - name: Live-typing differential
        run: tools/bisection/run-live-typing-diff.sh

  # macOS and Windows each link a C store backend. #501 deletes redb,
  # and these two jobs were the only lanes still selecting it, so without
  # a backend here they cannot build once that lands. macOS links Homebrew
  # tkrzw — the path README.md documents for that OS. Windows links
  # vcpkg's Berkeley DB 4.8, the Sleepycat line. Both jobs keep the
  # exclude set these jobs already have on main: the two C-ABI crates
  # (glib and cargo-c, Linux-only) and the seven backend-independent
  # training crates (corpus, counter, emitter, kmm, lambda, punct, word),
  # which run once per PR in the Linux `test` job. oxpinyin-dictool stays
  # in the set: its C-ABI dependency was cut, and it drives the facade's
  # import/export machinery directly.
  #
  # Two jobs rather than a matrix: containers run on Linux runners only, so
  # a containerized matrix cannot cover these operating systems. macOS
  # runners already default `run:` to bash, so only the Windows job sets
  # `defaults.run.shell`.
  test-macos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      # Homebrew tkrzw, exactly as README.md documents it (`brew install
      # tkrzw glib pkgconf`, then LIBRARY_PATH so the test link finds
      # lz4/lzma/zstd — tkrzw.pc names them, and the store build script
      # emits only tkrzw's own -L directory). The lane names tkrzw
      # explicitly: macOS tests that documented path, which is the
      # default today and stays this path if the default moves.
      # `--no-default-features` also keeps pinyin-oracle's Linux-only
      # `oracle-ffi` off even if it ever became a default feature.
      - name: Install the store backend (Homebrew tkrzw)
        run: |
          brew install tkrzw glib pkgconf
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          # `brew list --versions` prints "<name> <cellar-version>..."
          # (space-separated; a second installed version is another field
          # on the same line). Pin the 1.x line the core formula is on
          # (1.0.32); a major bump fails here instead of silently.
          brew list --versions tkrzw | grep -Eq '^tkrzw 1[.]' \
            || { echo "::error::Homebrew tkrzw is not the documented 1.x line: $(brew list --versions tkrzw)"; exit 1; }
      - run: >
          cargo test --locked --workspace --no-default-features --features tkrzw
          --exclude oxpinyin-capi --exclude oxpinyin-zhuyin-capi
          --exclude oxpinyin-corpus --exclude oxpinyin-counter --exclude oxpinyin-emitter
          --exclude oxpinyin-kmm --exclude oxpinyin-lambda --exclude oxpinyin-punct
          --exclude oxpinyin-word

  test-windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    # windows-latest defaults every `run:` to pwsh. The provisioning step
    # is bash (`$VCPKG_INSTALLATION_ROOT`, `>> "$GITHUB_ENV"`); under pwsh
    # those names are unset and the redirections write nowhere, so the
    # lane never reaches a build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          rust-cache: 'true'
      - run: rustup show active-toolchain
      # vcpkg's berkeleydb port: 4.8.30, the Sleepycat line, the same
      # family as the 5.3 the Linux lanes link. The port installs
      # libdb48.lib / libdb48.dll and the build_windows headers. The
      # store build script is pointed at that tree; the import library
      # is named explicitly because the bare `-ldb` fallback does not
      # match libdb48.lib; the DLL directory joins PATH for the test
      # binaries; bindgen gets the runner's preinstalled LLVM.
      - name: Install the store backend (vcpkg Berkeley DB)
        run: |
          vcpkg install berkeleydb:x64-windows
          # `vcpkg list` prints "<port>:<triplet>  <version>#<port-version>  <description>".
          # The port name is followed by ":x64-windows", not whitespace, and
          # the version carries a "#<n>" suffix, so a pattern expecting
          # "berkeleydb" then spaces then "4.8" matches nothing and the
          # lane dies before the build. Pin the 4.8 line; a bump off it
          # fails here.
          vcpkg list berkeleydb:x64-windows | grep -Eq 'berkeleydb:x64-windows[[:space:]]+4[.]8[.]' \
            || { echo "::error::vcpkg berkeleydb is not the documented 4.8 line: $(vcpkg list berkeleydb:x64-windows)"; exit 1; }
          echo "OXPINYIN_BDB_INCLUDE_DIR=$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\include" >> "$GITHUB_ENV"
          echo "OXPINYIN_BDB_LIB_DIR=$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\lib" >> "$GITHUB_ENV"
          echo "OXPINYIN_BDB_LIB_NAME=libdb48" >> "$GITHUB_ENV"
          # vcpkg's berkeleydb port is 4.8.30. The store refuses any libdb
          # other than the surveyed 5.3 unless this is set, and it is set
          # only here: it covers that one comparison, and the process
          # prints a warning naming both versions. No other lane sets it.
          echo "OXPINYIN_BDB_ALLOW_UNSURVEYED_VERSION=1" >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\bin" >> "$GITHUB_PATH"
      # bdb, one peer, so the exactly-one-backend guard is satisfied.
      # Same exclusions as the macOS job, and the same set main's
      # test-windows already uses.
      - run: >
          cargo test --locked --workspace --no-default-features --features bdb
          --exclude oxpinyin-capi --exclude oxpinyin-zhuyin-capi
          --exclude oxpinyin-corpus --exclude oxpinyin-counter --exclude oxpinyin-emitter
          --exclude oxpinyin-kmm --exclude oxpinyin-lambda --exclude oxpinyin-punct
          --exclude oxpinyin-word

  # Supply-chain gate. cargo-deny's advisories check consumes the same
  # RustSec DB cargo-audit uses, so this one job replaces both tools; the
  # policy (allow-lists, deviation registry with review-by dates) lives in
  # deny.toml. The binary is downloaded pinned rather than `cargo install`ed
  # to keep the job under a minute.
  #
  # Debian Testing container in the store-backends.yml style: the supply
  # chain is checked on the rolling toolchain distros actually ship, and
  # the image is deliberately unpinned for the same reason (see that
  # workflow's header).
  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny shells out to `cargo metadata`, so a cargo binary is
      # required; minimal profile suffices (nothing here compiles code).
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      - name: Install pinned cargo-deny
        run: |
          ver=0.20.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -sSfL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz
          mkdir -p ~/.local/bin
          install -m755 "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Default-feature tree first, then the feature-gated dependency
      # subtrees (tkrzw, oracle-ffi). --locked pins both root graphs
      # to the committed Cargo.lock, which Dependabot maintains. The fuzz
      # workspace has its own lock (fuzz/Cargo.lock) and its own graph
      # (libfuzzer-sys plus workspace path deps). Dependabot's cargo
      # ecosystem at directory: "/fuzz" updates that lock for crates.io
      # bumps in the fuzz graph. A root `/` bump that changes workspace
      # pins or path crates reachable from fuzz, and does not refresh
      # fuzz/Cargo.lock, fails --locked. That failure is the gate.
      - run: cargo deny --locked --log-level error check
      - run: cargo deny --locked --all-features --log-level error check
      - run: cargo deny --locked --log-level error --manifest-path fuzz/Cargo.toml check
      # deny.toml's advisory ignore list is empty, so nothing here needs a
      # scope assertion to bound it. The guard this replaced existed only
      # to keep the RUSTSEC-2025-0141 (bincode) ignore honest while heed
      # was in the tree; that backend now binds a system C library, so
      # heed, heed-types and bincode are all gone.

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
      - name: Install build dependencies (apt)
        # The fuzz targets ride the workspace default (tkrzw): bindgen
        # (libclang) reads tkrzw_langc.h at build time, and Debian's
        # libtkrzw build demands the compression -dev packages at link
        # time.
        run: apt-get install -y --no-install-recommends gcc g++ make pkg-config libclang-dev libtkrzw-dev liblzma-dev liblz4-dev libzstd-dev zlib1g-dev libglib2.0-dev
      - name: Install pinned nightly with Rust sources
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
      - name: Install pinned cargo-fuzz
        run: |
          ver=0.13.2
          # Verify the release archive before executing anything from it:
          # pin the expected digest and fail the job on mismatch.
          sum=b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
          curl -sSfL -o cargo-fuzz.tar.gz "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${ver}/cargo-fuzz-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-fuzz.tar.gz" | sha256sum -c -
          tar xzf cargo-fuzz.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-fuzz ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pins the fuzz workspace to fuzz/Cargo.lock. A stale lock
      # (workspace pin bump or new path crate not reflected here)
      # fails this step. Dependabot owns the nested lock via
      # directory: "/fuzz"; root bumps that leave it stale are
      # meant to fail.
      - name: Verify fuzz lockfile
        run: cargo +nightly-2026-08-01 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      # Fuzzing memory on the PR path too: restore the corpus the nightly
      # soak has accumulated (same key prefix as verify-nightly.yml's
      # fuzz-soak, so a PR smoke starts from that memory instead of the
      # single committed seed). The PR's own run-id key saves whatever
      # the 10s smokes learned, LRU-evicted like any cache.
      - name: Restore the accumulated fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Build every fuzz target
        # Compile gate for the whole fuzz workspace. Only the parser is run
        # here; the other targets used to reach a compiler solely in the
        # nightly soak lane (verify-nightly.yml), so a PR that broke one
        # merged green and surfaced the next night at best. The target
        # list is derived from the manifest's [[bin]] entries via
        # `cargo fuzz list` rather than enumerated, so a new target cannot
        # be forgotten here; an empty list fails loudly rather than passing
        # while building nothing. `fuzz build` and `fuzz run` share the
        # ASan release profile and the pinned gnu triple (see the next
        # step), so this warms exactly the parser binary the run step
        # executes — the two steps are not redundant.
        run: |
          set -euo pipefail
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          for target in "${targets[@]}"; do
            echo "::group::build $target"
            cargo +nightly-2026-08-01 fuzz build --target x86_64-unknown-linux-gnu "$target"
            echo "::endgroup::"
          done
      - name: Run bounded fuzz smoke pass (every target)
        # The pinned cargo-fuzz release binary is itself a musl build, and
        # cargo-fuzz defaults the fuzz target to the triple it was built for
        # (rust-fuzz/cargo-fuzz#398) — pin the runner's gnu triple so the
        # fuzzers build against the gnu std exactly as they did under the
        # source-built tool (ASan will not link musl's static libc).
        #
        # Every target gets a short run, not just the parser: building is
        # not executing. A harness whose environment went stale (the
        # capi-commands fixture path, 2026-09-04) compiled green and
        # failed only in the nightly soak — the first input already
        # panicked. A 10s run per target boots each harness against its
        # real inputs, fixtures, and temp state, so that class fails the
        # PR. The soak lane still does the deep work (180s/target).
        run: |
          set -euo pipefail
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          status=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz smoke $target"
            if ! cargo +nightly-2026-08-01 fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=10 -timeout=15 -max_len=4096; then
              status=1
              echo "::error::fuzz smoke failed for $target"
            fi
            echo "::endgroup::"
          done
          exit $status
      # A smoke crash must survive the runner: cargo-fuzz writes the
      # crash-* input under fuzz/artifacts/<target>/, and that file is
      # the repro a fix needs. Uploaded only on failure, like the
      # nightly soak does.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/

  # One of the three required checks (with `trailer-lint` and
  # `trailer-test` from commit-trailers.yml): always runs, always
  # reports. Red only when a lane that should have run ended as
  # anything but success, or when the path gate said run but a lane
  # was skipped anyway (a broken `if`, or a PR narrowing its own
  # gates). `skipped` with run=false is green: those lanes had no
  # inputs on this change, which is exactly what a path gate means.
  # store-backends.yml and verify-nightly.yml keep their own triggers
  # and remain non-required lanes beside this one.
  ci-aggregate:
    needs:
      [changes, lint, test, test-macos, test-windows, deny, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any lane failed, was cancelled, or skipped unjustly
        env:
          CHANGES: ${{ needs.changes.result }}
          GATED: ${{ needs.changes.outputs.run }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_MACOS: ${{ needs.test-macos.result }}
          TEST_WINDOWS: ${{ needs.test-windows.result }}
          DENY: ${{ needs.deny.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          set -euo pipefail
          status=0
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job ended as $CHANGES"
            status=1
          fi
          lane() {
            local name="$1" result="$2"
            case "$result" in
              success) ;;
              skipped)
                if [ "$GATED" = true ]; then
                  echo "::error::$name skipped although the path gate said run"
                  status=1
                fi
                ;;
              *)
                echo "::error::$name ended as $result"
                status=1
                ;;
            esac
          }
          lane lint "$LINT"
          lane test "$TEST"
          lane test-macos "$TEST_MACOS"
          lane test-windows "$TEST_WINDOWS"
          lane deny "$DENY"
          lane fuzz "$FUZZ"
          if [ "$status" -eq 0 ]; then
            echo "all lanes green (gated=$GATED)"
          fi
          exit $status
