name: coverage

# Line-coverage floor: the nightly's coverage lane, from one job body.
# Coverage is advisory (docs/runbooks/verification.md, section 10): it is
# not a required check, and a red result here does not block a merge.
# verify-nightly.yml calls it unconditionally (workflow_call), so the
# whole-tree number is measured every night. It has no pull request
# trigger: the PR gate already runs the workspace suite, and coverage is
# never a merge condition.
#
# Same container conventions as verify-nightly.yml: debian:testing,
# deliberately unpinned — do not "stabilise" it.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned, not ubuntu-latest, so a runner-image move (26.04:
    # actions/runner-images#14748) happens here under review.
    runs-on: ubuntu-26.04
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash python3 tar gzip zstd git ca-certificates curl jq gcc g++ make libc6-dev pkg-config libclang-dev libglib2.0-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
          rustup: 'true'
          rust-cache: 'true'
          cargo-llvm-cov: 'true'
          uv: 'true'
      - name: Provision tkrzw (built at the setup.sh revision and cached)
        uses: ./.github/actions/tkrzw
      - name: Provide the pinned system data
        uses: ./.github/actions/contract-data
      - run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only --fail-under-lines 85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
