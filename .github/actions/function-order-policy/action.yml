name: 'function-order-policy'
description: |-
  Build the shipping staticlibs with the release recipe and resolve every
  checked-in function-order policy against its own backend's staticlib.
  Called by verify-nightly.yml's function-order-policy job and ci.yml's
  PR job; each caller owns its trigger, container, timeout, checkout and
  RUSTFLAGS, so the job name stays function-order-policy in both lanes.

  The archive is the shipping one: just packaging install, which runs
  cargo-c with the release profile (fat LTO, one codegen unit) and the
  features the policies are generated from (docs/packaging.md,
  "Regeneration"). A plain `cargo build --release` archive is not a
  substitute: it inlines differently, and 20 of the 238 libpinyin paths
  did not resolve against it (#1071). The build turns the relink's own
  ordering off (an explicitly empty OXPINYIN_FUNCTION_ORDER_POLICY, as the
  Regeneration procedure does), so a stale policy fails the explicit
  resolve below, with its own message, and not the relink; the staticlib
  is the same either way. The resolver reads the archive with nm and needs
  no linker that can order sections.

  Each backend's policies name paths from its own shipping build (#1076).
  Keep one target and staging directory per backend, and resolve only the
  matching function-order/<backend>/ policies against those archives.

  The six builds log wall time, user CPU and the largest process's
  resident set, the columns of the cost estimate in #1071, and the last
  step logs the container's peak memory; the caller's timeout-minutes is
  the separate job figure of that proposal.

  Called by both lanes so the build and resolve cannot drift. A lockfile
  update can move generic Rust instances to different instantiating
  crates: the cc 1.4.3 -> 1.9.0 bump (f9257eae) made both KC policies
  stop resolving (#1210).

runs:
  using: composite
  steps:
    - name: Record the job start
      shell: bash
      run: date +%s > "$RUNNER_TEMP/function-order-job-start.txt"
    # libssl-dev and pkg-config: cargo-c pulls openssl-sys through the
    # cargo crate (see perf-snapshot). The three backend -dev packages
    # supply each backend's headers/libraries; libclang-dev is for bindgen.
    # Debian's tkrzw.pc also links the compression libraries. tkrzw-utils
    # lets the existing distro probe verify the runtime before using it.
    # libglib2.0-dev: the C ABI's glib. time: the build cost lines.
    - name: Bootstrap the runner essentials and build dependencies (apt)
      shell: bash
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make libc6-dev pkg-config libclang-dev libdb-dev libkyotocabinet-dev libtkrzw-dev tkrzw-utils liblzma-dev liblz4-dev libzstd-dev libglib2.0-dev libssl-dev zlib1g-dev binutils time
    - uses: ./.github/actions/bootstrap
      with:
        safe-directory: 'true'
        rustup: 'true'
    - name: Provision managed Python
      shell: bash
      run: bash tools/cloud/setup.sh --python-only
    - name: Install cargo-c
      shell: bash
      run: cargo install cargo-c --version 0.10.25 --locked
    - name: Verify the distro tkrzw runtime
      shell: bash
      run: |
        tools/tkrzw/distro-probe.sh
        library="$(pkg-config --variable=libdir tkrzw)/libtkrzw.so"
        test -f "$library"
        export OXPINYIN_TKRZW_LIBRARY="$(readlink -f -- "$library")"
        uv run --no-project --managed-python python -X lazy_imports=normal -m tools.tkrzw.runtime --print-path tkrzw function-order-policy distro "$(command -v tkrzw_dbm_util)"
        printf 'OXPINYIN_TKRZW_LIBRARY=%s\n' "$OXPINYIN_TKRZW_LIBRARY" >> "$GITHUB_ENV"
    # The release recipe of docs/packaging.md, "Regeneration": both
    # facades on every backend. cargo-c is installed once above; each
    # backend reuses its own target directory for its two facades.
    - name: Build the shipping staticlibs (all backends, release recipe)
      shell: bash
      run: |
        export OXPINYIN_FUNCTION_ORDER_POLICY=
        target_root="${CARGO_TARGET_DIR:-$PWD/target}/function-order"
        cost='%e s wall, %U s user, %M KiB largest process RSS'
        cost_file="$RUNNER_TEMP/function-order-cost.txt"
        : > "$cost_file"
        for backend in bdb kc tkrzw; do
          feature=$backend
          [ "$backend" != kc ] || feature=kyotocabinet
          export CARGO_TARGET_DIR="$target_root/$backend"
          stage="$RUNNER_TEMP/function-order-$backend"
          build_start=$SECONDS
          echo "install.sh libpinyin ($backend: $feature,shipped)"
          /usr/bin/time -f "$cost" uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev packaging install libpinyin --prefix="$stage" \
            -- --locked --release --no-default-features --features "$feature,shipped"
          echo "install.sh libzhuyin ($backend: $feature)"
          /usr/bin/time -f "$cost" uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev packaging install libzhuyin --prefix="$stage" \
            -- --locked --release --no-default-features --features "$feature"
          if [ "$backend" = tkrzw ]; then
            for facade in libpinyin libzhuyin; do
              uv run --no-project --managed-python python -X lazy_imports=normal -m tools.tkrzw.runtime --print-path tkrzw function-order-policy "$facade" "$stage/lib/$facade.so.15.0.0"
            done
          fi
          printf 'build\t%s\t%s\n' "$backend" "$((SECONDS - build_start))" >> "$cost_file"
        done
    # All six policies are checked even if one is stale, so one run names
    # every stale policy. The resolver names each unresolved path on
    # stderr. The archive is <target>/<host>/release/lib<facade>.a, the file
    # install.sh passes to the relink as --staticlib.
    - name: Resolve every checked-in policy against its staticlib
      shell: bash
      run: |
        host=$(rustc -vV | sed -n 's/^host: //p')
        target_root="${CARGO_TARGET_DIR:-$PWD/target}/function-order"
        cost_file="$RUNNER_TEMP/function-order-cost.txt"
        failed=0
        for backend in bdb kc tkrzw; do
          release="$target_root/$backend/$host/release"
          resolve_start=$SECONDS
          for facade in libpinyin libzhuyin; do
            archive="$release/$facade.a"
            policy="tools/packaging/function-order/$backend/$facade.order"
            if [ ! -f "$archive" ]; then
              echo "::error::staticlib not found: $archive"
              failed=1
              continue
            fi
            if errors=$(uv run --no-project --managed-python python -X lazy_imports=normal -m tools.dev packaging function-order resolve "$archive" "$policy" "$facade.so.15" 2>&1 >/dev/null); then
              echo "$policy resolves against $archive"
              # The resolver's C++ skip count ("N of M C++ policy paths are
              # not in this build; skipped"), printed on every resolve.
              printf '%s\n' "$errors"
            else
              printf '%s\n' "$errors"
              echo "::error file=$policy::$(grep -m1 'unresolved policy path' <<< "$errors" || echo 'policy does not resolve'). $policy is stale: regenerate it (docs/packaging.md, \"Regeneration\")."
              failed=1
            fi
          done
          printf 'resolve\t%s\t%s\n' "$backend" "$((SECONDS - resolve_start))" >> "$cost_file"
        done
        exit "$failed"
    # The measured cost, in the #1071 columns: each backend's two release
    # builds and its two resolves, plus the whole job. One runner, so a
    # backend's runner minutes are its wall seconds / 60.
    - name: Report the measured cost
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cost_file="$RUNNER_TEMP/function-order-cost.txt"
        job_start_file="$RUNNER_TEMP/function-order-job-start.txt"
        {
          echo "## function-order-policy cost"
          echo ""
          echo "| Backend | Build (s) | Resolve (s) | Wall (s) | Runner minutes |"
          echo "|---|---:|---:|---:|---:|"
          for backend in bdb kc tkrzw; do
            build=$(awk -F '\t' -v b="$backend" '$1 == "build" && $2 == b { value = $3 } END { if (value != "") print value }' "$cost_file" 2>/dev/null || true)
            resolve=$(awk -F '\t' -v b="$backend" '$1 == "resolve" && $2 == b { value = $3 } END { if (value != "") print value }' "$cost_file" 2>/dev/null || true)
            if [ -n "$build" ] && [ -n "$resolve" ]; then
              wall=$((build + resolve))
              minutes=$(awk -v s="$wall" 'BEGIN { printf "%.2f", s / 60 }')
              echo "| $backend | $build | $resolve | $wall | $minutes |"
            else
              echo "| $backend | ${build:-—} | ${resolve:-—} | — | — |"
            fi
          done
          if [ -f "$job_start_file" ]; then
            job_wall=$(( $(date +%s) - $(cat "$job_start_file") ))
            echo ""
            echo "Job wall: ${job_wall}s ($(awk -v s="$job_wall" 'BEGIN { printf "%.2f", s / 60 }') runner minutes)."
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"
    # cgroup v2 high-water mark of the job container. It counts page
    # cache, so it bounds the working set from above. A diagnostic only:
    # it must never fail the job.
    - name: Log the job's peak memory
      if: always()
      shell: bash
      run: |
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || true)
        echo "runner: $(nproc) CPUs, $(awk '/^MemTotal:/ {printf "%d", $2 / 1024}' /proc/meminfo) MiB"
        if [ -n "$peak" ]; then
          echo "job container memory.peak: $((peak / 1048576)) MiB"
        else
          echo "job container memory.peak: unavailable"
        fi
