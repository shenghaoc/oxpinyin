[package]
name = "oxpinyin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
# The tkrzw and Kyoto Cabinet backends' Rust/C++ bridges (Rust/C++
# interoperability ruling, docs/findings/compatibility-policy.md#rust-cpp-interoperability):
# generated glue over the pin's concrete classes.
cxx = { version = "1.0.205", optional = true }
[dev-dependencies]
# The frozen rows digest of the pin-written Berkeley DB tests (tests/bdb_libpinyin_files.rs),
# the one crates/oxpinyin-utils/tests/common computes.
sha2 = "0.11"

[build-dependencies]
bindgen = { workspace = true, optional = true }
# The C++ compiler probe both bridges' include handling uses.
cc = { version = "1.4.3", optional = true }
# Declares and finds the native backends (#1434); see the metadata below.
system-deps = { version = "9.0.0", optional = true }
# Generates and compiles the bridges' C++ side, with the semantic adapters
# in src/tkrzw/adapter.cc and src/kyotocabinet/adapter.cc.
cxx-build = { version = "1.0.205", optional = true }

# One entry per backend, each probed only with its feature. The version is
# required by the format; "0" is no floor, as libpinyin's configure sets
# none. tkrzw and Kyoto Cabinet are found through their .pc file. Berkeley
# DB is found without pkg-config (build.rs defaults its NO_PKG_CONFIG and
# LIB), so its version here is never consulted.
[package.metadata.system-deps.tkrzw]
feature = "tkrzw"
version = "0"

[package.metadata.system-deps.kyotocabinet]
feature = "kyotocabinet"
version = "0"

[package.metadata.system-deps.bdb]
feature = "bdb"
version = "0"

[features]
# The backends (kyotocabinet, tkrzw, bdb) are peer
# implementations behind the store's `ReadStore`/`WriteStore` traits.
# **Exactly one** is compiled in per build; a `compile_error!` in
# `src/lib.rs` refuses builds that enable zero or two-or-more. The
# corresponding implementation is the only one compiled, so an
# unselected peer's dependency (bindgen) is not pulled in
# either.
#
# `tkrzw` is the enabled feature in the workspace's default set
# (maintainer decision 2026-10-30 UTC: maintained upstream), which is what
# "default" means here — select any peer explicitly with
# `--no-default-features --features {kyotocabinet|tkrzw|bdb}`.
default = ["tkrzw"]
# Nonshipping tool calls; never enabled by the C libraries.
tools = []
# Test-only constructors and fault points for other crates' tests
# (`BdbUserBigramDb::failed_container`, `copy_faults`). Enabled only from a
# [dev-dependencies] entry, so it is never part of a normal or shipped build.
test-hooks = []
# tkrzw binds the pin's concrete classes through cxx; it needs a C++17
# compiler and tkrzw's headers, not libclang; `cc` is named for the compiler probe.
tkrzw = ["dep:cc", "dep:cxx", "dep:cxx-build", "dep:system-deps"]
# Kyoto Cabinet binds the pin's concrete classes through cxx; it needs a
# C++17 compiler and Kyoto Cabinet's headers, not libclang. The runtime
# dependency is the system libkyotocabinet the distro already ships.
kyotocabinet = ["dep:cc", "dep:cxx", "dep:cxx-build", "dep:system-deps"]
# Berkeley DB backend — libpinyin's original DBM and the third drop-in
# set. bindgen is build-time only; the runtime dependency is the system
# libdb 5.3 the distro already ships (Debian libdb-dev, Fedora
# libdb-devel), the same library that wrote the files it must read.
bdb = ["dep:bindgen", "dep:system-deps"]
