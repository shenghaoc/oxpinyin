name: commit-trailers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  # Job names are the required-check contexts. They must not collide
  # with CI's `lint` / `test` (bare-name matching treated a green
  # trailer job as the rustfmt gate on #98).
  #
  # Container in the store-backends.yml style: the linter is pure shell
  # plus git, so the jobs need only the bare-runner essentials — no
  # rustup, no build deps. The image is deliberately unpinned — do not
  # "stabilise" it.
  trailer-lint:
    name: trailer-lint
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:testing ships a minimal base without bash or git; the
      # runner infrastructure and later steps need both.
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      # Pinned to the v7.0.1 tag commit; verified against the
      # actions/checkout releases page (do not bump without re-verifying).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      - name: Lint PR commits against trailer rules
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The event payload's base.sha goes stale as the base branch
          # advances; compute the merge-base at lint time instead so only the
          # commits this PR introduces are linted.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          MB="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          .github/scripts/lint-commits.sh "${MB}" "${HEAD_SHA}"

  # Gate the linter itself: run the self-contained fixture harness on every
  # PR so a change to the script or workflow cannot silently regress the
  # rule logic.
  trailer-test:
    name: trailer-test
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see store-backends.yml header
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          safe-directory: 'true'
      - name: Run linter test harness
        run: tests/lint-commits.test.sh
