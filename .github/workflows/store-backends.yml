  tree-evidence:
    name: tested tree ${{ needs.changes.outputs.tree }}
    needs: [changes, store-backends-gate, store-features, backend-matrix, tkrzw-sanitizers, bdb-sanitizers, kc-sanitizers]
    if: ${{ needs.changes.outputs.run == 'true' && needs.changes.outputs.reuse == 'false' && needs.changes.result == 'success' && needs.store-backends-gate.result == 'success' && needs.store-features.result == 'success' && needs.backend-matrix.result == 'success' && needs.tkrzw-sanitizers.result == 'success' && needs.bdb-sanitizers.result == 'success' && needs.kc-sanitizers.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All concrete verification lanes passed for this checkout tree.'

  reused-tree-evidence:
    name: reused tree ${{ needs.changes.outputs.tree }} from run ${{ needs.changes.outputs.source_run }}
    needs: [changes, store-backends-gate]
    if: ${{ !cancelled() && needs.changes.outputs.reuse == 'true' && needs.store-backends-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The original full PR run was revalidated for this exact tree.'
