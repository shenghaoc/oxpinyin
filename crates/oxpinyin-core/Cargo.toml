[package]
name = "oxpinyin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
include = [
    "/src/**",
    "/build.rs",
    "/codegen/**",
]
description = "oxpinyin internal crate — no stability promise. The Rust interface is unstable."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
libc.workspace = true
glib-sys.workspace = true
memmap2.workspace = true
rustc-hash.workspace = true
bitflags.workspace = true
num_enum.workspace = true
compact_str.workspace = true
phf.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[build-dependencies]
# Generates the phf maps over the frozen syllable inventories (see build.rs).
phf_codegen.workspace = true

[dev-dependencies]
tempfile.workspace = true
rstest.workspace = true
proptest.workspace = true

[features]
# Parser and native I/O operations for the utilities and REPL.
tools = []

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
