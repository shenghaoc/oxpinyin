[package]
name = "oxpinyin-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "libpinyin's utilities under their own names and interfaces (external-I/O boundary stage 5). Never ships."

[features]
# The data layer's backend selection, forwarded to every backend-sensitive
# edge the utilities use.
default = ["tkrzw"]
kyotocabinet = [
    "oxpinyin-data/kyotocabinet",
    "oxpinyin-store/kyotocabinet",
    "oxpinyin-training/kyotocabinet",
]
bdb = ["oxpinyin-data/bdb", "oxpinyin-store/bdb", "oxpinyin-training/bdb"]
tkrzw = [
    "oxpinyin-data/tkrzw",
    "oxpinyin-store/tkrzw",
    "oxpinyin-training/tkrzw",
]

[lints]
workspace = true

[dependencies]
oxpinyin-core = { workspace = true }
# pinyin_exact_compare2, shared with the table writers.
oxpinyin-data = { workspace = true }
# The pin's DBM files, written and read through the backend seam the data
# layer and datagen share.
oxpinyin-store = { workspace = true }
# The utilities' edge calls: GLib options and text, input streams, C stdio.
oxpinyin-input = { workspace = true, features = ["tools"] }
# `eval_correction_rate`'s decode: the training crate's term-for-term port
# of `PhoneticLookup<1, 1>`.
oxpinyin-training = { path = "../oxpinyin-training", default-features = false }

[dev-dependencies]
# The KMM text the pipeline and differential tests convert.
oxpinyin-kmm = { path = "../oxpinyin-kmm" }
tempfile.workspace = true

[[bin]]
name = "gen_pinyin_table"
path = "src/bin/gen_pinyin_table.rs"

[[bin]]
name = "gen_zhuyin_table"
path = "src/bin/gen_zhuyin_table.rs"

[[bin]]
name = "k_mixture_model_to_interpolation"
path = "src/bin/k_mixture_model_to_interpolation.rs"

[[bin]]
name = "gen_binary_files"
path = "src/bin/gen_binary_files.rs"

[[bin]]
name = "import_interpolation"
path = "src/bin/import_interpolation.rs"

[[bin]]
name = "export_interpolation"
path = "src/bin/export_interpolation.rs"

[[bin]]
name = "ngseg"
path = "src/bin/ngseg.rs"

[[bin]]
name = "spseg"
path = "src/bin/spseg.rs"

[[bin]]
name = "mergeseq"
path = "src/bin/mergeseq.rs"

[[bin]]
name = "gen_unigram"
path = "src/bin/gen_unigram.rs"

[[bin]]
name = "gen_ngram"
path = "src/bin/gen_ngram.rs"

[[bin]]
name = "gen_deleted_ngram"
path = "src/bin/gen_deleted_ngram.rs"

[[bin]]
name = "estimate_interpolation"
path = "src/bin/estimate_interpolation.rs"

[[bin]]
name = "eval_correction_rate"
path = "src/bin/eval_correction_rate.rs"
