[package]
name = "oxpinyin-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI subset of libpinyin's public API, for the borrowed frontend. Linux only."

# Supported C ABI (Linux); soname/versioning freezes with the first public release.
#
# Cargo package name is project identity; the built artifact name is part of
# the compatibility bootstrap and intentionally stays `pinyin_capi` (and the
# checked-in header stays `pinyin.h` with exported `pinyin_*` symbols).
[lib]
name = "pinyin_capi"
# cdylib is the ABI; rlib lets oxpinyin-dictool call the same symbols
# in-process; staticlib is required by cargo-c and shipped alongside the .so.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Declared so cargo-c identifies this crate as the workspace's C-API export
# target. cargo-c checks for the *presence* of this feature name; it is never
# enabled by default, so plain `cargo build`/`--workspace` behaviour is unchanged.
capi = []
# Compiles out the three exports outside the consumer union: two fixture
# hooks and pinyin_set_full_pinyin_scheme, all `dlsym`ed by tools/bisection
# drivers and called by neither reference consumer. Enabled only when building
# the shipped drop-in artifact (`cargo capi install --features shipped`), so
# every in-tree run-*.sh keeps working untouched.
#
# Deliberately a subtractive feature, which cargo features usually should not
# be. The additive spelling (a default-on `harness` feature switched off with
# --no-default-features) does not work here: cargo-c does not forward
# --no-default-features to cargo, so the shipped artifact came out carrying the
# extra symbols. --features IS forwarded, so the restriction has to ride on it.
shipped = []

[lints.rust]
unsafe_code = "allow" # FFI + glib marshalling only; // SAFETY: on every block
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
oxpinyin-core.workspace = true
oxpinyin-data = { path = "../oxpinyin-data" }
oxpinyin-engine.workspace = true
oxpinyin-runtime.workspace = true
oxpinyin-user.workspace = true

[dev-dependencies]
# Criterion 0.5+ (workspace lock is 0.8). Stage-2 benches only; not a
# runtime dependency of the C ABI.
criterion = "0.8"
# Direct use in `benches/stage2.rs` (`UserStore::count_delta`). Already a
# runtime dependency of this crate; restated so the bench crate can import it.
oxpinyin-user = { path = "../oxpinyin-user" }

[[bench]]
name = "stage2"
harness = false

# cargo-c packaging metadata. See docs/packaging.md for the rationale and the
# Fedora/Debian recipes that consume this.
[package.metadata.capi.header]
# The checked-in pinyin.h ships verbatim; never regenerate it with cbindgen, so
# the file the fork compiles against stays byte-identical.
generation = false
# Install the header directly under $includedir (/usr/include/pinyin.h), not
# under a per-library subdirectory.
subdirectory = ""

[package.metadata.capi.install.include]
# Ship the existing crate-root header without moving it into assets/.
asset = [{ from = "pinyin.h", to = "" }]

[package.metadata.capi.pkg_config]
# Package name and .pc filename are the project identity ("oxpinyin"); the -l
# link flag still resolves to -lpinyin_capi (see library.name below).
name = "oxpinyin"
filename = "oxpinyin"

[package.metadata.capi.library]
# The INSTALLED artifact is the drop-in replacement: `libpinyin.so.15`, which
# unmodified consumers already record in DT_NEEDED. The Rust `[lib] name` stays
# `pinyin_capi` so the in-tree gates keep finding target/debug/libpinyin_capi.so;
# this field names the installed file, not the build artifact.
name = "pinyin"
# ABI version, independent of the crate version, and matched to upstream:
# libpinyin's configure.ac carries libpinyin_abi_current=15 / abi_revision=0,
# giving libtool -version-info 15:0 and SONAME libpinyin.so.15. Confirmed with
# readelf -d on Ubuntu's shipped libpinyin15. Bump only if upstream bumps its
# ABI current.
version = "15.0.0"
versioning = true
