[package]
name = "oxpinyin-counter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only n-gram counter reproducing libpinyin gen_ngram. Never ships."

[lints]
workspace = true

[features]
# Backend selection, forwarded through oxpinyin-segment to the chain (one
# backend per binary; see oxpinyin-store's [features] for the model): the
# counter reads `phrase_index.<ext>` in the compiled-in backend's format.
# The four peer backends match the store's; Tkrzw is the default
# selection, and `--no-default-features --features {kyotocabinet|redb|lmdb}`
# picks a peer.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-segment/kyotocabinet"]
tkrzw = ["oxpinyin-segment/tkrzw"]
lmdb = ["oxpinyin-segment/lmdb"]
redb = ["oxpinyin-segment/redb"]

[[bin]]
name = "oxpinyin-counter"
path = "src/bin/oxpinyin-counter.rs"

[dependencies]
# default-features = false so the backend selection reaches the chain from
# this crate's features above, not from segment's defaults.
oxpinyin-segment = { path = "../oxpinyin-segment", default-features = false }

[dev-dependencies]
# Dev-only edge: the differential suite shares the pin-harness helpers
# (fnv1a64, manifest parsing, PinDir) with the other tool suites. No
# shipping code depends on oxpinyin-testsupport.
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
