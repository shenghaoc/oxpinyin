[package]
name = "pinyin-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Differential harness against the source-built libpinyin pin. Never ships."

# Link discovery only; does nothing unless `oracle-ffi` is enabled.
build = "build.rs"

[features]
default = []
# Links the pin-built libpinyin from tools/oracle/build-oracle.sh.
# Linux-only, and requires the oracle prefix to be present and on-pin.
oracle-ffi = []

[lints.rust]
unsafe_code = "allow" # FFI to the real libpinyin; // SAFETY: on every block
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "parity-corpus"
path = "src/bin/parity_corpus.rs"

[[bin]]
name = "parity-diff"
path = "src/bin/parity_diff.rs"

[dependencies]
# Internal workspace crate: the corpus is generated from the frozen syllable
# inventory, and W2-T3 compares against this parser. Not an external dependency.
pinyin-core = { path = "../pinyin-core" }
