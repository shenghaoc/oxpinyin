[package]
name = "oxpinyin-dictool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conversions and the standalone vocabulary exporter."

[lints]
workspace = true

[dependencies]
# FewestKeys: the frozen untuned full-pinyin parse the import path shares
# with the C ABI's `pinyin_iterator_add_phrase`.
oxpinyin-core = { workspace = true }
# The user-store-only context core and the §9 export materialization the
# C ABI's export iterators also drive — the shared laws, no C types.
# default-features = false so `--no-default-features` builds reach the
# backend selection; the [features] block below forwards it.
oxpinyin-facade = { path = "../oxpinyin-facade", default-features = false }
oxpinyin-user = { path = "../oxpinyin-user", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Reads Kyoto Cabinet's library directories for the rpath, as oxpinyin-store
# does (#1434).
pkg-config = { version = "0.3.34", optional = true }

[features]
# Backend selection, forwarded to oxpinyin-facade, which carries it down
# facade -> runtime -> user -> data -> store (one backend per binary; see
# oxpinyin-store's [features] for the model and precedence). Dictool no longer depends on the C ABI crate, so it is
# pure Rust under any backend and portable to macOS and Windows.
default = ["bdb"]
kyotocabinet = ["oxpinyin-facade/kyotocabinet", "dep:pkg-config"]
bdb = ["oxpinyin-facade/bdb"]
tkrzw = ["oxpinyin-facade/tkrzw"]
