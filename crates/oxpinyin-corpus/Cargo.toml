[package]
name = "oxpinyin-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only corpus front-end: zhwiki dump -> raw Han text for oxpinyin-segment. Never ships."

[lints]
workspace = true

[[bin]]
name = "oxpinyin-corpus"
path = "src/bin/oxpinyin-corpus.rs"

[dev-dependencies]
# default-features = false so a workspace `--no-default-features` sweep
# stays on the redb selection: these edges must not re-default the
# training crates' Kyoto Cabinet selection. A standalone
# `cargo test -p oxpinyin-corpus` runs the same tests over redb; the
# committed four-backend fixture tables serve each peer selection.
oxpinyin-segment = { path = "../oxpinyin-segment", default-features = false }
oxpinyin-counter = { path = "../oxpinyin-counter", default-features = false }
oxpinyin-lambda = { path = "../oxpinyin-lambda", default-features = false }
oxpinyin-emitter = { path = "../oxpinyin-emitter", default-features = false }
