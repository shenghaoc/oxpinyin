[package]
name = "oxpinyin-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
redb = { workspace = true }
heed = { workspace = true, optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }

[features]
# Kyoto Cabinet is the default backend — the DBM the reference libpinyin
# builds against on the primary target distros. Exactly one backend is
# compiled in per binary (libpinyin's own model); `DefaultStore` resolves
# it at compile time with precedence kyotocabinet > tkrzw > lmdb > redb.
default = ["kyotocabinet"]
lmdb = ["dep:heed"]
tkrzw = ["dep:bindgen"]
# Kyoto Cabinet backend. bindgen is build-time only (it needs libclang);
# the runtime dependency is the system libkyotocabinet the distro already
# ships — the same library that writes the files this reads.
kyotocabinet = ["dep:bindgen"]
# Marker for the pure-Rust portability fallback (macOS/Windows — the C
# backends are Linux-only). redb itself is always compiled as the
# no-backend-feature fallback; select it with
# `--no-default-features --features redb`.
redb = []
