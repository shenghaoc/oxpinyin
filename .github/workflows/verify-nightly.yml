name: verify-nightly

# Tier-3 scheduled verification (docs/safety/ci-strategy.md): everything
# too slow or too nightly for the PR gate. Findings here open issues —
# they do not block merges unless a ratchet exists (Lizard's CCN limit is
# the only ratchet). Trials (Miri, geiger) are continue-on-error until
# they prove stable.
#
# All jobs run in debian:testing containers in the store-backends.yml
# style: the nightly lanes exist to surface drift early, and the rolling
# distro toolchain is part of what they exercise. The image is
# deliberately unpinned — do not "stabilise" it.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-nightly
  cancel-in-progress: false

jobs:
  # All five fuzz targets, 3 minutes each, ASan+LSan on by default with
  # cargo-fuzz 0.13.2. The dict-loader corpus is seeded from the committed
  # w3 tables so the decoder starts from valid headers.
  fuzz-soak:
    runs-on: ubuntu-latest
      # Same ASan leeway as the tkrzw sanitizer job in store-backends.yml:
      # Docker's default seccomp profile blocks personality(2), which the
      # setarch ASLR-off wrapper below needs.
    container:
      image: debian:testing # deliberately unpinned; see the header comment
      # The override the comment above exists for: without it Docker's
      # default seccomp profile blocks personality(2) and setarch -R dies
      # with EPERM before any target runs.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # One nightly toolchain serves both cargo-fuzz's build and the runs
      # (cargo install works on nightly; no second toolchain needed).
      - name: Install the pinned nightly with Rust sources
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly-2026-08-01 --component rust-src
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed corpora
        run: |
          shopt -s nullglob
          seeds=(fixtures/w3/*.bin)
          mkdir -p fuzz/corpus/dict-loader
          if [ ${#seeds[@]} -gt 0 ]; then
            cp "${seeds[@]}" fuzz/corpus/dict-loader/
          else
            echo '::warning::no fixtures/w3 .bin seeds found; dict-loader starts from an empty corpus'
          fi
      - name: Soak each target
        # Every target runs even if an earlier one fails; the accumulated
        # status is the step's exit code.
        run: |
          status=0
          for target in parser dict-loader fixture-model double-pinyin capi-commands; do
            echo "::group::fuzz $target"
            # setarch -R disables ASLR for the process tree: runner
            # kernels' mmap entropy exceeds ASan's shadow mapping, and an
            # unprivileged container cannot lower vm.mmap_rnd_bits itself
            # (same rationale as store-backends.yml's sanitizer job).
            if ! setarch "$(uname -m)" -R cargo +nightly-2026-08-01 fuzz run "$target" -- -max_total_time=180 -timeout=15 -max_len=4096; then
              status=1
              echo "::error::fuzz target $target failed"
            fi
            echo "::endgroup::"
          done
          exit $status

  # UB detection for the pure-Rust crates (core's algorithms, store's
  # default redb backend). Trial: continue-on-error until it has proven
  # stable on this schedule; FFI crates are out of Miri's reach (C/C++).
  miri:
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned nightly with Miri
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly-2026-08-01 --component miri rust-src
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - run: cargo +nightly-2026-08-01 miri setup
      - run: cargo +nightly-2026-08-01 miri test -p oxpinyin-core -p oxpinyin-store

  # Latent-overflow lane: the releaseoptimized codepath with overflow
  # checks and debug assertions forced on (docs/safety/
  # tooling-evaluation.md §8) — the "NDEBUG question" as CI, not as
  # shipped configuration.
  overflow-lane:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C overflow-checks=y -C debug-assertions=y -D warnings
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace --release

  # Coverage report (region/line) as an artifact; no threshold gate —
  # the baseline is 81.92% lines (measured 2026-08-29). cargo-llvm-cov
  # is curl-pinned and checksum-verified like cargo-deny in ci.yml.
  coverage:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-llvm-cov
        run: |
          ver=0.9.0
          sum=bc2122fd7bd9b6d3eb371690ed085f82e5a8bf1851f4645ef521d12ed04b2616
          curl -sSfL -o cargo-llvm-cov.tar.gz "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${ver}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar xzf cargo-llvm-cov.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-llvm-cov ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info

  # Dependency-unsafe inventory, weekly-signal grade: report artifact
  # only. Trial (continue-on-error): geiger periodically bit-rots against
  # new rustc versions.
  geiger:
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc pkg-config libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - run: cargo install cargo-geiger --version 0.13.0 --locked
      - run: cargo geiger > geiger-report.txt || cargo geiger --output-format text > geiger-report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geiger-report
          path: geiger-report.txt

  # Complexity ratchet: no function may exceed CCN 40 (current max is 38,
  # the user/store.rs quartet — a tracked refactor target, never allowed
  # to grow past the limit).
  lizard:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl python3-pip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # --break-system-packages: PEP 668 marking; this container is
      # ephemeral, there is no system Python to protect. 1.24.0 is the
      # release the ratchet was validated against locally.
      - run: pip install --break-system-packages lizard==1.24.0
      - run: lizard crates/ -l rust -C 40

  # Kani bounded model checking over the two pure-numeric harnesses
  # (cost.rs reduce_ratio bound; table_conf gcd non-zero). Trial:
  # continue-on-error — a failure files an issue for the harness, it does
  # not gate anything. The kani crate is supplied by the toolchain, so
  # the harnesses carry no Cargo dependency.
  kani:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc g++ make python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned Kani
        run: |
          ver=kani-0.67.0
          curl -sSfL -o kani.tar.gz "https://github.com/model-checking/kani/releases/download/${ver}/${ver}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf kani.tar.gz
          ./"${ver}-x86_64-unknown-linux-gnu"/install.sh --prefix "$HOME/.kani"
          echo "$HOME/.kani/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain
      - run: cargo kani -p oxpinyin-core -p oxpinyin-data

  # Mutation testing, scoped to where test strength matters most (the
  # study's priority list): core's parsers/scoring and the user-store
  # persistence cluster. Trial: continue-on-error; the score is evidence
  # about test strength, not a gate. Scope is spelled as CLI --file
  # flags because cargo-mutants' config-file keys still move between
  # releases.
  mutants:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-mutants --locked
      - run: >
          cargo mutants --locked --no-times
          --file crates/oxpinyin-core/src/parser.rs
          --file crates/oxpinyin-core/src/full_pinyin_index.rs
          --file crates/oxpinyin-core/src/scheme.rs
          --file crates/oxpinyin-core/src/scoring.rs
          --file crates/oxpinyin-user/src/store.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out

  # nextest over the whole workspace: proven equivalent locally (751/751
  # vs cargo test). If this stays green on the schedule, flipping the PR
  # gate's unit lane to nextest is a one-line follow-up.
  nextest:
    runs-on: ubuntu-latest
    container:
      image: debian:testing # deliberately unpinned; see the header comment
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare runner essentials (apt)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends bash tar gzip zstd git ca-certificates curl gcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register the checkout as a git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          curl --fail --location --retry 3 --show-error https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$channel"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-nextest
        run: |
          ver=0.9.143
          sum=6d891c18105ec2d33f6e441a4f92b7ccab47ba263e22055c8bb66884243f3389
          curl -sSfL -o cargo-nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sum}  cargo-nextest.tar.gz" | sha256sum -c -
          tar xzf cargo-nextest.tar.gz
          mkdir -p ~/.local/bin
          install -m755 cargo-nextest ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo nextest run --locked --workspace
      # doctests stay on cargo test (nextest does not run them)
      - run: cargo test --locked --workspace --doc
