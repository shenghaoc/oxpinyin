[project]
name = "oxpinyin-tools"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "semver>=3,<4",
]

[dependency-groups]
complexity = ["lizard>=1.26.1"]
lint = ["ruff>=0.17.6"]

[tool.ruff]
# These files are unmodified copies from the pin.
extend-exclude = ["tools/scripts2/upstream"]

[tool.ruff.lint]
select = ["F", "B"]
