[package]
name = "oxpinyin-kmm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Training-only K-mixture-model operations on the pin's flexible-bigram container: validate, merge, prune, estimate, generate, import and export. Never ships."

[lints]
workspace = true

[features]
# The flexible-bigram container selects exactly one store backend. The seven
# utilities forward their selection here; the default is the reference
# backend, as in the workspace.
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-store/kyotocabinet"]
bdb = ["oxpinyin-store/bdb"]
tkrzw = ["oxpinyin-store/tkrzw"]

[dependencies]
# The pin's FlexibleBigram container: hash DBM class, raw records and the
# backend-native walk member 4 ported.
oxpinyin-store = { workspace = true }
# The pin's edge calls: GLib options and text, C stdio, C++ getline.
oxpinyin-input = { workspace = true, features = ["tools"] }

[dev-dependencies]
oxpinyin-testsupport = { path = "../oxpinyin-testsupport" }
tempfile.workspace = true
