[package]
name = "oxpinyin-runtime"
description = "Concrete engine assembly shared by oxpinyin consumers (C ABI, tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Intentionally not published to crates.io while pre-alpha; consumers are the
# workspace crates.
publish = false

[dependencies]
oxpinyin-core.workspace = true
# The workspace table carries default-features = false for the
# store-reaching edges; the [features] block below forwards the backend
# selection.
oxpinyin-data.workspace = true
oxpinyin-engine.workspace = true
oxpinyin-user.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Backend selection, forwarded to oxpinyin-user, which carries it down
# user -> data -> store (one backend per binary; see oxpinyin-store's
# [features] for the peer model). Berkeley DB is the default selection.
default = ["bdb"]
kyotocabinet = ["oxpinyin-user/kyotocabinet"]
bdb = ["oxpinyin-user/bdb"]
tkrzw = ["oxpinyin-user/tkrzw"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Local table: stops workspace inheritance, so restate the
# workspace-only additions here as well.
must_use_candidate = "warn"
