[package]
name = "oxpinyin-testsupport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared test support for the oxpinyin workspace: fixture-backed trait doubles. Never a dependency of shipping code."

[lints]
workspace = true

[dependencies]
oxpinyin-core.workspace = true
# Backend-aware table naming for the fixture export dir; never a
# dependency of shipping code.
oxpinyin-store = { workspace = true }

# Forwards the backend selection, matching oxpinyin-data's block.
[features]
default = ["kyotocabinet"]
kyotocabinet = ["oxpinyin-store/kyotocabinet"]
tkrzw = ["oxpinyin-store/tkrzw"]
lmdb = ["oxpinyin-store/lmdb"]
redb = ["oxpinyin-store/redb"]
