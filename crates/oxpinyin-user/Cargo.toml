[package]
name = "oxpinyin-user"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "oxpinyin internal crate — no stability promise; use oxpinyin-engine."

[lints]
workspace = true

[dependencies]
oxpinyin-core = { workspace = true }
# The user store persists in the backend's native user files; the codecs
# (chunk builder, tree record builders, SingleGram, the logger and
# user.conf codecs) live in oxpinyin-data beside their readers.
oxpinyin-data = { workspace = true }
# The pin's path, chunk-save, rename and unlink calls (external-I/O stage 3).
oxpinyin-input = { workspace = true }
# The workspace table carries default-features = false for this edge; the
# [features] block below forwards the backend selection.
oxpinyin-store = { workspace = true }

[features]
tools = []
# Backend selection, forwarded to oxpinyin-data, which forwards it to
# oxpinyin-store (one backend per binary; see the store's [features] for
# the model and precedence).
default = ["tkrzw"]
kyotocabinet = ["oxpinyin-data/kyotocabinet"]
bdb = ["oxpinyin-data/bdb"]
tkrzw = ["oxpinyin-data/tkrzw"]

[dev-dependencies]
# Store micro-benches (benches/); workspace lock pins 0.8.
criterion = "0.8"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
tempfile.workspace = true
# The session tests' failed Berkeley DB user bigram
# (`BdbUserBigramDb::failed_container`), a test-only hook; a dev-dependency
# feature never reaches the normal build.
oxpinyin-store = { workspace = true, features = ["test-hooks"] }

[[bench]]
name = "export_phrases"
harness = false

[[bench]]
name = "phrase_read"
harness = false
